ahsulot xaridori uchun qulay kredit shartlarini tuzish va moliyaviy subsidiyalarni taqsimlashni.", "Mahsulotni ishlab chiqarishda qatnashgan mutaxassislar uchun moddiy mukofotlar tayinlash tartibini."], ["Manbada keltirilgan \"moslashuvchanlik\" atamasining ta’rifi qaysi javobda to‘g‘ri berilgan?", "Nomaqbul ta’sir ko‘rsatmasdan mahsulot, jarayon yoki xizmatlarni birgalikda qo‘llashga yaroqliligi.", "Muayyan talablarni bajarishda bir buyum o‘rniga aynan boshqa bir buyumni to‘liq ishlata olish xossasi.", "Ehtiyojni qondirish maqsadida zarur bo‘lgan eng maqbul o‘lchamlarni saralab olish qobiliyati sanaladi.", "Mahsulotning tashqi muhit harorati o‘zgarishiga nisbatan mexanik chidamliligini ko‘rsatuvchi xossasi."], ["Bir buyum yoki xizmat o‘rniga boshqasidan bir xil talab bilan foydalanish imkoniyati nima deb ataladi?", "O‘zaro almashuvchanlik deb ataladi.", "Har xillikni boshqarish deb ataladi.", "Texnologik moslashuvchanlik deyiladi.", "Tizimli unifikatlashtirish sanaladi."], ["\"Har xillikni boshqarish\" (unifikatlashtirish yoki birxillashtirish) deganda nima tushuniladi?", "Muayyan ehtiyojni qondirish uchun eng maqbul o‘lcham yoki turlarni tanlash.", "Mahsulotlarning barcha turlarini to‘liq qisqartirib bittasiga keltirish.", "Yangi ishlab chiqariladigan barcha tovarlarning narxlarini tenglashtirish.", "Mahsulot sifat ko‘rsatkichlarini faqat xorijiy andozalarga moslashtirish."], ["Matnga ko‘ra, standartlashtirish qaysi sohalarni bir-biriga bog‘lovchi vosita hisoblanadi?", "Iqtisod, texnologiya va fundamental fanlar sohalarini.", "Falsafa, madaniyatshunoslik va filologiya sohalarini.", "Geografiya, arxeologiya hamda jahon tarixi fanlarini.", "Bank tizimi, davlat byudjeti va soliq siyosatini ham."], ["Quyidagilardan qaysi biri standartlashtirish prinsiplaridan biri hisoblanadi?", "Standartlarga qat’iy rioya qilish majburiyati prinsipi.", "Mahsulot tannarxini bozorlarda erkin belgilash prinsipi.", "Standart talablarini davriy bekor qilish imkoni prinsipi.", "Korxonalararo o‘zaro tijoriy yashirinlik saqlash prinsipi."], ["Standartlashtirishning qaysi prinsipi ishlab chiqarish hujjatlarining to‘liq rasmiylashtirilishini talab etadi?", "Komplektlilik prinsipi talab etadi.", "Sistemaviylik prinsipi talab etadi.", "Ilmiy asoslilik prinsipi talab etadi.", "Namunaviy ijrolik prinsipi talab etadi."], ["Berilgan matnga muvofiq, standartlashtirish ob’ektiga qaysi javobda keltirilganlar kiradi?", "Mahsulot, jarayon va xizmat kiradi.", "Korxona, bino va inshootlar kiradi.", "Faqatgina xomashyo va jihoz kiradi.", "Ishchilar, ish o‘rni va texnika kiradi."], ["Standartlashtirishning asosiy maqsadlaridan biri qaysi javobda to‘g‘ri keltirilgan?", "Aholi hayoti, mol-mulki va tabiat xavfsizligini ta’minlash hamda resurslarni tejash.", "Korxonalarning barcha ichki tijorat sirlarini ommaviy axborot vositalarida yoritish.", "Ishlab chiqarish korxonalarida texnik reglamentlar o‘rniga shartnomalarni qo‘llash.", "Barcha sanoat tarmoqlarida mahsulot ishlab chiqarish hajmini asossiz tez oshirish."], ["Standartlashtirishning asosiy vazifalaridan biri qaysi javobda to‘g‘ri ifodalangan?", "O‘lchov birligini ta’minlash hamda texnika-iqtisodiy axborotni tasniflash tizimini yaratish.", "Mahsulot ishlab chiqaruvchilar orasida narx bo‘yicha sun’iy monopoliya tuzilishiga erishish.", "Chet eldan keltirilayotgan tovarlarga nisbatan qat’iy majburiy boj to‘lovlarini belgilab qo‘yish.", "Standartlashtirish talablarini faqatgina kichik biznes korxonalari uchun majburiy etib kiritish."], ["Standartlashtirishning vazifalari qatoriga quyidagilardan qaysi biri kiradi?", "Sinovlarni me’yoriy ta’minlash, sifatni sertifikatlashtirish va nazorat qilish.", "Korxonalarga moliyaviy kreditlar ajratish va ularning foizlarini pasaytirish.", "Korxona xodimlarining oylik ish haqlarini rejalashtirish va hisoblab chiqish.", "Yangi qurilayotgan barcha korxonalarni faqat davlat byudjetidan moliyalash."], ["\"Sertifikatlashtirish\" atamasi qaysi lotincha so'zdan olingan bo'lib, uning leksik ma'nosi nimani anglatadi?", "\"Cyertifus\" so'zidan olingan bo'lib, guvohlik berish va ishonch bildirish ma'nosini anglatadi.", "\"Standardus\" so'zidan olingan bo'lib, namunaga solish va qat'iy me'yorni o'rnatishni anglatadi.", "\"Qualitas\" so'zidan olingan bo'lib, xususiyatlarni baholash va tekshirish ma'nosini bildiradi.", "\"Legitimus\" so'zidan olingan bo'lib, qonuniy kuchga kiritish va tasdiqlash jarayonini bildiradi."], ["Lotin tilidan to'g'ridan-to'g'ri tarjima qilinganda \"sertifikat\" so'zi qanday ma'noni ifodalaydi?", "\"To'g'ri bajarilgan\" degan aniq ma'noni anglatuvchi tushuncha sifatida qo'llaniladi.", "\"Qonuniy himoyalangan\" degan yuridik ma'noni ifodalovchi maxsus atamani bildiradi.", "\"Yuqori sifatli mahsulot\" degan texnik tavsifni belgilovchi maxsus atamani bildiradi.", "\"Davlat tomonidan tasdiqlangan\" degan huquqiy xulosani aks ettiruvchi atamani bildiradi."], ["Kundalik hayot va tijorat amaliyotida \"sertifikat\" atamasi qaysi asrdan boshlab keng qo'llanila boshlagan?", "XIX asrdan boshlab amaliyotga keng kirib kelgan va faol tarzda ishlatila boshlagan.", "XX asrning o'rtalaridan boshlab tijorat faoliyatida muntazam qo'llanila boshlagan.", "XVIII asr boshlarida xalqaro savdo munosabatlarida dastlabki tarzda qo'llanilgan.", "XVII asr oxiridan boshlab sanoat korxonalari faoliyatida sinovdan o'ta boshlagan."], ["Sertifikatlashtirish tizimining bosh maqsadi qaysi bandda to'liq va aniq ifodalangan?", "Muvofiqlikni sertifikatlashtirish tadbirlari, tartiblari va boshqaruv qoidalarini ishlab chiqish.", "Barcha sanoat korxonalarida mahsulot tannarxini qat'iy pasaytirish choralarini amalga oshirish.", "Faqatgina chet eldan import qilinayotgan tovarlarning bojxona nazorati qoidalarini belgilash.", "Iste'molchilarning shikoyatlarini qabul qilish va ularga moddiy tovon to'lash tizimini tuzish."], ["Quyidagilardan qaysi biri sertifikatlashtirish tizimining asosiy vazifalari qatoriga kiritilgan?", "Sertifikatlashtirishda qo'llaniladigan hujjatlarning yagona tizimini to'liq tashkil qilish.", "Ishlab chiqarish korxonalariga to'g'ridan-to'g'ri moliyaviy investitsiyalarni taqsimlab berish.", "Xalqaro savdo birjalarida sotilayotgan xomashyolarning yagona bozor narxlarini qat'iy o'rnatish.", "Mahsulotlarni chakana savdo tarmoqlariga yetkazib berishning logistika tizimini rejalashtirish."], ["O'zbekiston Sertifikatlashtirish milliy tizimi xorijiy tashkilotlar uchun qanday shart bilan ochiq hisoblanadi?", "Milliy sertifikatlashtirish tizimi tomonidan belgilangan qoidalarni so'zsiz tan olish sharti bilan.", "Xalqaro akkreditatsiya markazlarining maxsus moliyaviy grantlarini taqdim etish sharti bilan.", "Davlat bojxona qo'mitasining maxsus yillik litsenziyasi va ruxsatnomasini rasmiylashtirish bilan.", "O'zbekiston hududida yirik qo'shma korxona yoki doimiy vakolatxona ochgan bo'lishi sharti bilan."], ["O'zbekiston Respublikasi sertifikatlashtirish milliy tizimi qaysi davlat tizimi bilan uzviy bog'liq holda ishlamaydi?", "Soliq ma'muriyatchiligini yuritish va fiskal tushumlarni rejalashtirish davlat tizimi (O'zST).", "O'zbekiston Respublikasining davlat standartlashtirish bo'yicha yagona tizimi (O'zDST).", "O'zbekiston Respublikasining o'lchashlar birligini ta'minlash bo'yicha davlat tizimi (O'zO'DT).", "O'zbekiston Respublikasining akkreditatsiya jarayonlarini boshqaruvchi tizimi (O'zAT)."], ["Sertifikatlashtirish sinovlari qayerda va qanday muassasalarda bevosita amalga oshiriladi?", "Akkreditatsiyadan o'tgan maxsus sinov laboratoriyalari va ixtisoslashgan sinov markazlarida.", "Faqat ishlab chiqaruvchi korxonaning ichki sifat nazorati bo'limi laboratoriya xonalarida.", "Tovar xomashyo birjasining maxsus tekshiruv va ekspertiza qilish idoralari binolarida.", "Mahsulot sotilishi rejalashtirilgan yirik chakana savdo tarmoqlari omborxona majmualarida."], ["Bozor munosabatlari sharoitida ixtiyoriy sertifikatlashtirishning asosiy vazifasi va roli nimalardan iborat?", "Iste'molchiga mahsulot tanlashda ko'maklashish va tovarning raqobatbardoshligini oshirish.", "Korxonani barcha davlat soliqlaridan hamda mahalliy yig'imlardan butunlay ozod etish.", "Tovarning chakana sotuv narxini oshirib, ishlab chiqaruvchining monopol mavqeini yaratish.", "Mahsulotning texnik hujjatlarini boshqa raqobatchi ishlab chiqaruvchilardan sir saqlash."], ["Majburiy sertifikatlashtirishning eng asosiy va ustuvor hisoblangan jihatlari nimadan iborat?", "Mahsulotning inson hayoti uchun to'liq xavfsizligi hamda ekologik tozaligini ta'minlash.", "Tovarning tashqi estetik ko'rinishi va jahon bozoridagi ommabop dizayn talablariga mosligi.", "Ishlab chiqarish jarayonida sarflanadigan barcha xarajatlarni maksimal darajada kamaytirish.", "Mahsulotning tannarxi pastligi va ichki bozordagi savdo aylanmasining yuqori tezkorligi."], ["O'zbekistonda majburiy sertifikatlashtirilishi shart bo'lgan mahsulotlar ro'yxatini qaysi organ tasdiqlaydi?", "O'zbekiston Respublikasi Vazirlar Mahkamasi tomonidan tegishli qaror asosida tasdiqlanadi.", "O'zbekiston Savdo-sanoat palatasi boshqaruvi tomonidan har yili alohida tasdiqlanadi.", "Iqtisodiyot va moliya vazirligi huzuridagi maxsus ekspertlar kengashi tasdiqlaydi.", "Monopoliyaga qarshi kurashish qo'mitasining hududiy boshqarmalari tomonidan tasdiqlanadi."], ["O'zbekiston milliy sertifikatlashtirish tizimida jami nechta rasmiy sxema qabul qilingan?", "Milliy tizim doirasida amaliyotda qo'llash uchun jami to'qqizta alohida sxema qabul qilingan.", "Milliy tizim doirasida mahsulotlarni tasdiqlash uchun jami o'n ikkita sxema tasdiqlangan.", "Milliy tizim doirasida ishlab chiqarishni baholash uchun jami yettita sxema tasdiqlangan.", "Milliy tizim doirasida xizmatlar sohasini qamrab oluvchi jami beshta sxema ishlab chiqilgan."], ["Sertifikatlashtirishning 1-sxemasi qanday hollarda va qay tartibda amaliyotga tatbiq etiladi?", "Namuna turini sinashda va mahsulotga aniq bir me'yoriy hujjat bo'lmagan hollarda qo'llaniladi.", "Ishlab chiqarish jarayonini kompleks tekshirish hamda savdo tarmoqlarini qamrab olishda qo'llaniladi.", "Xalqaro standartlarga asosan sifat tizimlarini mukammal baholash va audit qilishda qo'llaniladi.", "Har bir mahsulot donasini alohida va sinchkovlik bilan laboratoriya sinovidan o'tkazishda qo'llaniladi."], ["Sertifikatlashtirishning 2-sxemasi bo'yicha nazorat tekshiruvida namunalar qayerdan tanlab olinadi?", "Tekshiruv uchun namunalar bevosita amaldagi chakana savdo shahobchalaridan tanlab olinadi.", "Tekshiruv uchun namunalar korxonaning tayyor mahsulotlar saqlanadigan omboridan olinadi.", "Tekshiruv uchun namunalar bevosita ishlab chiqarish konveyeri liniyasidan tanlab olinadi.", "Tekshiruv uchun namunalar xomashyo yetkazib beruvchi tashqi ta'minotchi korxonadan olinadi."], ["Sertifikatlashtirishning 3-sxemasi 1 va 2-sxemalardan qaysi asosiy jihati bilan farqlanadi?", "Laboratoriya sinovlari bilan birga ishlab chiqarish jarayonining ham o'rganilishi bilan farqlanadi.", "Faqatgina tayyor tovarning estetik xususiyatlarini ekspertiza qilish bilan farqlanadi.", "Mahsulot partiyasidan tasodifiy usulda tanlab olingan yagona namunani sinash bilan farqlanadi.", "Inspeksion nazorat tekshiruvining savdo nuqtalarida mutlaqo bekor qilinishi bilan farqlanadi."], ["Sertifikatlashtirishning 4-sxemasida inspeksion nazorat uchun namunalar qayerlardan olinishi mumkin?", "Namunalar ishlab chiqarish korxonasining o'zidan ham, savdo shahobchasidan ham olinishi mumkin.", "Namunalar faqatgina xorijiy davlatdan olib kelinayotgan chegara bojxona punktlaridan olinadi.", "Namunalar faqat iste'molchilarning xonadonlaridan shikoyat kelib tushgan hollarda olinadi.", "Namunalar faqat xalqaro akkreditatsiyadan o'tgan chet el sertifikatlash idoralaridan olinadi."], ["Menejment tizimini baholashda qo'llaniladigan va Yevropa davlatlarida ommalashgan sxema qaysi?", "Menejment tizimini baholash va davriy inspeksiya o'tkazishni nazarda tutuvchi 6-sxema.", "Ishlab chiqarilayotgan mahsulot xavfsizligini kafolatlovchi an'anaviy bo'lgan 2-sxema.", "Katta mahsulot guruhidan namuna tanlab olishga ixtisoslashgan murakkab bo'lgan 7-sxema.", "Mahsulotlar partiyasini sinashga mo'ljallangan yengillashtirilgan qoidalarga ega 1-sxema."], ["Mahsulotlar soni juda kam va o'ta mas'uliyatli bo'lgan hollarda har bir dona uchun qaysi sxema tatbiq etiladi?", "Har bir buyumni alohida tekshirish va sertifikatlashni ko'zda tutuvchi 8-sxema.", "Yetkazib berilgan tovarlar guruhidan namuna tanlab olishga asoslangan 7-sxema.", "Menejment tizimini to'liq tekshirish va unga xulosa berishga qaratilgan 6-sxema.", "Xavfsizlik talablariga muvofiqlikni deklaratsiyalash orqali tasdiqlovchi 9-sxema."], ["Sertifikatlashtirish jarayonida bevosita qatnashuvchi tomonlar kimlardan iborat?", "Birinchi tomon – ishlab chiqaruvchi, ikkinchi tomon – iste'molchi, uchinchi tomon – sertifikatlashtirish organi.", "Birinchi tomon – bojxona idorasi, ikkinchi tomon – yuk tashuvchi, uchinchi tomon – sotuvchi tashkilot.", "Birinchi tomon – ta'minotchi korxona, ikkinchi tomon – tuman hokimligi, uchinchi tomon – tijorat banki.", "Birinchi tomon – xomashyo yetkazuvchi, ikkinchi tomon – vositachi kompaniya, uchinchi tomon – xaridor fuqaro."], ["O'zbekiston Respublikasida mahsulotlar uchun beriladigan muvofiqlik sertifikatining amal qilish muddati necha yil?", "Mahsulotlar uchun rasmiylashtirilgan muvofiqlik sertifikati 3 yil muddatga beriladi.", "Mahsulotlar uchun rasmiylashtirilgan muvofiqlik sertifikati 5 yil muddatga beriladi.", "Mahsulotlar uchun rasmiylashtirilgan muvofiqlik sertifikati 1 yil muddatga beriladi.", "Mahsulotlar uchun rasmiylashtirilgan muvofiqlik sertifikati 10 yil muddatga beriladi."], ["Metrologiya fanining predmeti va amaliy faoliyat sifatidagi asosiy mazmuni qaysi javobda to‘liq berilgan?", "O‘lchashlar, ularning birliklari, usullari, vositalari hamda o‘lchashlar birliligini ta’minlash sohasi;", "Mahsulot xavfsizligini ta’minlash, texnik talablarni ishlab chiqish va ularni davlat ro‘yxatiga olish tizimi;", "Xomashyo sifatini laboratoriyada nazorat qilish hamda tayyor buyumlarni majburiy sertifikatlash jarayoni;", "Texnik hujjatlarni tizimlashtirish, ishlab chiqarish standartlarini tasdiqlash va qonunchilik nazorati."], ["Metrologiyada \"o‘lchashlar birliligi\" holatiga berilgan to‘g‘ri ta’rifni aniqlang.", "Natijalari qonuniy birliklarda ifodalangan va aniqlik ko‘rsatkichlari belgilangan chegaralarda bo‘lgan holat;", "Ishlab chiqarilgan barcha mahsulotlarning yagona texnik shartlar talablariga to‘liq javob beradigan holati;", "Barcha o‘lchash asboblarining xalqaro etalonlar bilan doimiy solishtirilganligi tasdiqlangan maxsus holat;", "Laboratoriya sharoitida olingan o‘lchash ko‘rsatkichlarining ruxsat etilgan xatolikdan mutlaqo xoli holati."], ["Standartlashtirish faoliyatining bosh maqsadi quyidagilarning qaysi birida aniq ifodalangan?", "Mahsulot, xizmat, jarayon va ishlab chiqarish faoliyatiga nisbatan yagona va aniq talablarni shakllantirish;", "Ishlab chiqarilayotgan barcha turdagi mahsulotlarning narx-navosini tartibga solish va eksportini oshirish;", "Korxonalarda faqatgina yuqori unumdor texnologiyalardan foydalanishni majburiy qilib belgilab qo‘yish;", "Mahsulotlarning muvofiqligini baholash jarayonida sinov xarajatlarini maksimal darajada kamaytirib borish."], ["Normativ-texnik ma’noda \"standart\" atamasiga qanday ta’rif beriladi?", "Muayyan faoliyat yoki uning natijalariga nisbatan umumiy va ko‘p marta foydalanish uchun talab belgilovchi hujjat;", "Ishlab chiqarilgan mahsulotning belgilangan qonuniy me’yorlarga mosligini tasdiqlovchi rasmiy davlat hujjati;", "Kattalik birligini yuqori aniqlikda hosil qilish hamda boshqa asboblarga uzatishga mo‘ljallangan texnik vosita;", "Korxonaning texnologik parametrlarini davriy ravishda tekshirib boruvchi davlat metrologik nazorat akti."], ["Muvofiqlikni baholash tizimida sertifikatlashtirish jarayonining tub mohiyati nimadan iborat?", "Obyektning belgilangan talablarga muvofiqligini rasmiy tasdiqlash bilan bog‘liq baholash jarayoni;", "O‘lchash vositalarining texnik parametrlarini etalon ko‘rsatkichlariga qiyoslash va kalibrlash ishi;", "Ishlab chiqarish korxonalarida mahsulot tannarxini tahlil qilish va narx belgilashga oid amaliyot;", "Xalqaro standartlar talablarini milliy qonunchilikka moslashtirishga qaratilgan huquqiy faoliyat."], ["SI xalqaro birliklar tizimiga muvofiq elektr toki va bosimning asosiy o‘lchov birliklari qaysi javobda to‘g‘ri keltirilgan?", "Elektr toki uchun amper (A), mexanik bosim uchun esa paskal (Pa) birligi qabul qilingan;", "Elektr toki uchun volt (V), mexanik bosim uchun esa kVt·soat ko‘rsatkichi belgilangan;", "Elektr toki uchun kelvin (K), mexanik bosim uchun esa nyuton (N) birligi qo‘llaniladi;", "Elektr toki uchun om (Ω), mexanik bosim uchun esa barometr o‘lchovi asos qilib olinadi."], ["Metrologiya, standartlashtirish va sertifikatlashtirish sohalarining o‘zaro mantiqiy ketma-ketligi qanday ifodalanadi?", "Metrologiya → Standartlashtirish → Muvofiqlikni baholash → Sifat va xavfsizlik zanjiri;", "Standartlashtirish → Davlat nazorati → Sertifikatlashtirish → Metrologik ta’minot zanjiri;", "Sertifikatlashtirish → Standartlashtirish → O‘lchashlar birliligi → Texnik xavfsizlik zanjiri;", "Muvofiqlikni baholash → Metrologiya → Standartlashtirish → Nazorat va kafolat zanjiri."], ["Metrologiya tizimida \"etalon\" tushunchasi qanday vazifani bajaruvchi vosita sifatida belgilanadi?", "Birlikni yoki kattalik qiymatini hosil qilish, saqlash va boshqa vositalarga uzatish vositasi;", "Mahsulotning texnik sifat ko‘rsatkichlarini doimiy nazorat qilish uchun olingan namuna majmui;", "Laboratoriya sharoitida o‘lchash xatoliklarini matematik hisoblash uchun qo‘llanadigan usul;", "Korxona ishlab chiqarish jarayonida xavfsizlik qoidalarini belgilovchi maxsus texnik mezon."], ["Quyidagilardan qaysi biri \"o‘lchash vositasi\" tushunchasining aniq ilmiy-texnik ta’rifini ifodalaydi?", "O‘lchashlarni amalga oshirish uchun mo‘ljallangan va metrologik xususiyatlarga ega texnik vosita;", "Standart talablariga muvofiqlikni laboratoriya sharoitida tekshirish uchun olingan mahsulot;", "Fizik miqdorlarning xalqaro tizimdagi o‘lchov birliklarini belgilab beruvchi me’yoriy hujjat;", "Texnologik operatsiyalar jarayonida xavfsizlik talablarining bajarilishini tekshiruvchi asbob."], ["Energetika sohasida to‘g‘ri texnik qaror qabul qilishning mantiqiy bosqichlari qaysi javobda aks etgan?", "Yaroqli o‘lchash vositasi → Ishonchli o‘lchash natijasi → To‘g‘ri texnik qaror qabul qilish;", "Standartlashtirish hujjati → Davlat metrologik nazorati → Texnik reglamentni tasdiqlash;", "Mahsulotdan namuna olish → Laboratoriya tekshiruvi → Muvofiqlik sertifikatini berish;", "Iste’molchi ehtiyoji → Metrologik qiyoslash → Jihozlarni ta’mirlash va qayta ishga tushirish."], ["Quyidagilardan qaysi biri standartlashtirish tizimining asosiy elementlari tarkibiga to‘g‘ridan-to‘g‘ri kirmaydi?", "Mahsulotning ichki tannarxini shakllantirish va bozor narxlarini belgilash mexanizmlari;", "Standartlashtirish obyektlari hamda ularga qo‘yiladigan texnik va xavfsizlik talablari;", "Standartlashtirish bo‘yicha vakolatli davlat organlari va qabul qilingan standartlar;", "Mahsulot ko‘rsatkichlarini tekshirish uchun belgilangan sinov hamda nazorat usullari."], ["Mahsulotni sertifikatlashtirish jarayonining dastlabki uchta bosqichi qaysi tartibda amalga oshiriladi?", "Ariza berish → Hujjatlarni tahlil qilish → Sinov o‘tkazish uchun namuna olish bosqichlari;", "Hujjatlarni tahlil qilish → Laboratoriya sinovi → Muvofiqlik to‘g‘risida qaror qabul qilish;", "Namuna olish → Sertifikat rasmiylashtirish → Davlat reestriga ma’lumot kiritish ishlari;", "Ariza berish → Muvofiqlik to‘g‘risida qaror qabul qilish → Tegishli sinovlarni o‘tkazish."], ["Metrologiya, standartlashtirish va muvofiqlikni baholashda davlat nazoratining asosiy maqsadi nima?", "Belgilangan qonunchilik va texnik talablarning qat’iy bajarilishini to‘liq ta’minlash;", "Ishlab chiqarish korxonalariga majburiy moliyaviy jazolarni muntazam ravishda qo‘llash;", "Barcha turdagi mahsulotlarning ishlab chiqarish jarayonlarini to‘xtatib tekshiruv o‘tkazish;", "Korxonalarning texnologik xarajatlarini kamaytirish uchun yangi imtiyozlar ishlab chiqish."], ["Davlat nazorati tizimi qaysi salbiy holatlarning oldini olishga bevosita xizmat qiladi?", "Noto‘g‘ri o‘lchashlar, sifatsiz mahsulotlar va iste’molchini chalg‘ituvchi ma’lumotlarning;", "Bozor iqtisodiyotida erkin raqobat va xususiy tadbirkorlik faoliyatining kengayishining;", "O‘lchash vositalarini xalqaro etalonlar asosida muntazam kalibrlash va qiyoslashning;", "Korxonalarda zamonaviy innovatsion texnologiyalarning amaliyotga joriy etilishining."], ["Savdo do‘konidagi tarozining xato ko‘rsatishi amaliy jihatdan qanday salbiy oqibatga olib keladi?", "O‘lchashdagi xatolik iste’molchining iqtisodiy manfaatlariga to‘g‘ridan-to‘g‘ri zarar yetkazadi;", "Elektr energiyasining hisobdan tashqari isrof bo‘lishiga va tarmoqda yuklamaga sabab bo‘ladi;", "Mahsulotning xavfsizlik darajasini pasaytirib, texnik jihozlarning buzilishini keltirib chiqaradi;", "Korxonada xalqaro standartlashtirish qoidalarining bekor qilinishiga olib kelishi muqarrar."], ["Matnga ko‘ra, ishlab chiqarishda mahsulot sifatini to‘liq ta’minlash qaysi omillar birligida ishlaydi?", "Standartlar + Aniq o‘lchashlar + Sinovlar + Muvofiqlikni baholash + Davlat nazorati tizimi;", "Tayyor mahsulotni tanlab tekshirish + Marketing tadqiqotlari + Reklama kampaniyalari;", "Faqat xomashyo sifatini baholash + Narx siyosati + Bozor monitoringini o‘tkazish amaliyoti;", "Korxona ichki intizomi + Tashqi savdo aylanmasi + Mehnat unumdorligini oshirish dasturi."], ["Fizik kattalik qiymatini tajriba yo‘li bilan aniqlash jarayoni qaysi asosiy atama bilan nomlanadi?", "O‘lchash jarayoni (fizik kattalik qiymatini aniqlash);", "Kalibrlash jarayoni (etalon bilan o‘zaro solishtirish);", "Qiyoslash jarayoni (metrologik yaroqlilikni tekshirish);", "Baholash jarayoni (talablarga moslikni umumiy aniqlash)."], ["\"Muvofiqlikni baholash\" va \"Muvofiqlik\" tushunchalari o‘rtasidagi asosiy farq nimadan iborat?", "Muvofiqlik bu talabning bajarilishi holati, baholash esa buni aniqlash jarayonidir;", "Muvofiqlik texnik vosita hisoblanadi, baholash esa davlat tomonidan beriladigan rasmiy sertifikatdir;", "Muvofiqlik faqat o‘lchash birliklariga xosdir, baholash esa mahsulot narxini belgilash uchun xizmat qiladi;", "Muvofiqlik xalqaro talab hisoblanadi, baholash esa faqat milliy qonunchilik doirasida amalga oshiriladi."], ["Iste’molchilar huquqlarini himoya qilish nuqtayi nazaridan mahsulot yorlig‘ida nimalar ko‘rsatilishi shart?", "Mahsulot nomi, ishlab chiqaruvchi, miqdori, asosiy xususiyatlari va xavfsizlik talablari;", "Ishlab chiqarish tannarxi, logistika xarajatlari, korxona aksiyadorlari va ularning ulushi;", "Laboratoriya asboblarining kalibrlash muddatlari va ularning seriya raqamlari haqida hisobot;", "Faqatgina davlat soliq organlari tomonidan berilgan ro‘yxatga olish guvohnomasi nusxasi."], ["Elektr stansiyalarida elektr energiyasini hosil qilish va uzatishda metrologiyaning bosh vazifasi nima?", "Tok, kuchlanish va elektr energiyasi hisobining aniqligi hamda birliligini ta’minlash;", "Jihozlar va ishlab chiqarish jarayonlariga qo‘yiladigan texnik reglamentlarni tuzish;", "Tizimda ishlatiladigan qurilmalarning sertifikat talablariga mosligini qabul qilish;", "Elektr energiyasini iste’molchilarga yetkazib berishdagi narx ko‘rsatkichini belgilash."], ["Sertifikatlashtirish tushunchasiga berilgan eng to‘g‘ri ta’rif qaysi javobda ko‘rsatilgan?", "Mustaqil uchinchi tomonning obyekt muvofiqligi haqidagi rasmiy tasdig‘i", "Mahsulotning ichki laboratoriya tomonidan belgilangan me’yoriy sinovi", "Buyurtmachi va yetkazib beruvchining o‘zaro kelishilgan sifat bayonoti", "Davlat inspeksiyasining korxona ustidan olib boradigan davriy nazorati"], ["Sertifikatlashtirish sxemalarini tushunish, ishlab chiqish va boshqarishda qaysi xalqaro standart asosiy yo‘riqnoma hisoblanadi?", "ISO/IEC 17067 xalqaro standarti", "ISO/IEC 17025 xalqaro standarti", "ISO/IEC 17021 xalqaro standarti", "ISO/IEC 14001 xalqaro standarti"], ["Sertifikatlashtirish sxemasining «Tanlash» (selection) bosqichida qanday asosiy amallar bajariladi?", "Namuna, hujjatlar, sinov usullari hamda audit doirasi va mezonlari belgilanadi", "Sinov, inspeksiya, audit va taqdim etilgan me’yoriy hujjatlar tahlil qilinadi", "To‘plangan audit dalillari va sinov natijalari standart talablari bilan solishtiriladi", "Sertifikat yoki boshqa rasmiy muvofiqlik hujjati rasmiylashtirilib buyurtmachiga beriladi"], ["Sertifikatlashtirish sxemasining «Muvofiqlikni aniqlash» bosqichida qanday amaliy faoliyatlar bajariladi?", "Sinov, inspeksiya, audit hamda tegishli hujjatlarni tahlil qilish ishlari o‘tkaziladi", "Sertifikat berish yoki bermaslik bo‘yicha vakolatli komissiya yakuniy qaror qabul qiladi", "Arizani qabul qilish, baholash qamrovi va obyektning texnik imkoniyatlari aniqlanadi", "Bozor nazorati yoki davriy inspeksiya orqali mahsulot sifati yillik nazorat qilinadi"], ["Sertifikatlashtirish sxemasining «Ko‘rib chiqish» bosqichi qanday mazmunni o‘z ichiga oladi?", "Olingan barcha audit dalillari va sinov natijalari belgilangan talablar bilan solishtiriladi", "Kuzatuv auditi, doimiy inspeksiya yoki bozor namunalari orqali muvofiqlik tekshirib boriladi", "Arizachi tashkilotga muvofiqlik sertifikati va tegishli foydalanish huquqi to‘liq topshiriladi", "Sinov uchun namunalar tanlab olinadi hamda laboratoriya sinovlarining usullari tasdiqlanadi"], ["Partiya bo‘yicha mahsulot sertifikatlashtirish sxemasi qaysi holatlarda qo‘llanilishi maqsadga muvofiq hisoblanadi?", "Import qilinadigan partiyalar va kichik hajmdagi mahsulotlar uchun", "Uzluksiz konveyerda ommaviy ishlab chiqariladigan buyumlar uchun", "Bozor xavfi o‘ta yuqori bo‘lgan kimyoviy preparatlar ishlab chiqarishda", "Doimiy takomillashtirish talab qilinadigan boshqaruv tizimlari uchun"], ["Seriyali ishlab chiqariladigan mahsulotlar uchun sertifikatlashtirish sxemalarida nima sababdan faqat dastlabki sinov yetarli emas?", "Chunki keyingi ishlab chiqarish barqarorligini ham davriy nazorat qilish talab etiladi", "Chunki korxona faqat yakuniy mahsulot xavfsizligini ta’minlashga to‘liq mas’ul hisoblanadi", "Chunki sinov laboratoriyalari mahsulot partiyasini mustaqil ravishda to‘liq tekshirolmaydi", "Chunki xalqaro standartlar barcha mahsulot turlariga davriy qayta sinovni qat’iy taqiqlaydi"], ["Menejment tizimi bilan integratsiyalashgan mahsulot sertifikatlashtirish sxemasi qaysi obyektlar uchun qo‘llanadi?", "Yuqori ishonchlilik zarur bo‘lgan seriyali ishlab chiqariladigan mahsulotlar uchun", "Bir martalik yetkazib beriladigan kichik hajmli xorijiy import partiyalari uchun", "Faqatgina sinovdan o‘tkazish murakkab bo‘lmagan oddiy xalq iste’moli mollari uchun", "Bozor talabi past va ishlab chiqarish jarayoni to‘xtatilgan eski namunalar uchun"], ["ISO 9000:2026 standartining amaliy ahamiyati va asosiy vazifasi nimalardan iborat?", "Sifat menejmentining fundamental tushunchalari, tamoyillari va terminologiyasini belgilaydi", "Tashkilot boshqaruv tizimiga uchinchi tomon sertifikatlashtirish talablarini to‘liq o‘rnatadi", "Menejment tizimlarini audit qilish tartibi va auditorlar malakasini baholashni ko‘rsatadi", "Tashkilotning barqaror muvaffaqiyatiga erishish va o‘zini baholash yo‘riqnomasini beradi"], ["ISO 9000 oilasida tashkilotlar sifat menejmenti tizimini uchinchi tomon sertifikatlashtirishi uchun qaysi standart qo‘llanadi?", "ISO 9001 standarti", "ISO 9000 standarti", "ISO 9004 standarti", "ISO 19011 standarti"], ["ISO 9004:2018 standartining asosiy maqsadi va yo‘nalishi nimadan iborat?", "Tashkilotning barqaror muvaffaqiyatini oshirish, yetuklik va o‘zini-o‘zi baholash bo‘yicha tavsiyalar beradi", "Uchinchi tomon mustaqil auditorlik tekshiruvlarini o‘tkazishning qat’iy mezonlarini to‘liq belgilaydi", "Sifat menejmenti sohasidagi xalqaro terminlar va asosiy tushunchalarning umumiy lug‘atini taqdim etadi", "Sertifikatlashtirish organlarining akkreditatsiyadan o‘tish tartibi va texnik talablarini ifodalaydi"], ["ISO 19011:2026 standarti menejment tizimlarida qanday amaliy vazifani bajarishga mo‘ljallangan?", "Audit tamoyillari, audit dasturini boshqarish, o‘tkazish va auditor kompetensiyasi bo‘yicha yo‘riqnoma beradi", "Kichik va o‘rta biznes korxonalarida mahsulot tannarxini tahlil qilish metodikasini to‘liq taqdim etadi", "Ishlab chiqarish quvvatlarini texnologik jihatdan modernizatsiya qilish bo‘yicha umumiy talablarni o‘rnatadi", "Korxonada ishlab chiqarilayotgan barcha mahsulotlarning texnik xavfsizlik parametrlarini kafolatlaydi"], ["Quyidagilardan qaysi biri sifat menejmentining 7 ta asosiy tamoyilidan biri hisoblanmaydi?", "Maksimal foyda olishga yo‘naltirilganlik", "Dalillarga asoslangan qaror qabul qilish", "O‘zaro munosabatlarni puxta boshqarish", "Xodimlarni umumiy ishlarga faol jalb qilish"], ["ISO 9001:2015 standartining 6-bo‘limi qaysi muhim yo‘nalishni qamrab oladi?", "Xavf va imkoniyatlarni aniqlash hamda sifat maqsadlarini rejalashtirish", "Resurslar, xodimlar kompetensiyasi va hujjatlashtirilgan axborotlar", "Ichki va tashqi omillar, manfaatdor tomonlar va tizimning qamrovi", "Rahbariyat majburiyatlari, sifat siyosati hamda xodimlar vakolatlari"], ["ISO 9001:2015 standartining 8-bo‘limida qanday amaliy masalalar tartibga solinadi?", "Mahsulot talablarini boshqarish, loyihalash, xaridlar, ishlab chiqarish va nomuvofiq natijalarni nazorat qilish", "Ichki audit o‘tkazish, mijozlar qoniqish darajasini tahlil qilish va rahbariyat tomonidan tahlil o‘tkazish", "Korxonaning strategik maqsadlarini ishlab chiqish, sifat siyosatini belgilash hamda vakolatlarni taqsimlash", "Xodimlarni o‘qitish, ichki kommunikatsiya mexanizmlarini yaratish va me’yoriy hujjatlar bazasini saqlash"], ["Menejment tizimlarini sertifikatlashtirish organlariga qo‘yiladigan xalqaro talablar qaysi standartda belgilangan?", "ISO/IEC 17021-1 standarti", "ISO/IEC 17025-1 standarti", "ISO/IEC 17020-1 standarti", "ISO/IEC 17065-1 standarti"], ["ISO 9001 bo‘yicha sertifikatlashtirish auditining 1-bosqichida asosan nimalar baholanadi?", "Korxonaning auditga tayyorligi, asosiy me’yoriy hujjatlari va QMS tuzilmasi", "Barcha texnologik jarayonlarning amalda to‘liq ishlashi va yakuniy ko‘rsatkichlar", "Yillik moliyaviy hisobotlar va ishlab chiqarish quvvatlarining iqtisodiy foydasi", "Sertifikat berish bo‘yicha xolis ekspertlar kengashining yakuniy rasmiy xulosasi"], ["Audit tekshiruvi natijasida «nomuvofiqlik» holati aniqlanganda qanday to‘g‘ri ta’rif qo‘llanadi?", "Belgilangan audit mezonining bajarilmaganligi yoki unga rioya etilmasligi", "Ishlab chiqarilgan tayyor mahsulot birligining mutlaqo yaroqsiz chiqishi", "Korxona xodimlarining lavozim yo‘riqnomalari bilan to‘liq tanish emasligi", "Mijozlar tomonidan tushgan har qanday og‘zaki e’tiroz yoki shikoyat xati"], ["Sifat menejmentida «tuzatish» va «tuzatuvchi harakat» o‘rtasidagi asosiy farq nima?", "Tuzatish xatoni yo‘qotadi, tuzatuvchi harakat esa uning kelib chiqish sababini bartaraf etadi", "Tuzatish rahbariyat tomonidan qilinadi, tuzatuvchi harakat esa faqat auditorlar tomonidan bajariladi", "Tuzatish moddiy xarajat talab qiladi, tuzatuvchi harakat esa faqat hujjatlarni qayta yozishdan iborat", "Tuzatish doimiy xarakterga ega bo‘ladi, tuzatuvchi harakat esa bir martalik chora sifatida qo‘llanadi"], ["Tashkilotda ISO 9001 sertifikatining mavjudligi nimani anglatadi?", "Boshqaruv tizimining belgilangan standart talablariga muvofiq joriy qilinganini", "Ishlab chiqarilayotgan mahsulotning har bir nusxasi mutlaq nuqsonsizligini", "Mahsulotning jahon bozorida eng arzon narxda sotilishi to‘liq kafolatlanganini", "Korxonaning davlat tomonidan har qanday soliq to‘lovlaridan ozod etilganligini"], ["Texnik reglamentning asosiy ta’rifi qaysi javobda to‘g‘ri bayon etilgan?", "Mahsulot yoki xizmat xavfsizligiga oid bajarilishi majburiy bo‘lgan normativ hujjat.", "Mahsulot sifat ko‘rsatkichlarini ixtiyoriy tarzda oshirishga xizmat qiluvchi tavsiya.", "Bozordagi mahsulot narxi va sotuv hajmini tartibga soluvchi maxsus moliyaviy dastur.", "Korxona xodimlari uchun ichki tartib-qoidalarni belgilovchi tashkiliy qo‘llanmadir."], ["Texnik reglament qabul qilinishining bosh maqsadi qaysi javobda keltirilgan?", "Inson hayoti, sog‘lig‘i, mulki va atrof-muhitni xavfli ta’sirlardan to‘liq himoyalash.", "Korxonalarning raqobatbardoshligini oshirish orqali ularga katta iqtisodiy foyda berish.", "Bozorda sotilayotgan barcha tovarlarning narx-navosini bir xil me’yorda ushlab turishdir.", "Mahsulot ishlab chiqarish texnologiyalarining tezkor yangilanishini to‘xtatib turish."], ["Texnik reglament bilan milliy standart o‘rtasidagi asosiy farq nimadan iborat?", "Reglament xavfsizlik talablari majburiy, standart usullari esa ko‘pincha tavsiyaviydir.", "Standart talablari qat’iy majburiy, reglament ko‘rsatkichlari esa ixtiyoriy hisoblanadi.", "Reglament faqat narxlarni, standart esa ishlab chiqarish jarayonini nazorat qiladi.", "Standart faqat xizmatlarga, texnik reglament esa xomashyo turlariga nisbatan o‘rnatiladi."], ["Ishlab chiqaruvchi mahsulotni bozorga chiqarishdan oldin qanday majburiyatni bajarishi lozim?", "Tegishli reglament talablariga rioya etib, muvofiqlik hujjatlarini rasmiylashtirishi.", "Mahsulot tannarxini eng past darajaga tushirib, sotuv hajmini zudlik bilan oshirishi.", "Iste’molchilarning barchasiga tekin namunalar tarqatib, tavsiyanomalar to‘plashi kerak.", "Faqat xalqaro tashkilotlar ruxsatini olib, mahalliy qonunchilikni chetlab o‘tishi lozim."], ["Texnik reglamentda odatda qaysi muhim ma’lumotlar ko‘rsatib o‘tiladi?", "Qo‘llanish sohasi, xavfsizlik talablari, markirovka hamda muvofiqlikni baholash tartibi.", "Mahsulotning yillik sotuv rejalari, bozor narxlari hamda kutilayotgan sof foyda hajmi.", "Xodimlarning ish haqi miqdori, soliq to‘lovlari va korxonaning shtat jadvali me’yori.", "Faqat ishlab chiqaruvchi korxonaning ichki intizomiy nizomi hamda faoliyat yo‘nalishi."], ["Texnik reglament bilan ishlashning 2-bosqichida qanday asosiy vazifa bajariladi?", "Mahsulotga tegishli reglament aniqlanib, uning doiraga kirishi yoki kirmasligi tekshiriladi.", "Mahsulotning barcha konstruktiv nuqsonlari laboratoriya uskunalari yordamida o‘rganiladi.", "Bozorga chiqariladigan tovarlar uchun majburiy muvofiqlik sertifikatlari rasmiylashtiriladi.", "Mahsulotning narxi va tannarxi hisoblanib, uning iqtisodiy samaradorligi to‘liq baholanadi."], ["Texnik reglament bilan ishlashning 3-bosqichida qaysi omillar tahlil qilinadi?", "Foydalanishda yuzaga kelishi mumkin bo‘lgan elektr, issiqlik, mexanik va boshqa xavflar.", "Tovarni tashish va saqlashda vujudga keladigan transport xarajatlari hamda narxlar.", "Mahsulotning tashqi ko‘rinishi, rangi, estetik xususiyatlari va zamonaviy dizaynlari.", "Bozorda mahsulotga bo‘lgan o‘rtacha talab darajasi va xaridorlar qiziqishi ko‘rsatkichi."], ["Mahsulotni tekshirish bosqichida (5-bosqich) har bir talab qanday baholanadi?", "Har bir talab “mos”, “mos emas” yoki “ma’lumot yetarli emas” tarzida baholab boriladi.", "Har bir talab “qoniqarli”, “a’lo darajada” yoki “tavsiya etiladi” deb qayd qilib boriladi.", "Faqatgina “narxga ta’sir qiladi” yoki “narxga umuman ta’sir qilmaydi” deb ajratiladi.", "Faqat mahsulotning estetik ko‘rinishiga qarab “chiroyli” yoki “kamchilikli” deb topiladi."], ["Muvofiqlik darajasini hisoblash formulasidagi n harfi nimani ifodalaydi? K = (n / N) × 100 %", "Tekshiruv jarayonida reglament bo‘yicha to‘liq bajarilgan talablar sonini bildiradi.", "Tekshiruv varaqasida baholash uchun tanlab olingan jami talablarning umumiy sonidir.", "Mahsulot namunalarida aniqlangan jiddiy xavfli nomuvofiqliklarning umumiy miqdoridir.", "Laboratoriya sinovlari uchun ajratilgan ish soatlarining umumiy hisoblangan sonidir."], ["Muvofiqlik darajasini aniqlovchi K = (n / N) × 100 % formulasida N belgisi nimani anglatadi?", "Tekshiruv varaqasiga kiritilgan va baholangan barcha talablarning umumiy miqdorini.", "Mahsulotda qat’iy va to‘liq bajarilgan ijobiy xususiyatlarning jami yig‘indisini.", "Mahsulot ishlab chiqarilgan vaqtda sarflangan materiallarning me’yoriy ko‘rsatkichini.", "Sinovdan o‘tkazilayotgan korxonadagi xodimlarning umumiy o‘rtacha ro‘yxat tarkibini."], ["10 ta talabdan 9 tasi bajarilgan holatda (K = 90 %) mahsulot nima uchun xavfsiz deb topilmasligi mumkin?", "Xavfsizlikka bevosita daxldor bitta jiddiy nomuvofiqlik ham unga to‘sqinlik qila oladi.", "Muvofiqlik ko‘rsatkichi rasmiy tartibda faqat 100 % bo‘lgandagina mahsulot hisobga olinadi.", "Reglament talablariga ko‘ra har qanday tovar kamida yuzta mezon bo‘yicha tekshiriladi.", "Hisoblash natijasi 95 % dan kam bo‘lsa, mahsulot darhol yaroqsiz chiqindi deb topiladi."], ["Xavfni shartli baholashda qo‘llaniladigan R = P × S formulasida S ko‘rsatkichi nimani bildiradi?", "Yuz berishi mumkin bo‘lgan noxush hodisa yoki xavf oqibatining og‘irlik darajasini.", "Mahsulotdan noto‘g‘ri foydalanilganda vujudga keladigan ehtimoliy hodisa sonini.", "Uskunaning ishlash muddatini hamda uning texnik xavfsizlik kafolatini ifodalaydi.", "Mahsulotning umumiy tannarxi va unga qo‘yilgan savdo ustamasining yakuniy foizini."], ["Xavf darajasini ifodalovchi R = P × S formulasida P harfi nimani ifodalaydi?", "Muayyan noxush hodisa yoki xavfli vaziyatning yuz berish ehtimolligi ko‘rsatkichini.", "Mahsulotning umumiy elektr quvvati hamda kuchlanish ko‘rsatkichlarining yig‘indisini.", "Aniqlangan jami xavflarning laboratoriya varaqasidagi tartib raqami miqdorini.", "Sinovdan o‘tayotgan mahsulot korpusining mexanik mustahkamlik darajasi me’yorini."], ["Jadvalga muvofiq, tok o‘tkazuvchi qismlar sababli yuzaga keladigan xavfning oldini olish chorasi nima?", "Elektr izolyatsiyasini to‘g‘ri ta’minlash hamda ishonchli himoya vositalarini qo‘llash.", "Mahsulot korpusini faqat metall qatlam bilan qoplab, uning mustahkamligini oshirish.", "Uskunaga avtomatik tarzda suv sepuvchi yong‘inga qarshi maxsus moslama o‘rnatish.", "Mahsulotning elektr tarmog‘iga ulanish vaqtini cheklab, foydalanishni to‘xtatib turish."], ["Jadval ma’lumotlariga ko‘ra, qizigan korpus yoki bug‘ qanday xavf turiga kiradi?", "Foydalanish jarayonida inson tanasining kuyishiga sabab bo‘luvchi issiqlik xavfiga.", "Uskunaning ichki qismlarida hosil bo‘ladigan qisqa tutashuvli elektr xavfi turiga.", "Mahsulotning mustahkamligi pastligi oqibatida sinishi bilan bog‘liq mexanik xavfga.", "Kabelning uzilishi natijasida yuz beradigan va o‘t chiqishiga olib keluvchi xavfga."], ["Jadvalga binoan, suvning elektr qismiga kirishi natijasida yuzaga keladigan xavf qanday bartaraf etiladi?", "Qisqa tutashuvning oldini olish maqsadida qismlarning germetikligini ta’minlash.", "Elektr choynakning taglik qismini doimiy ravishda yuqori haroratda qizdirib turish.", "Uskunani faqat maxsus kimyoviy eritmalar bilan yuvib, changlardan tozalab borish.", "Mahsulot quvvatini ikki barobar oshirish orqali bug‘ hosil bo‘lishini tezlashtirish."], ["O‘quv natijalarini baholash mezoniga ko‘ra, muvofiqlik darajasi 75–89 % bo‘lsa, qanday xulosa qilinadi?", "Mahsulotda reglament talablariga nisbatan ayrim kamchiliklar mavjud deb topiladi.", "Mahsulot reglament talablarining asosiy qismini to‘liq va benuqson bajargan sanaladi.", "Mahsulotda xavfsizlikka to‘sqinlik qiluvchi sezilarli kamchiliklar mavjud deb topiladi.", "Tekshirilgan ko‘plab talablar bajarilmaganligi sababli tovar yaroqsiz hisoblanadi."], ["O‘quv natijalarini baholash mezoniga binoan, ko‘rsatkich 60 % dan past bo‘lsa, u qanday talqin etiladi?", "Reglamentda belgilangan ko‘plab majburiy xavfsizlik talablari bajarilmagan hisoblanadi.", "Mahsulotda faqat arzimagan nuqsonlar mavjud bo‘lib, ularni e’tiborsiz qoldirish mumkin.", "Ushbu mahsulot talablarning asosiy qismiga to‘liq javob beruvchi vosita deb tan olinadi.", "Mahsulot darhol rasmiy davlat muvofiqlik sertifikatini olish huquqiga ega bo‘ladi."], ["Laboratoriya ishida olingan muvofiqlik foizli bahosi qanday maqomga ega?", "U faqat o‘quv mashg‘ulotiga mo‘ljallangan bo‘lib, rasmiy sertifikatlash qarorini almashtirmaydi.", "U mahsulotni jahon bozorlariga to‘siqlarsiz olib chiqish uchun rasmiy litsenziya bo‘ladi.", "U davlat nazorat organlari tomonidan beriladigan yakuniy muvofiqlik sertifikati hisoblanadi.", "U tovarlarning chakana savdo narxini erkin oshirish imkonini beruvchi moliyaviy ruxsatnomadir."], ["Laboratoriya ishida nomuvofiqlikni asoslash bo‘yicha qaysi muhim qoidaga rioya qilish talab etiladi?", "Nomuvofiqlikni faqat tashqi ko‘rinishga qarab emas, hujjat va sinov ma’lumotlari bilan asoslash.", "Barcha xulosalarni faqat mahsulotning estetik ko‘rinishi va ranglariga qarab rasmiylashtirish.", "Tekshiruv jarayonida me’yoriy hujjat matnini talaba o‘z xohishicha o‘zgartirib qayd etishi.", "Shikastlangan elektr mahsulotini o‘qituvchi ruxsatisiz to‘g‘ridan-to‘g‘ri tarmoqqa ulashdir."]]}, {"name": "Temir yo‘ldan foydalanish ishlarini boshqarish", "q": [["Курс ишининг асосий мақсади ва талабалар олдига қўйилган вазифа нимадан иборат?", "Поезд тузиш режаси йўналишлари бўйича поездларни жўнатишнинг самарали вариантини танлаш", "Локомотивлар паркининг станциялар бўйлаб айланиш вақтини қисқартириш чораларини асослаш", "Саралаш тепалигининг қайта ишлаш қувватини оширишга қаратилган янги технологияни танлаш", "Тортувчи оралиқ масофасида ҳаракатланадиган юк поездларининг чегаравий тезлигини ошириш"], ["Топшириқнинг дастлабки шартларига мувофиқ поездларнинг юриш масофаси (L) қанча этиб белгиланган?", "800 км масофа ташкил этади", "600 км масофа ташкил этади", "500 км масофа ташкил этади", "400 км масофа ташкил этади"], ["Танланган йўналиш бўйича суткадаги вагонлар гуруҳларининг ўртача сони (K_гр^ўрт) қайси ифода орқали топилади?", "K_гр^ўрт = ∑K_гр / R кўринишидаги формула орқали аниқланади", "K_гр^ўрт = ∑U_ой ∙ R кўринишидаги формула орқали аниқланади", "K_гр^ўрт = ∑K_гр ∙ 24 кўринишидаги формула орқали аниқланади", "K_гр^ўрт = ∑U_сут / N_ф кўринишидаги формула орқали аниқланади"], ["Бир ой давомида битта гуруҳдаги вагонларнинг ўртача миқдори (m_гр) қайси формула билан ҳисобланади?", "m_гр = ∑U / ∑K_гр нисбати орқали ҳисоблаб топилади", "m_гр = ∑K_гр / ∑U нисбати орқали ҳисоблаб топилади", "m_гр = ∑U_сут ∙ R нисбати орқали ҳисоблаб топилади", "m_гр = ∑K_гр ∙ N_ф нисбати орқали ҳисоблаб топилади"], ["Биринчи сутка сифатида нима сабабдан айнан 23.01.2018 санаси қабул қилинган?", "Олдинги суткадан қолаётган қолдиқ вагонлар мавжудлигини инобатга олиш зарурлиги учун", "Ойнинг дастлабки кунларида саралаш станциясида ҳаракат тўлиқ тўхтатиб қўйилганлиги учун", "Локомотивлар паркининг техник кўрикдан ўтиш муддати айнан шу санага тўғри келганлиги учун", "Поездлар ҳаракатининг янги бир ойлик норматив жадвали фақат шу санадан жорий этилгани учун"], ["Ҳосил бўладиган поездларнинг ўртача суткалик меъёри (N_ф) қайси нисбат орқали аниқланади?", "N_ф = U_сут / m нисбатига асосан ҳисоблаб чиқилади", "N_ф = m / U_сут нисбатига асосан ҳисоблаб чиқилади", "N_ф = 24 / T_й нисбатига асосан ҳисоблаб чиқилади", "N_ф = K_гр / R нисбатига асосан ҳисоблаб чиқилади"], ["Тўпланиш йўлига вагонлар гуруҳининг кириб келиши орасидаги ўртача интервал (i) қайси формула билан ифодаланади?", "i = 24 / K_гр кўринишидаги формула билан аниқланади", "i = K_гр / 24 кўринишидаги формула билан аниқланади", "i = 24 / N_ф кўринишидаги формула билан аниқланади", "i = N_ф / 24 кўринишидаги формула билан аниқланади"], ["Умумий ҳолда вагонлар тўпланишига сарфланган суткалик вагон-соатлар сарфи (B) қайси формула билан топилади?", "B = 12 ∙ (m_ҳак - m_гр + 2 ∙ m_о) формуласи орқали", "B = 24 ∙ (m_ҳак + m_гр - 2 ∙ m_о) формуласи орқали", "B = 12 ∙ (m_ҳак + m_гр + m_о) формуласи орқали", "B = 24 ∙ (m_ҳак - m_гр - m_о) формуласи орқали"], ["Тадқиқотларга кўра поезд ўртача таркибининг 3% га пасайиши тўпланиш арафасидаги вагонлар туриб қолишига қандай таъсир кўрсатади?", "Умумий ўртача туриб қолиш вақтини 30% га қисқартиради", "Умумий ўртача туриб қолиш вақтини 50% га қисқартиради", "Умумий ўртача туриб қолиш вақтини 15% га қисқартиради", "Умумий ўртача туриб қолиш вақтини 10% га қисқартиради"], ["Ўзгармас график бўйича қатъий йиғилиш вақтига нима сабабдан 5 соат вақт қўшилиб жўнаш вақти («нитка») аниқланади?", "Йиғилишни тугаллаш, жўнатиш паркига ўтказиш ва кўрик вақтлари топшириқда алоҳида олинмагани сабабли", "Локомотив бригадали ишчиларининг смена алмашинуви ҳамда дам олиш вақтларини тўлиқ таъминлаш мақсадида", "Оралиқ станцияларда поездларни қабул қилиш учун йўллар захирасини олдиндан тайёрлаб қўйиш мақсадида", "Қўшни темир йўл участкаларида поездларнинг тўсиқсиз ҳаракатланишини диспетчерлик мувофиқлаштириш учун"], ["Агар саралаш паркида йиғилган вагонлар сони бўйича m_ҳис < m_m шарт бажарилса, қандай технологик қарор қабул қилинади?", "Шу кундаги энг кўп йиғилиш вақти бекор бўлиб, вагонлар кейинги гуруҳ келишини кутади", "Таркиб дарҳол тўлиқ бўлмаган вазнда навбатдаги очиқ нитка бўйича жўнатиб юборилади", "Таркибга бошқа йўналишдаги бўш вагонлар қўшилиб, меъёрга етказилгач жўнатилади", "Поезд тезлаштирилган тартибда саралаш паркидан жўнатиш паркига ўтказиб турилади"], ["Агар саралаш йўлида энг кўп йиғилиш вақтигача m_ҳис ≥ 2 ∗ m_m шарт бажарилса, қандай чора кўрилади?", "Энг кўп йиғилиш вақтигача қўшимча поезд жўнатилиб, қолган вагонлардан асосий поезд тузилади", "Барча вагонлар бирлаштирилиб, оғир вазнли битта қўшма поезд сифатида жўнатиб юборилади", "Ортиқча йиғилган вагонлар қўшни станциянинг саралаш йўлларига вақтинчалик ўтказилади", "Барча вагонлар саралаш паркида ушлаб турилиб, кейинги суткадаги нитка бўйича жўнатилади"], ["Ўзгармас график учун кам томонга яхлитлашда m_ҳис ни аниқлаш формуласидаги α коэффициенти нимани билдиради?", "Максимал поезд таркибидан қанча миқдорга камайишини кўрсатувчи коэффициентни билдиради", "Поезднинг қабул қилинган сони билан ҳисобий сони орасидаги нисбий ўзгаришни билдиради", "Бир кунда келувчи умумий вагонлар сонининг ортиб кетиш даражасини кўрсатувчи кўрсаткичдир", "Локомотивларнинг захирада туриб қолиш эҳтимолини баҳоловчи технологик коэффициентдир"], ["Ўзгармас графикда яхлитлашга рухсат этилганда m_ҳис қайси ифода орқали ҳисобланади?", "m_ҳис = m_max - Δm + (1 - α) ∙ γ ∙ Δm формуласи орқали", "m_ҳис = m_max + Δm - (1 + α) ∙ γ ∙ Δm формуласи орқали", "m_ҳис = m_max - 2 ∙ Δm + α ∙ γ ∙ Δm формуласи орқали", "m_ҳис = m_max + 2 ∙ Δm - α ∙ γ ∙ Δm формуласи орқали"], ["Таркибни йиғишни тугаллаш учун сарфланадиган вақт (t_й.т.) қандай формула билан аниқланади?", "t_й.т. = (0,002 ∙ m_ҳис² + 0,133 ∙ m_ҳис + 2,91) / 60, соат", "t_й.т. = (0,005 ∙ m_ҳис² + 0,250 ∙ m_ҳис + 1,85) / 60, соат", "t_й.т. = (0,001 ∙ m_ҳис² + 0,085 ∙ m_ҳис + 3,14) / 60, соат", "t_й.т. = (0,003 ∙ m_ҳис² + 0,180 ∙ m_ҳис + 2,45) / 60, соат"], ["Курс иши шартлари бўйича таркибни кўрикдан ўтказувчи бригадалар сони (х) нечта деб қабул қилинган?", "х = 2 та бригада деб қабул қилинган", "х = 1 та бригада деб қабул қилинган", "х = 3 та бригада деб қабул қилинган", "х = 4 та бригада деб қабул қилинган"], ["Таркибнинг жўнатишда кутиш вақти (t_жўн.кутиш) турли график шароитларида қандай қабул қилинган?", "Ўзгарувчан графикда тахминан 1,25 соат, ўзгармас график шароитида эса 0 соатга тенг", "Ўзгарувчан графикда тахминан 0,50 соат, ўзгармас график шароитида эса 1,0 соатга тенг", "Ўзгарувчан графикда тахминан 2,00 соат, ўзгармас график шароитида эса 0,5 соатга тенг", "Ўзгарувчан графикда тахминан 0,15 соат, ўзгармас график шароитида эса 2,0 соатга тенг"], ["Таркибни техник кўрикдан ўтказадиган станциялар сонини (k_тр) аниқлашда минимал масофа (l_тех) қанча қабул қилинади?", "l_тех = 300 км деб қабул қилинади", "l_тех = 200 км деб қабул қилинади", "l_тех = 400 км деб қабул қилинади", "l_тех = 500 км деб қабул қилинади"], ["Таркибнинг тарқатилишига кетадиган вақт (t_тарк) қандай эмпирик ифода орқали ҳисобланади?", "t_тарк = (0,36 ∙ m_ҳак + 6,80) / 60, соат", "t_тарк = (0,52 ∙ m_ҳак + 4,50) / 60, соат", "t_тарк = (0,28 ∙ m_ҳак + 8,10) / 60, соат", "t_тарк = (0,45 ∙ m_ҳак + 5,20) / 60, соат"], ["Курс иши якуний хулосасига кўра қайси вариант иқтисодий жиҳатдан энг самарали деб топилган?", "Юк поездларини ўзгармас график бўйича меъёрий таркибда жўнатиш усули (m=52, Δm=0)", "Юк поездларини ўзгарувчан график асосида меъёрий таркибда жўнатиш усули (m=50, Δm=0)", "Юк поездларини ўзгарувчан график бўйича қисқартирилган таркибда жўнатиш усули (Δm=6)", "Юк поездларини ўзгармас график асосида таркиб меъёрини камайтириб жўнатиш усули (Δm=9)"], ["Курс ишининг асосий мақсади ва талабалар олдига қўйилган вазифалар нимадан иборат?", "Поезд тузиш режаси бўйича юк поездларини жўнатиш усулларини қўллаш ҳамда техник-иқтисодий жиҳатдан энг самарали вариантини танлашга ўргатишдан иборат.", "Станция йўлларининг узунлигини ошириш ва ҳаракат таркибининг техник ҳолатини баҳолаш бўйича мустақил лойиҳалаш ишларини мукаммал олиб боришдан иборат.", "Локомотив бригадаларининг иш вақти балансини тузиш ҳамда участкаларда ҳаракат хавфсизлигини автоматлаштирилган тизимларда ташкил қилишдан иборат.", "Саралаш тепалигининг қайта ишлаш қувватини ошириш ва участкаларда янги турдаги светофорлар ҳамда стрелкали ўтказгичларни ўрнатишга тайёрлашдан иборат."], ["Дастлабки топшириқ бўйича поезд таркибидаги вагонларнинг меъёрий сони (m_м) ва поезд юриш масофаси (L) қанча белгиланган?", "Таркибдаги вагонлар меъёрий сони m_м = 50 вагон, юриш масофаси эса L = 800 км қилиб белгиланган.", "Таркибдаги вагонлар меъёрий сони m_м = 57 вагон, юриш масофаси эса L = 600 км қилиб белгиланган.", "Таркибдаги вагонлар меъёрий сони m_м = 52 вагон, юриш масофаси эса L = 500 км қилиб белгиланган.", "Таркибдаги вагонлар меъёрий сони m_м = 45 вагон, юриш масофаси эса L = 750 км қилиб белгиланган."], ["Танланган йўналишда бир суткадаги вагонлар гуруҳларининг ўртача сони (К_гр^ўрт) қайси формула ёрдамида аниқланади?", "К_гр^ўрт = ∑ К_гр / R ифодаси бўйича аниқланади (бу ерда R — бир ойдаги кунлар сони, яъни 30 га тенг).", "К_гр^ўрт = ∑ U / ∑ К_гр ифодаси бўйича аниқланади (бу ерда R — бир ойдаги кунлар сони, яъни 30 га тенг).", "К_гр^ўрт = R / ∑ К_гр ифодаси бўйича аниқланади (бу ерда R — бир ойдаги кунлар сони, яъни 30 га тенг).", "К_гр^ўрт = U_сут / N_ф ифодаси бўйича аниқланади (бу ерда R — бир ойдаги кунлар сони, яъни 30 га тенг)."], ["Бир ой давомида танланган йўналишда битта гуруҳдаги вагонларнинг ўртача миқдори (m_гр) қандай формула билан ҳисобланади?", "m_гр = ∑ U / ∑ К_гр формуласи орқали ойлик вагонлар сонини гуруҳлар сонига бўлиш билан топилади.", "m_гр = ∑ К_гр / 30 формуласи орқали ойлик вагонлар сонини гуруҳлар сонига бўлиш билан топилади.", "m_гр = (m_ҳ − m_о) / 24 формуласи орқали ойлик вагонлар сонини гуруҳлар сонига бўлиш билан топилади.", "m_гр = U_сут / m_макс формуласи орқали ойлик вагонлар сонини гуруҳлар сонига бўлиш билан топилади."], ["Ҳисоб-китобларда биринчи сутка сифатида нега айнан 23.01.2018 санаси қабул қилинади?", "Олдинги сутка (22.01.2018)дан қолаётган қолдиқ вагонлар сони аниқланиб, кейинги кунга ўтказилиши учун.", "Поездлар ҳаракатининг янги ойлик графиги расман айнан шу кундан бошлаб кучга кириши белгилангани учун.", "Саралаш паркидаги барча йўллар олдинги вагонлардан тўлиқ бўшатилиб, янгича ҳисоб юритилиши кераклиги учун.", "Локомотивлар парки тўлиқ техник кўрикдан ўтказилиб, режали айланиш жадвали қайта тасдиқлангани учун."], ["Тўлиқ таркибли барча поездларни ўзгарувчан график бўйича жўнатиш амалиётининг асосий салбий оқибати нимадан иборат?", "Ўтказиш қобилиятининг йўқотилиши, вагон айланмаси секинлашиши ва поездлар оқимининг тўпланиб қолишидир.", "Локомотивларнинг бекор туриб қолиши бутунлай тугатилиб, станция йўлларида юқори тезлик юзага келишидир.", "Электр энергия сарфи кескин камайиши оқибатида участкаларда ҳаракат тезлигининг пасайиб кетишидир.", "Поезд тузиш режасининг бузилиши натижасида маҳаллий вагонлар оқимининг тўлиқ тўхтаб қолиш ҳолатидир."], ["Таркиб тўпланишини таҳлил қилишда туташувчи гуруҳнинг ўртача катталиги (m_гр^Т) қайси формула билан ифодаланади?", "m_гр^Т = m_гр^й + m_о кўринишида тўпловчи ва қолдиқ вагонлар гуруҳининг йиғиндиси сифатида ифодаланади.", "m_гр^Т = m_гр^й − m_о кўринишида тўпловчи ва қолдиқ вагонлар гуруҳининг йиғиндиси сифатида ифодаланади.", "m_гр^Т = (m_ҳ − m_о) / n кўринишида тўпловчи ва қолдиқ вагонлар гуруҳининг йиғиндиси сифатида ифодаланади.", "m_гр^Т = m_макс − 2·Δm кўринишида тўпловчи ва қолдиқ вагонлар гуруҳининг йиғиндиси сифатида ифодаланади."], ["Таркиблар тўпланиш даврининг ўртача катталиги (T_й) вақти қайси формула бўйича ҳисобланади?", "T_й = 24 / N_ф кўринишидаги формула бўйича сутка соатларини поездлар меъёрига бўлиш орқали топилади.", "T_й = 24 / К_гр кўринишидаги формула бўйича сутка соатларини поездлар меъёрига бўлиш орқали топилади.", "T_й = U_сут / m кўринишидаги формула бўйича сутка соатларини поездлар меъёрига бўлиш орқали топилади.", "T_й = L / v_уч кўринишидаги формула бўйича сутка соатларини поездлар меъёрига бўлиш орқали топилади."], ["Вагонлар тўпланишига сарфланган вагон-соатларнинг умумий ўртача суткалик ҳаражатлари (B) қандай формула билан аниқланади?", "B = 12·(m_ҳак − m_гр + 2·m_о) кўринишидаги математик муносабат орқали аниқланади.", "B = 24·(m_ҳак + m_гр − 2·m_о) кўринишидаги математик муносабат орқали аниқланади.", "B = 12·(m_ҳак + m_гр − m_о) кўринишидаги математик муносабат орқали аниқланади.", "B = 24·(m_макс − Δm + m_о) кўринишидаги математик муносабат орқали аниқланади."], ["Таркибнинг ўзгарувчан нормасида минимал рухсат этилган таркиб катталиги (m_min) қандай формула билан ифодаланади?", "m_min = m − Δm = m_max − 2·Δm кўринишида максимал чегара ва четланишлар орқали аниқланади.", "m_min = m + Δm = m_max + 2·Δm кўринишида максимал чегара ва четланишлар орқали аниқланади.", "m_min = m_max − Δm / 2 кўринишида максимал чегара ва четланишлар орқали аниқланади.", "m_min = (m_max − m_о) / n кўринишида максимал чегара ва четланишлар орқали аниқланади."], ["Оригинал матнга кўра қатъий белгиланган таркибда бир ойда йиғилган жами вагонлар сони (∑U) ва ўртача суткалик оқим (U_сут^ўрт) қанча бўлган?", "Бир ойда умумий вагонлар сони ∑U = 2707 вагон, суткалик ўртача оқим эса U_сут^ўрт ≈ 90 вагонни ташкил этди.", "Бир ойда умумий вагонлар сони ∑U = 4089 вагон, суткалик ўртача оқим эса U_сут^ўрт ≈ 136 вагонни ташкил этди.", "Бир ойда умумий вагонлар сони ∑U = 3500 вагон, суткалик ўртача оқим эса U_сут^ўрт ≈ 116 вагонни ташкил этди.", "Бир ойда умумий вагонлар сони ∑U = 2100 вагон, суткалик ўртача оқим эса U_сут^ўрт ≈ 70 вагонни ташкил этди."], ["Ўзгармас графикда поезднинг қатъий йиғилиш вақтига жўнаш вақтини («нитка»ни) белгилаш учун нега айнан 5 соат вақт қўшилади?", "Таркибни саралашдан жўнатиш паркига олиб ўтиш, техник ва тижорий кўрикдан ўтказиш вақтларини ҳисобга олиш учун.", "Локомотив бригадаларининг дам олиш вақтини таъминлаш ҳамда тепловозларга ёқилғи қуйиш ишларини бажариш учун.", "Оралиқ станцияларда поездлар қабул қилинишига йўл бўшашини ва диспетчерлик буйруғи чиқишини кутиб туриш учун.", "Вагонларни қайта саралаш ва ҳужжатларни божхона кўригидан ўтказиш бўйича мажбурий тартиб-қоидалар талаби учун."], ["Ўзгармас график учун кам томонга яхлитлашга рухсат этилганда ҳисобий таркиб (m_ҳис) қайси формула бўйича топилади?", "m_ҳис = m_max − Δm + (1 − α)·γ·Δm кўринишидаги тегишли коэффициентлар иштирокидаги формула орқали.", "m_ҳис = m_max + Δm − (1 + α)·γ·Δm кўринишидаги тегишли коэффициентлар иштирокидаги формула орқали.", "m_ҳис = m_max − 2·Δm + α·γ кўринишидаги тегишли коэффициентлар иштирокидаги формула орқали.", "m_ҳис = (m_max − Δm) / (1 − α·γ) кўринишидаги тегишли коэффициентлар иштирокидаги формула орқали."], ["Агар энг кўп йиғилиш вақтигача таркибда m_ҳис ≥ 2·m_м шарти бажарилса, қандай технологик қарор қабул қилинади?", "Энг кўп йиғилиш вақтигача қўшимча поезд жўнатилиб, қолган вагонлардан поезд тузилиб белгиланган вақтда жўнатилади.", "Барча вагонлар кейинги суткага қолдирилади ва поездлар ҳаракати жадвалидан ушбу график ниткаси бекор қилинади.", "Таркиб икки баробар оғир вазнда битта узун таркибли поезд сифатида графикдан ташқари йўналишга жўнатилади.", "Вагонлар бошқа йўналишдаги бўш саралаш йўлларига вақтинча тарқатилиб, саралаш ишлари қайтадан бошланади."], ["Агар вагонларнинг энг кўп йиғилиш вақтигача таркибда m_ҳис < m_м шарти қайд этилса, жараён қандай давом эттирилади?", "Шу кундаги энг кўп йиғилиш вақти бекор қилиниб, йиғилган вагонлар тўлгандан сўнг ёки қўшимча поезд қилиб жўнатилади.", "Кам сонли вагонлардан иборат бўлса ҳам поезд дарҳол белгиланган нитка вақтида тўлиқ бўлмаган ҳолда жўнатиб юборилади.", "Ушбу йўналишдаги барча вагонлар маҳаллий поездларга уланиб, қўшни участка станцияларига қайта ишлашга юборилади.", "Диспетчерлик жадвали ўзгартирилиб, поезд ўрнига фақат резерв локомотивларнинг ҳаракати амалга оширилади."], ["Таркибни йиғишни тугаллаш учун сарфланадиган вақт (t_й.т.) қандай эмпирик формула бўйича ҳисобланади?", "t_й.т. = (0,002·m_ҳис² + 0,133·m_ҳис + 2,91) / 60, соат кўринишидаги эмпирик формула билан ҳисобланади.", "t_й.т. = (0,036·m_ҳис² + 0,680·m_ҳис + 1,25) / 60, соат кўринишидаги эмпирик формула билан ҳисобланади.", "t_й.т. = (0,005·m_ҳис² + 0,250·m_ҳис + 3,50) / 24, соат кўринишидаги эмпирик формула билан ҳисобланади.", "t_й.т. = (0,012·m_ҳис² + 0,110·m_ҳис + 4,00) / 60, соат кўринишидаги эмпирик формула билан ҳисобланади."], ["Таркибни жўнатишда кутиш вақти (t_жўн.кутиш) ўзгарувчан ва ўзгармас график шароитларида қандай қийматга эга?", "Ўзгарувчан графикда t_жўн.кутиш ≈ 1,25 соатга тенг, ўзгармас график шароитида эса t_жўн.кутиш = 0 соатга тенг бўлади.", "Ўзгарувчан графикда t_жўн.кутиш ≈ 0,50 соатга тенг, ўзгармас график шароитида эса t_жўн.кутиш = 1,0 соатга тенг бўлади.", "Ўзгарувчан графикда t_жўн.кутиш ≈ 2,00 соатга тенг, ўзгармас график шароитида эса t_жўн.кутиш = 0,5 соатга тенг бўлади.", "Ўзгарувчан графикда t_жўн.кутиш ≈ 0,15 соатга тенг, ўзгармас график шароитида эса t_жўн.кутиш = 2,0 соатга тенг бўлади."], ["Битта поезднинг техник кўрикдан ўтказишдаги минимал масофаси (l_тех) меъёр бўйича қанча қилиб белгиланган?", "Поезд қатнов йўналишида битта техник кўрикдан ўтказишдаги минимал масофа l_тех = 300 км деб белгиланган.", "Поезд қатнов йўналишида битта техник кўрикдан ўтказишдаги минимал масофа l_тех = 500 км деб белгиланган.", "Поезд қатнов йўналишида битта техник кўрикдан ўтказишдаги минимал масофа l_тех = 150 км деб белгиланган.", "Поезд қатнов йўналишида битта техник кўрикдан ўтказишдаги минимал масофа l_тех = 800 км деб белгиланган."], ["Курс ишининг умумий якуний хулосасига кўра қайси вариант иқтисодий томондан энг самарали деб топилди?", "Юк поездларини ўзгармас график бўйича меъёрий таркибда жўнатиш (m = 52 ваг., Δm = 0 ваг.) 5-варианти самарали топилди.", "Юк поездларини ўзгарувчан график бўйича қисқартирилган таркибда жўнатиш (m = 47 ваг., Δm = 3 ваг.) 2-варианти самарали топилди.", "Юк поездларини ўзгармас график асосида максимал камайтирилган таркибда жўнатиш (m = 43 ваг., Δm = 9 ваг.) усули самарали топилди.", "Юк поездларини ўзгарувчан график асосида меъёрий таркибда жўнатиш (m = 50 ваг., Δm = 0 ваг.) 1-варианти самарали топилди."], ["Юк поездларини ўзгармас график бўйича жўнатиш вақти жадвалларини аниқлашда қайси асосий усуллардан фойдаланилади?", "Поездлар йиғилиш жадаллиги ва махсус матрицали ҳисоблаш усули орқали", "Станциялараро интервал вагон оқими динамик симуляция дастури орқали", "Локомотив бригадаларининг иш вақти ва участка ўтказиш қобилияти орқали", "Йўл таъмирлаш оралиқлари ҳамда йўналишдаги поездлар ҳаракати орқали"], ["Таркиб йиғилишининг қатъий вақтига поезд жўнаш вақтини («нитка»ни) белгилаш учун нега айнан 5 соат қўшилади?", "Йиғишни тугатиш, парклар аро ўтказиш ҳамда техник-тижорий кўриклар сабабли", "Локомотивларни деподан чиқариш ва синов тормозланишини амалга ошириш учун", "Станция қабул-жўнатиш йўлларининг бандлиги ва навбат кутиш вақтлари учун", "Вагонларни ҳужжатлаштириш ҳамда назорат органлари кўригидан ўтказиш учун"], ["Агар суткалик поездлар ҳисобий сони Nҳис^(I(сут)) қиймати 1.51 дан 2.0 гача бўлса, у қандай қийматга яхлитланади?", "2 қийматига тенг қилиб яхлитланади", "1 қийматига тенг қилиб яхлитланади", "3 қийматига тенг қилиб яхлитланади", "4 қийматига тенг қилиб яхлитланади"], ["Агар бир суткалик поездлар сони Nсут^ўрт = 2 деб қабул қилинс aylanmasi o‘zgarmaydi, biroq vagonlarning o‘rtacha aylanish vaqti qisqaradi"], ["Bir poyezdda tashiladigan yuk miqdorini aniqlash formulasi qaysi javobda to‘g‘ri keltirilgan?", "Qₚ = nᵥ × qᵥ (bunda nᵥ — yuklangan vagonlar soni, qᵥ — har bir vagondagi o‘rtacha yuk massasi hisoblanadi)", "Qₚ = N / qᵥ (bunda N — kunlik poyezdlar soni, qᵥ — har bir vagonga to‘g‘ri keluvchi o‘rtacha yuk massasi)", "Qₚ = nᵥ + qᵥ (bunda nᵥ — yuklangan vagonlar soni, qᵥ — bir vagonga yuklanishi mumkin bo‘lgan yuk massasi)", "Qₚ = kₙ × nᵥ (bunda kₙ — yuk notekislik koeffitsiyenti, nᵥ — harakat tarkibidagi umumiy vagonlar soni)"], ["Poyezdda 48 ta yuklangan vagon bo‘lib, har biriga 60 tonnadan yuk ortilgan bo‘lsa, poyezdning yuk hajmi qancha bo‘ladi?", "2880 tonnaga teng bo‘ladi", "2400 tonnaga teng bo‘ladi", "3200 tonnaga teng bo‘ladi", "1920 tonnaga teng bo‘ladi"], ["Uchastkaning kunlik tashish qobiliyatini aniqlash formulasi qaysi variantda to‘g‘ri ko‘rsatilgan?", "Qₖ = N × Qₚ (bunda N — bir kundagi yuk poyezdlari soni, Qₚ — poyezddagi o‘rtacha yuk massasi)", "Qₖ = Qₚ / N (bunda N — bir kundagi poyezdlar soni, Qₚ — bitta poyezd tashiyotgan o‘rtacha yuk)", "Qₖ = nᵥ × Qₚ (bunda nᵥ — yuklangan vagonlar miqdori, Qₚ — bitta poyezdning o‘rtacha og‘irligi)", "Qₖ = N × kₙ (bunda N — bir sutkadagi poyezdlar, kₙ — harakat oqimining notekislik darajasi)"], ["Bir kunda 20 ta yuk poyezdi o‘tadigan va har bir poyezd 2880 tonna yuk tashiydigan uchastkaning kunlik tashish hajmi qancha?", "57 600 tonna/kunni tashkil etadi", "45 000 tonna/kunni tashkil etadi", "62 400 tonna/kunni tashkil etadi", "51 200 tonna/kunni tashkil etadi"], ["Uchastkaning yillik tashish qobiliyatini (Qᵧ) hisoblash uchun qaysi formuladan foydalaniladi?", "Qᵧ = Qₖ × D (bunda Qₖ — kunlik tashish qobiliyati, D — hisobga olinadigan ish kunlari soni)", "Qᵧ = Qₖ / D (bunda Qₖ — bir sutkalik yuk massasi, D — taqvimiy yildagi umumiy kunlar miqdori)", "Qᵧ = Qₖ × kₙ (bunda Qₖ — kunlik tashish hajmi, kₙ — yuk tashish oqimining notekislik koeffitsiyenti)", "Qᵧ = Qₚ × 365 (bunda Qₚ — bitta poyezd yuki, 365 — doimiy o‘zgarmas hisoblash koeffitsiyenti)"], ["Kunlik tashish qobiliyati 57 600 tonna va hisob davri 365 kun deb olinsa, yillik ko‘rsatkich qanchaga teng bo‘ladi?", "21 024 000 tonna/yilga teng bo‘ladi", "18 500 000 tonna/yilga teng bo‘ladi", "24 250 000 tonna/yilga teng bo‘ladi", "20 120 000 tonna/yilga teng bo‘ladi"], ["Yuk oqimining notekisligini hisobga oluvchi eng yuqori davriy yuk hajmi formulasi qaysi javobda keltirilgan?", "Qₘₐₓ = Q̄ × kₙ (bunda Q̄ — o‘rtacha davriy hajm, kₙ — yuk oqimining notekislik koeffitsiyenti)", "Qₘₐₓ = Q̄ / kₙ (bunda Q̄ — o‘rtacha me’yoriy hajm, kₙ — harakat tarkibining notekislik darajasi)", "Qₘₐₓ = Q̄ + kₙ (bunda Q̄ — sutkalik o‘rtacha yuk, kₙ — magistral yo‘llarning profil koeffitsiyenti)", "Qₘₐₓ = Qₖ × 365 (bunda Qₖ — bir kunlik hajm, 365 — maksimal darajadagi mavsumiy ish kunlari)"], ["O‘rtacha kunlik yuk hajmi 50 000 tonna va notekislik koeffitsiyenti 1,2 bo‘lsa, eng yuqori davrdagi yuk hajmi qancha bo‘ladi?", "60 000 tonna/kunga teng bo‘ladi", "55 000 tonna/kunga teng bo‘ladi", "65 000 tonna/kunga teng bo‘ladi", "72 000 tonna/kunga teng bo‘ladi"], ["Kerakli yuk poyezdlari sonini (N) hisoblash natijasi kasr son (masalan, 16,4) chiqsa, amaliyotda qanday qaror qabul qilinadi?", "Rejalashtirilgan hajmni to‘liq tashish maqsadida natija yuqoriga yaxlitlanadi (17 ta deb olinadi)", "Hisoblash xarajatlarini tejash maqsadida natija faqat pastga yaxlitlanadi (16 ta deb olinadi)", "Ortiqcha vagonlar bekor qilinib, poyezdlar soni o‘zgarmas 16 ta darajasida qat’iy saqlab qolinadi", "Uchastkadagi barcha manyovr ishlari to‘xtatilib, ko‘rsatkich o‘rtacha arifmetik qiymatga keltiriladi"], ["Kuniga 40 000 tonna yuk tashish talab etilsa va bitta poyezd 2500 tonna yuk tashisa, nechta yuk poyezdi kerak bo‘ladi?", "16 ta yuk poyezdi talab qilinadi", "14 ta yuk poyezdi talab qilinadi", "18 ta yuk poyezdi talab qilinadi", "20 ta yuk poyezdi talab qilinadi"], ["Tashish qobiliyatidan foydalanish darajasi (K) qaysi formula yordamida aniqlanadi?", "K = Qₐ / Qₕ × 100% (bunda Qₐ — amalda tashilgan yuk miqdori, Qₕ — hisobiy tashish qobiliyati)", "K = Qₕ / Qₐ × 100% (bunda Qₕ — hisobiy tashish ko‘rsatkichi, Qₐ — amalda bajarilgan ish hajmi)", "K = Qₘₐₓ / Q̄ × 100% (bunda Qₘₐₓ — maksimal davriy yuk massasi, Q̄ — o‘rtacha me’yoriy yuk)", "K = Qₖ / 365 × 100% (bunda Qₖ — bir sutkalik umumiy yuk hajmi, 365 — hisoblash davri)"], ["Hisobiy tashish qobiliyati 57 600 tonna, amalda tashilgan yuk 46 080 tonna bo‘lsa, foydalanish darajasi qancha?", "80 foizni tashkil etadi", "75 foizni tashkil etadi", "85 foizni tashkil etadi", "90 foizni tashkil etadi"], ["Hisobiy tashish qobiliyatidan foydalanish 80% bo‘lganda, qolgan 20% nima sababdan avtomatik qo‘shimcha hajm sanalmaydi?", "Poyezdlar jadvali, bo‘sh vagonlar oqimi hamda ortish punktlaridagi texnik cheklovlar mavjudligi tufayli", "Yo‘lovchi poyezdlari ustuvorligi sababli yuk harakati butunlay bekor qilinishi lozim bo‘lganligi uchun", "Relslarning yeyilish darajasi oshib, lokomotivlarning tortish quvvati kutilmaganda pasayishi sababli", "Vagonlarning umumiy xizmat muddati o‘tib ketib, harakat xavfsizligi talablariga mos kelmasligi sababli"], ["Bajarilgan transport ishini (A) hisoblash formulasi va uning birligi to‘g‘ri keltirilgan javobni toping.", "A = Q × L bo‘lib, tonna-kilometr (t·km) birligida ifodalanadi", "A = Q / L bo‘lib, tonna taqsim kilometr (t/km) ko‘rinishida olinadi", "A = Q + L bo‘lib, umumiy yuk-masofa (t+km) tarzida baholanadi", "A = Q × kₙ bo‘lib, sof tonna birligida o‘lchanib hisoblab chiqiladi"], ["12 000 tonna yuk o‘rtacha 150 km masofaga tashilganda, bajarilgan umumiy transport ishi miqdori qanchaga teng bo‘ladi?", "1 800 000 t·km ga teng bo‘ladi", "1 500 000 t·km ga teng bo‘ladi", "2 000 000 t·km ga teng bo‘ladi", "1 250 000 t·km ga teng bo‘ladi"], ["Kompleks misolda kuniga 18 ta poyezd, har birida 42 ta vagon va vagonda 58 t yuk bo‘lsa, 45 000 t reja bo‘yicha xulosa qanday?", "Hisobiy hajm 43 848 tonna bo‘lib, belgilangan reja uchun 1152 tonna yuk hajmi yetishmaydi", "Hisobiy hajm 46 200 tonna bo‘lib, belgilangan reja 1200 tonna ortig‘i bilan to‘liq bajariladi", "Hisobiy hajm 42 500 tonna bo‘lib, belgilangan reja uchun 2500 tonna yuk hajmi yetishmaydi", "Hisobiy hajm 45 000 tonna bo‘lib, belgilangan kunlik rejaga aynan va mutlaqo teng keladi"], ["Temir yo‘l transportida yuk oqimi tushunchasi qanday ma’noni anglatadi?", "Muayyan vaqt va yo‘nalish bo‘yicha tashiladigan yuklar miqdori hamda harakati", "Barcha stansiyalarda texnologik operatsiyalar uchun ajratilgan umumiy vaqt ko‘rsatkichi", "Kun davomida saralash parkiga qabul qilinadigan poyezdlar tarkibidagi vagonlar soni", "Korxonada ishlab chiqarilgan va ortish maydonchasida saqlanayotgan mahsulot massasi"], ["Temir yo‘l amaliyotida vagon oqimi qaysi jarayonni ifodalaydi?", "Yuk tashish uchun vagonlarning yo‘nalishlar, stansiyalar va vaqt bo‘yicha harakati", "Lokomotivlarning asosiy va aylanma depolar orasida qatnovi va texnik xizmati", "Yuk ortish va tushirish maydonlarida harakatlanuvchi mexanizmlar umumiy soni", "Poyezdlar harakat xavfsizligini nazorat qiluvchi avtomatik tizimlar majmuasi"], ["Yuk va vagon oqimlarini chuqur tahlil qilishning asosiy maqsadlaridan biri nima?", "Bo‘sh vagonlar yurishini kamaytirish va stansiyada ortiqcha to‘planishni bartaraf etish", "Yo‘lovchi tashuvchi poyezdlarning oraliq stansiyalarda to‘xtash vaqtini qisqartirish", "Yuk vagonlarining xizmat qilish muddatini texnik ta’mirlashsiz uzaytirib borish", "Yuk ortish joylarida faqat og‘ir yukli ixtisoslashtirilgan platformalarni qo‘llash"], ["O‘quv qo‘llanmasiga ko‘ra, yuk oqimi odatda qanday o‘lchov birliklarida ifodalanadi?", "Tonna, tonna/kun, tonna/oy yoki tonna/yil birliklarida", "Vagon-kilometr, poyezd-soat yoki o‘q-kilometr hisobida", "Metr kub, tonna-kilometr yoki soatlik yuk aylanmasida", "Vagon/kun, vagon/oy hamda poyezd/sutka ko‘rsatkichlarida"], ["Bir xil yo‘nalishda tashiladigan umumiy yuk oqimi qaysi formula orqali hisoblanadi?", "Q = q₁ + q₂ + q₃ + … + qₙ", "Q = (q₁ + q₂ + … + qₙ) / n", "Q = q₁ × q₂ × q₃ × … × qₙ", "Q = (q₁ + q₂) − (q₃ + qₙ)"], ["Uchta korxonadan bir kunda mos ravishda 800 tonna, 1200 tonna va 600 tonna yuk jo‘natilgan bo‘lsa, jami kunlik yuk oqimi qancha bo‘ladi?", "2600 tonna/kun", "2400 tonna/kun", "2800 tonna/kun", "3000 tonna/kun"], ["Yuk hajmidan kerakli vagonlar sonini aniqlash formulasi to‘g‘ri keltirilgan qatorni toping.", "Nᵥ = Q / qᵥ", "Nᵥ = Q × qᵥ", "Nᵥ = qᵥ / Q", "Nᵥ = Q − qᵥ"], ["Hisob-kitob natijasida Nᵥ = 2600 / 60 = 43,33 chiqsa, nima sababdan amalda 44 ta vagon qabul qilinadi?", "Vagonlar soni doimo butun bo‘lishi zarur bo‘lganligi sababli natija yuqoriga yaxlitlanadi", "Harakat xavfsizligi qoidalariga ko‘ra qo‘shimcha bitta zaxira vagon talab etilganligi uchun", "Stansiyadagi vagonlar massasi me’yordan kam bo‘lib qolishining oldini olish maqsadida", "Temir yo‘l yo‘llarida vagonlar soni faqat juft miqdorda shakllantirilishi lozimligi uchun"], ["Kunlik vagon oqimi n = 44 vagon bo‘lsa, 30 kunlik hisob davri (D) uchun umumiy oylik vagonlar soni (N) qanchaga teng?", "1320 vagon/oy", "1280 vagon/oy", "1360 vagon/oy", "1440 vagon/oy"], ["Vagonning yuk ko‘tarish imkoniyatidan foydalanish koeffitsiyenti (Kᵧ) qaysi formula orqali hisoblanadi?", "Kᵧ = qₐ / qₘ × 100%", "Kᵧ = qₘ / qₐ × 100%", "Kᵧ = (qₘ − qₐ) × 100%", "Kᵧ = (qₐ + qₘ) / 2 × 100%"], ["Vagonning ruxsat etilgan yuk massasi 70 tonna, amalda esa 63 tonna yuk ortilgan bo‘lsa, uning yuk ko‘tarishidan foydalanish darajasi necha foizni tashkil etadi?", "90%", "85%", "93%", "80%"], ["Yuk oqimini yo‘nalishlar bo‘yicha alohida tahlil qilishning amaliy ahamiyati nimadan iborat?", "Vagonlarni to‘g‘ri taqsimlash, poyezd tuzish va manevr ishlarini kamaytirishga xizmat qiladi", "Vagonlarning yuk ko‘tarish imkoniyatini belgilangan texnik me’yoridan oshirishga yordam beradi", "Temir yo‘l stansiyalarida ortish va tushirish mexanizmlariga bo‘lgan ehtiyojni butunlay yo‘qotadi", "Stansiyalararo uchastkalarda poyezdlar harakat tezligini cheklovlarsiz oshirishga imkon beradi"], ["Bo‘sh vagonlar qaytish koeffitsiyentini aniqlash uchun qaysi formuladan foydalaniladi?", "Kᵦ = Nᵦ / Nᵧ", "Kᵦ = Nᵧ / Nᵦ", "Kᵦ = Nᵦ × Nᵧ", "Kᵦ = Nᵧ − Nᵦ"], ["Bir kunda 100 ta yuklangan vagon jo‘natilib, 35 ta bo‘sh vagon qaytgan bo‘lsa, bo‘sh vagonlar nisbati koeffitsiyenti (Kᵦ) qanchaga teng?", "0,35 (yoki 35%)", "0,65 (yoki 65%)", "0,28 (yoki 28%)", "0,42 (yoki 42%)"], ["Bo‘sh vagonlarning yuqori qaytish koeffitsiyentini kamaytirish uchun qanday chora ko‘rish lozim?", "Bo‘sh vagonlarni boshqa yuklarga moslashtirish va qaytishda yuk topish imkonini ko‘rish", "Bo‘sh vagonlarni zaxira yo‘llarida uzoq muddatga to‘xtatib, harakatini cheklab qo‘yish", "Vagonlarga yuk ortish jarayonini tezlashtirish orqali stansiya saralash ishlarini bekor qilish", "Faqat bir xil yo‘nalishdagi oraliq stansiyalarga xizmat ko‘rsatuvchi poyezdlarni shakllantirish"], ["Soddalashtirilgan o‘quv hisobida vagon aylanish vaqti (Tₐ) qaysi operatsiyalar yig‘indisi sifatida aniqlanadi?", "Tₐ = tₒ + tₕ + tᵧ + tₖ", "Tₐ = (tₒ + tₕ) − (tᵧ + tₖ)", "Tₐ = tₒ × tₕ + tᵧ × tₖ", "Tₐ = (tₒ + tₕ + tᵧ) / tₖ"], ["Agar tₒ = 8 soat, tₕ = 20 soat, tᵧ = 10 soat va tₖ = 6 soat bo‘lsa, vagonning to‘liq aylanish vaqti necha soat bo‘ladi?", "44 soat", "40 soat", "48 soat", "52 soat"], ["Oy davomida 75 000 tonna yuk tashish rejalashtirilib, amalda 69 000 tonna yuk tashilgan bo‘lsa, yuk oqimi rejasi necha foizga bajarilgan?", "92%", "88%", "95%", "85%"], ["Kunlik yuk talabi 3600 t bo‘lib, bitta vagonga 60 t yuk ortilsa, ushbu talabni to‘liq qondirish uchun nechta vagon zarur?", "60 ta vagon", "55 ta vagon", "52 ta vagon", "65 ta vagon"], ["Reja bo‘yicha 55 ta vagon (3300 t) jo‘natilishi kerak bo‘lib, amalda har birida 60 t yuk bo‘lgan 52 ta vagon jo‘natilsa, reja bajarilishi qanchani tashkil etadi?", "Taxminan 94,5%", "Taxminan 91,2%", "Taxminan 96,8%", "Taxminan 89,5%"], ["Dispetcherlik boshqaruvida poyezdlar harakati simulyatsiyasi tushunchasiga berilgan eng to‘g‘ri ta’rif qaysi?", "Real tizimning soddalashtirilgan modelini tuzib jarayonlarni taqlid qilishdir.", "Poyezdlar qatnovini dispetcher buyrug‘isiz avtomatik boshqarish vositasidir.", "Temir yo‘l tarmog‘idagi xavfsizlik qoidalarini doimiy o‘zgartirish usulidir.", "Harakat tarkibining texnik sozligini bevosita stansiyada tekshirish tizimidir."], ["Taqdim etilgan matnga asosan simulyatsiya modeli quyidagi qaysi amaliy vazifa uchun qo‘llanilishi mumkin?", "Harakat jadvalini tekshirish va ehtimoliy kechikishlar ko‘lamini baholashda.", "Temir yo‘l xodimlarining amaldagi lavozim majburiyatlarini qayta belgilashda.", "Harakat xavfsizligi talablarini rasmiy mezonlarsiz butunlay o‘zgartirishda.", "Tasdiqlangan poezdlar jadvalini to‘g‘ridan-to‘g‘ri va so‘zsiz almashtirishda."], ["Simulyatsiya natijalarining real poyezdlar harakatini tashkil etishdagi o‘rni qanday belgilangan?", "Ular real harakatni boshqarish ruxsati yoki tasdiqlangan jadval o‘rnini bosmaydi.", "Ular dispetcher ko‘rsatmasidan ustun turuvchi qat’iy me’yoriy hujjat hisoblanadi.", "Ular barcha temir yo‘l uchastkalarida harakat xavfsizligi qoidalarini bekor qiladi.", "Ular real poyezdlar harakatini to‘g‘ridan-to‘g‘ri avtomatik boshqarishga xizmat qiladi."], ["Poyezdlar harakati simulyatsiyasi modeliga kiritiladigan boshlang‘ich ma’lumotlar qatoriga nima kiradi?", "Uchastka uzunligi, rejalashtirilgan jo‘nash vaqti va taxminiy harakatlanish tezligi.", "Tashilgan yo‘lovchilar soni, chiptalar narxi va umumiy moliyaviy daromadlar hajmi.", "Stansiya navbatchisining ish staji, uning toifasi hamda xizmat vazifalari ro‘yxati.", "Vagonlarning ichki tozaligi, texnik ta’mirlash xarajatlari va yoqilg‘i sarfi miqdori."], ["Simulyatsiya modeli hisoblab beradigan chiqish ko‘rsatkichlari (natijalar) tarkibiga qaysi parametr kiradi?", "Poyezdning yetib kelish vaqti, umumiy kechikish va uchastka bandligi davomiyligi.", "Lokomotivlarning xizmat ko‘rsatish muddati va stansiya yo‘llarining ta’mirlash narxi.", "Temir yo‘l bekatlarining elektr ta’minoti sarfi va poyezdlar harakat xavfsizligi kodi.", "Vagonlarning umumiy ekspluatatsiya davri hamda yo‘lovchilarning shikoyatlari soni."], ["Simulyatsiya modelini yaratishning birinchi bosqichida qanday asosiy vazifa bajariladi?", "Tadqiqotning aniq maqsadi belgilanib, nimani o‘rganish kerakligi aniqlab olinadi.", "Uchastkadagi barcha poezdlar harakati bo‘yicha hisoblash qoidalari tanlab olinadi.", "Tizim chegarasi qat’iy chizilib, tahlil qilinadigan vaqt oralig‘i aniq belgilanadi.", "Turli ssenariylar natijalari solishtirilib, jadvaldan chetlanishlar baholanadi."], ["Simulyatsiya modelini yaratishning ikkinchi bosqichining mazmuni qaysi javobda to‘g‘ri ko‘rsatilgan?", "Qaysi stansiyalar, poyezdlar soni va qanday vaqt oralig‘i o‘rganilishi belgilanadi.", "Real tizimdagi barcha formulalar asosida yakuniy hisob-kitoblar amalga oshiriladi.", "Boshlang‘ich ma’lumotlar kiritilib, qo‘lda bajarilgan hisoblar bilan taqqoslanadi.", "Kechikishlar bo‘yicha yangi ssenariylar ishlab chiqilib, yakuniy xulosa yoziladi."], ["Simulyatsiya modelini yaratishning beshinchi bosqichida nima sababdan model sinovdan o‘tkaziladi?", "Hisoblarni qo‘lda bajarib natijalarni taqqoslash va xatoliklarni aniqlash uchun.", "Barcha poyezdlarning real harakatini to‘xtatmasdan bevosita boshqarish maqsadida.", "Amaldagi xavfsizlik qoidalariga o‘zgartirish kiritish zarurligini isbotlash uchun.", "Uchastkadagi barcha stansiyalarning umumiy o‘tkazuvchanligini oshirish maqsadida."], ["Uchastkada yurish vaqtini hisoblash uchun quyidagi qaysi formuladan foydalaniladi?", "T_yurish = S / V", "T_yurish = S × V", "T_yurish = V / S", "T_yurish = S + V"], ["Masofa 90 km va o‘rtacha tezlik 60 km/soat bo‘lsa, uchastkada yurish vaqti qanchaga teng bo‘ladi?", "1 soat 30 daqiqa", "1 soat 15 daqiqa", "1 soat 45 daqiqa", "2 soat 00 daqiqa"], ["Agar poyezdning yurish vaqti 1 soat 30 daqiqa, stansiyada turish vaqti 10 daqiqa bo‘lsa, umumiy vaqt qancha bo‘ladi?", "1 soat 40 daqiqa", "1 soat 20 daqiqa", "1 soat 50 daqiqa", "2 soat 10 daqiqa"], ["Poyezd 08:20 da jo‘nab, safar 1 soat 40 daqiqa davom etgan bo‘lsa, uning yetib kelish vaqti qaysi javobda to‘g‘ri ko‘rsatilgan?", "10:00 da yetib keladi", "09:40 da yetib keladi", "10:20 da yetib keladi", "09:50 da yetib keladi"], ["Poyezd jadval bo‘yicha 10:00 da kelishi kerak bo‘lsa-da, amalda 10:12 da yetib kelsa, kechikish miqdori qancha?", "12 daqiqani tashkil etadi", "10 daqiqani tashkil etadi", "15 daqiqani tashkil etadi", "22 daqiqani tashkil etadi"], ["Uchta poyezd mos ravishda 0, 5 va 10 daqiqaga kechikkan bo‘lsa, ularning o‘rtacha kechikishi qancha bo‘ladi?", "5 daqiqani tashkil etadi", "4 daqiqani tashkil etadi", "7 daqiqani tashkil etadi", "8 daqiqani tashkil etadi"], ["Agar 10 ta poyezddan 9 tasi jadval mezoniga mos kelgan bo‘lsa, jadvalga rioya qilish ko‘rsatkichi qanchaga teng?", "90% ko‘rsatkichga teng", "80% ko‘rsatkichga teng", "85% ko‘rsatkichga teng", "95% ko‘rsatkichga teng"], ["Matndagi soddalashtirilgan o‘quv modelining asosiy cheklovlaridan biri qaysi javobda to‘g‘ri keltirilgan?", "Modelda uchastka bandligi, signalizatsiya va xavfsiz intervallar hisobga olinmagan.", "Model faqat bitta stansiyadan iborat bo‘lib, masofani hisoblash imkoniyatiga ega emas.", "Model faqat poyezdlar kechikmagan holatlardagina ishlash imkoniyatiga ega hisoblanadi.", "Model hisob-kitoblarida vaqt birliklarini daqiqalardan soatga o‘tkazish ko‘zda tutilmagan."], ["Poyezd tezligi modelda doimiy deb qabul qilinganda qaysi muhim parametrlar hisobdan chetda qoladi?", "Harakat tarkibining tezlanishi hamda sekinlashishi jarayonlari hisobga olinmaydi.", "Poyezdning oraliq bekatlarda qancha vaqt davomida to‘xtab turishi hisobga olinmaydi.", "Stansiyalararo masofaning umumiy uzunligi hamda umumiy safar vaqti hisobga olinmaydi.", "Uchastkada harakatlanayotgan poyezdlarning raqamlari va jo‘nash vaqti hisobga olinmaydi."], ["Dispetcherlik boshqaruvida simulyatsiya usulining eng asosiy afzalligi nimadan iborat?", "Murakkab vaziyatlarn
