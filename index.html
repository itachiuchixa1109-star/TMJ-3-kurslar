jni kamaytirish."], ["Markazdan qochirma quyish usuli asosan qanday turdagi quymalar olishda qo'llaniladi?", "Tsilindrsimon jismlar shaklidagi quymalarni, masalan, truba, vtulka, shkiv, g'ildirak, shesternya va mufta diskalarning zagotovkalarini olishda.", "Katta hajmli va murakkab geometriyaga ega bo'lgan quyma detallar, masalan, motor bloklari va korpuslar ishlab chiqarishda.", "Yupqa devorli va aniq o'lchamli nozik quymalar, masalan, elektronika qismlari va zargarlik buyumlari uchun.", "Bir tekis yuzaga ega bo'lgan, ammo ichki strukturasi murakkab, asosan bezak elementlaridan iborat quymalar uchun."], ["Bosim ostida quyish usulining asosiy afzalliklari qaysilar?", "G'ovaksiz, sirtqi nuqsonsiz, toza va aniq o'lchamli quymalar ishlab chiqarish imkonini beradi.", "Yuqori haroratlarda metallarning barqarorligini ta'minlash, ichki strukturaning bir xilligini oshirish.", "Qolipning uzoq muddat xizmat qilishiga erishish, energiya sarfini kamaytirish va atrof-muhitga ta'sirini minimallashtirish.", "Metallarni eritish va quyish jarayonlarini avtomatlashtirish, ishlab chiqarish xarajatlarini sezilarli darajada kamaytirish."], ["Suyuqlanuvchan modellar yordamida quyma olishda modellar qanday materiallardan tayyorlanadi?", "Parafin, stearin, mum (bitum) kabi oson suyuqlanuvchi materiallardan foydalaniladi.", "Po'lat, bronza, alyuminiy kabi yuqori mustahkamlikka ega metall qotishmalaridan.", "Quvvatli plastmassa, keramika yoki yuqori haroratga chidamli kompozit materiallardan.", "Yog'och, gips, polimerlar kabi oddiy va arzon materiallardan va ulardan tayyorlanadigan qolip."], ["Qobiq qoliplar yordamida quyma olishda qolip materiali sifatida nimalar ishlatiladi?", "Kvarts qumi kukuni bilan bakelit (fenol formaldegid smolasi) kukuni aralashmasi.", "Gil, loy, tsement va suv aralashmasi kabi tabiiy, past erish haroratli materiallar.", "Maxsus keramik tolalar, metall kukunlari va polimer bog'lovchi moddalardan tashkil topgan kompozit materiallar.", "Yuqori temperaturalarda barqaror bo'lgan xromit qumi va magnit bog'lovchi elementlar."], ["Vagrankada cho'yan suyuqlantirish jarayonida asosiy xomashyolar qaysilar?", "Quymakorlik cho'yani, korxona chiqindisi, mashina sinqlari (temir-tersak), koks, ohaktosh, dolomit va marten shlaklari.", "Faqat yuqori sifatli rudalar, sof metallar, turli xil sintetik moddalar va gaz yoqilg'isi.", "Qayta ishlangan plastmassa, organik chiqindilar, tabiiy gaz va kimyoviy reagentlar yig'indisi.", "Bronza, latun, alyuminiy kabi rangli metallar, ko'mir, qum va suyuq keramik aralashmalar."], ["Dupleks usuli deganda metallni suyuqlantirishning qanday jarayoni tushuniladi?", "Po'latning dastlabki konvertorda, so'ngra elektr pechda ikki agregatda ketma-ket suyuqlantirilishi.", "Metallni bitta pechda yuqori haroratda eritib, so'ngra ikkinchi pechda past haroratda ushlab turish usuli.", "Ikkita turli xil metallni bir vaqtning o'zida ikkita pechda eritib, keyin ularni aralashtirish jarayoni.", "Bitta pechda ketma-ket ikki xil yoqilg'i, masalan, ko'mir va gaz yordamida metallni eritish usuli."], ["Metall ketma-ket uch agregatda suyuqlantirilsa, bu jarayon qanday nomlanadi?", "Tripleks usuli, bunda metall vagranka, konvertor va elektr pechda ketma-ket suyuqlantiriladi.", "Murakkab eritish, bunda metallni uchta turli texnologik bosqichda qayta ishlash amalga oshiriladi.", "Ko'p bosqichli eritish, bunda uch xil pech turida metallning eritish jarayoni ketma-ket o'tkaziladi.", "Uzluksiz eritish, bunda uchta pechdan foydalanib metallning doimiy ravishda qayta ishlash tsikli ta'minlanadi."], ["Quymakorlik uchun ishlatiladigan qotishmalar qanday asosiy xossalarga ega bo'lishi kerak?", "Suyuq holatda oquvchan, kam kirishuvchan, bir strukturali, metallmas aralashmalardan xoli va suyuqlanish temperaturasi juda yuqori bo'lmasligi kerak.", "Yuqori qattiqlik, kuchli magnit xususiyatlar, past elektr o'tkazuvchanlik va haroratga chidamlilik kabi.", "Past zichlik, yuqori issiqlik o'tkazuvchanlik, kimyoviy inertlik va atrof-muhitga chidamlilik xususiyatlari.", "Kislotali muhitga chidamlilik, yengil qayta ishlanuvchanlik, past eritish nuqtasi va yuqori estetik ko'rinish."], ["Cho'yan va po'latning suyuq holatdagi oquvchanligiga qaysi elementlar miqdori bevosita ta'sir ko'rsatadi?", "Uglerod, kremniy va fosfor miqdori, ularning konsentratsiyasi oquvchanlikka to'g'ri proportsional ta'sir qiladi.", "Marganets, xrom va nikel miqdori, bu elementlar metallarning korroziyaga chidamliligini oshiradi.", "Oltingugurt, mis va molibden miqdori, ularning yuqori konsentratsiyasi metallning plastikligini kamaytiradi.", "Alyuminiy, titan va vanadiy miqdori, bu elementlar metallning issiqlik bilan ishlov berish xususiyatlarini o'zgartiradi."], ["Quymakorlikda eng ko'p ishlatiladigan rangli qotishmalar qaysilar?", "Mis, alyuminiy va magniy asosidagi qotishmalar, jumladan bronza, latun, siluminlar, Al-Si, Al-Mg, Mg-Al-Zn.", "Titan, nikel va kobalt asosidagi qotishmalar, ular yuqori haroratga chidamli va qattiqdir.", "Temir, xrom va molibden asosidagi qotishmalar, asosan yuqori qattiqlik va korroziyaga chidamlilik talab qilinganda.", "Sink, qalay va qo'rg'oshin asosidagi qotishmalar, ular past eritish haroratiga ega va yumshoqdir."], ["Suyuq cho'yanni modifikatsiyalashning maqsadi va bunda qanday elementlar ishlatiladi?", "Cho'yanning mexanik xossalarini yaxshilash maqsadida silikokaltsiy, magniy, alyuminiy, titan kabi elementlar qo'shiladi.", "Cho'yanning oquvchanligini oshirish, eritish nuqtasini pasaytirish va uning rangi o'zgarishini ta'minlash.", "Cho'yanning korroziyaga chidamliligini oshirish, uning magnit xususiyatlarini yaxshilash va massa zichligini kamaytirish.", "Cho'yan tarkibidagi zararli aralashmalarni olib tashlash, uning elektr o'tkazuvchanligini oshirish va yuzasini silliqlash."], ["Quymakorlik po'latining markirovkasida \"L\" harfi nimani anglatadi va raqamlar nimani bildiradi?", "\"L\" harfi po'latning \"liteynaya\" (quymakorlik) ekanligini, raqamlar esa o'rtacha uglerod miqdorini bildiradi.", "\"L\" harfi po'latning \"legirlangan\" ekanligini, raqamlar uning mustahkamlik darajasini ko'rsatadi.", "\"L\" harfi \"issiqlik bilan ishlov berilgan\" degan ma'noni, raqamlar qotishmaning asosiy qo'shimchalarini bildiradi.", "\"L\" harfi \"past qotishmali\" ekanligini, raqamlar esa po'latning og'irligi yoki hajmini ifodalaydi."], ["Quymalarda uchraydigan \"cho'kish bo'shlig'i\" nuqsoni qanday shakllanadi?", "Quyma soviganida uning hajmi kichrayishi natijasida quymaning yuqorigi qismida hosil bo'ladigan bo'shliq.", "Metall eritmasidagi gazlar ajralib chiqishi va qolip ichida qolib ketishi natijasida yuzaga keladigan g'ovaklar.", "Qolip materiali bilan suyuq metall o'rtasidagi kimyoviy reaksiya tufayli hosil bo'ladigan ichki jism.", "Quyma yuzasiga qolipdan qolib ketgan qum donachalari yoki boshqa begona materiallarning yopishib qolishi."], ["Quymalarda cho'kish bo'shlig'i hosil bo'lmasligi uchun qanday chora ko'riladi?", "Qolipda pribil deb ataladigan maxsus bo'shliqlar qilinadi, ular cho'kishni o'ziga qabul qiladi.", "Suyuq metallni qolipga quyishdan oldin unga maxsus dezoksidlovchilar va gazsizlantiruvchilar qo'shiladi.", "Qolipning sovish tezligini oshirish, shu bilan birga metallning haroratini tez pasaytirish.", "Qolip materialiga qo'shimcha bog'lovchi moddalar qo'shish va uni yuqori haroratda pishirish."], ["Quymalarda gaz pufakchalari hosil bo'lmasligi uchun qanday choralarni qo'llash zarur?", "Suyuq metallga maxsus qaytargichlar qo'shish, gaz chi-qish kanallari sonini ko'paytirish, quyish yo'llarini to'g'ri tanlash va quyish vaqtidagi temperaturani to'g'ri belgilash.", "Qolipni yuqori bosim ostida eritish, metallning tez sovishini ta'minlash va metallni faqat vertikal holatda quyish.", "Metallni quyishdan oldin vakuum kamerasida gazsizlantirish, qolipni maxsus keramik qoplamalar bilan qoplash va doimiy ravishda haroratni nazorat qilish.", "Qolipning ichki yuzasiga namlikka chidamli materiallar surtish, metallni juda sekin quyish va uning tarkibidagi uglerod miqdorini kamaytirish."], ["Quymalardagi likvatsiya nuqsoni nimani anglatadi va u qanday paydo bo'ladi?", "Eritmadagi yoki qotishmadagi qo'shimchalarning quymada notekis taqsimlanishi bo'lib, suyuq qotishmaning notekis kristallanishidan kelib chiqadi.", "Metallning soviyotganda hajmining qisqarishi natijasida quymaning yuqori qismida yuzaga keladigan ichki bo'shliq.", "Qolip materialining suyuq metall bilan o'zaro ta'siri natijasida hosil bo'ladigan va metallning yuzasida qoladigan begona zarralar.", "Metallning tez sovishi natijasida yuzaga keladigan ichki mikro-yorilishlar va stresslarning to'planishi."], ["Po'lat quymalarda uchraydigan \"g'uddalar\" nuqsoni qanday shakllanadi?", "Suyuq po'lat qolipga quyilayotganda sachrashi va tomchilar tarzida quymaga yopishib qolishidan hosil bo'ladigan notekislik.", "Qolip devorlariga yopishgan qum donachalari yoki boshqa aralashmalarning metallga o'tib ketishi.", "Metallning haddan tashqari tez sovishi natijasida uning yuzasida yuzaga keladigan mayda pufakchalar va g'ovaklar.", "Qolipdagi ichki bosimning haddan tashqari oshishi tufayli metallning yuzasida paydo bo'ladigan doimiy yoriqlar."], ["Suyuq cho'yanning tez sovishi natijasida yuzaga keladigan nuqson qanday nomlanadi va uning oqibati qanday?", "\"Oq cho'yan\" deb nomlanadi, bu esa quymani kesib ishlashni qiyinlashtiradi va termik ishlov berishni talab qiladi.", "\"Sirtqi oksidlanish\" deb ataladi, bu nuqson metallning yuzasida korroziya rivojlanishiga olib keladi.", "\"Deformatsiya\" deb nomlanadi, bu nuqson quymaning geometrik shaklini o'zgartirib, aniqligini buzadi.", "\"Mikroyoriqlar\" deb ataladi, bu nuqson metallning ichki strukturasini zaiflashtirib, uning mustahkamligini pasaytiradi."], ["Cho'yan eritish jarayonida suyuq cho'yanni olish uchun qanday turdagi pechlar asosiy vosita hisoblanadi?", "Vagranka, domna, elektr va olovli pechlar qo'llaniladi, ular turli xususiyatlarga ega.", "Faqat vagranka va domna pechlari ishlatiladi, chunki ular eng samarali hisoblanadi.", "Elektr pechlari asosan kichik ishlab chiqarishda qo'llaniladi, sababi energiya sarfi yuqori.", "Olovli pechlar faqat legerlangan cho'yanlarni eritish uchun maxsus ishlatiladi."], ["Cho'yan quymalarini olishda ishlatiladigan shixtaning asosiy tarkibiy qismlari nimadan iborat bo'ladi?", "Chushka cho'yani, ferro qotishmalar, legerlangan qotishmalar hamda metall lomlar bo'ladi.", "Shixtaga asosan faqat chushka cho'yani va po'lat chiqindilari qo'shiladi, boshqalari kam miqdorda.", "Asosiy tarkib ferro qotishmalaridan iborat bo'lib, bu eritish samaradorligini oshiradi.", "Metall lomlar va temir-tersakni ishlatish faqatgina arzon cho'yan olishda tavsiya etiladi."], ["Cho'yan eritish jarayonida asosiy yoqilg'i sifatida nima ishlatiladi va buning asosiy sababi nimada?", "Koks asosiy yoqilg'idir, chunki u yuqori harorat berib, erish jarayonini tezlashtiradi.", "Toshko'mir keng qo'llaniladi, u koksga nisbatan arzonroq va oson topiladigan yoqilg'idir.", "Tabiiy gaz asosan elektr pechlarida ishlatiladi, u toza yonadi va atrof-muhitni ifloslantirmaydi.", "Mazut kamdan-kam qo'llaniladi, sababi uning yonish harorati etarli darajada yuqori emas."], ["Vagrankada cho'yan eritish jarayonida shlak hosil bo'lishining asosiy sabablari qaysilar?", "Yoqilg'i kuli, temir oksidlari, zararli mexanik aralashmalar va pech devorining eyilishi.", "Eritilayotgan cho'yan tarkibidagi uglerod miqdorining yuqoriligi shlak miqdorini oshiradi.", "Faqatgina shixtaga kiradigan kirlar va yoqilg'ining toza emasligi shlak hosil qiladi.", "Vagranka ichidagi havo oqimining tezligi shlak miqdorini bevosita oshiruvchi asosiy omildir."], ["Cho'yan eritishda hosil bo'ladigan shlakni suyultirish va uning oson ajralishini ta'minlash uchun qanday qo'shimchalar solinadi?", "Ohaktosh, dolomit kabi flyuslar qo'shiladi, ular shlakni suyultirishga yordam beradi.", "Temir-tersak qo'shiladi, bu shlakning yopishqoqligini kamaytiradi va eritishni yaxshilaydi.", "Koks miqdorini oshirish shlak tarkibini o'zgartiradi va uning erish nuqtasini pasaytiradi.", "Maxsus kimyoviy moddalar qo'shiladi, ular shlakni butunlay yo'qotishga qaratilgan harakatlardir."], ["Cho'yan vagrankada eritilganda qaysi elementlar sezilarli darajada kuyadi va ularning miqdori qanchaga kamayadi?", "Kremniy (Si) 10-15%, marganets (Mn) 15-20% va xrom (Cr) 20-30% kuyadi.", "Uglerod (C) 5-10%, fosfor (P) 1-2% va oltingugurt (S) 2-3% kuyishi kuzatiladi.", "Asosan temir (Fe) va nikel (Ni) kuyadi, qolgan elementlar miqdori deyarli o'zgarmaydi.", "Titan (Ti) va molibden (Mo) kabi legerlovchi elementlar 50% gacha kuyishi mumkin."], ["Vagrankaning ish balandligi qaysi formula orqali aniqlanadi va undagi \"N\" nimani ifodalaydi?", "N = (4.0÷5.0)d mm formulasi bilan aniqlanadi, bu yerda N furm o'qidan yuklash oynasi pastki qismigacha masofa.", "N = (2.0÷3.0)D mm formulasi bilan aniqlanadi, bu yerda N pechning umumiy balandligi hisoblanadi.", "N = (0.5÷1.0)d mm formulasi ishlatiladi, bu yerda N ish maydonining diametrini bildiradi.", "N = (1.5÷2.5)D mm formulasi bilan hisoblanadi, bu yerda N shlak to'planadigan bo'shliq balandligidir."], ["Kulrang cho'yanning mexanik xususiyatlari asosan qanday omillarga bog'liq bo'ladi?", "Kimyoviy tarkibi, quyiladigan buyumning o'lchamlari va grafitning shakli, holati va miqdoriga.", "Faqatgina eritish jarayonining harorati va sovutish tezligi, boshqa omillar ahamiyatsiz.", "Asosan cho'yanning zichligi va uning sirtqi ishlov berish usuli, ichki strukturasi muhim emas.", "Pech turiga va yoqilg'i sifatiga bog'liq, bu esa mexanik xususiyatlarning asosiy determinantidir."], ["Sanoatda ishlatiladigan konstruksion kulrang cho'yanlar mustahkamlik darajasiga ko'ra qanday turkumlarga bo'linadi?", "Past, o'rtacha, yuqori va baland (oliy) mustahkamlikdagi konstruksion cho'yanlar toifalariga.", "Faqat past va o'rtacha mustahkamlikdagi turlar mavjud, yuqori mustahkamlikdagilar kam ishlatiladi.", "Mexanik xususiyatlariga ko'ra ikki asosiy turga bo'linadi: elastik va mo'rt cho'yanlar guruhlari.", "Kimyoviy tarkibiga qarab beshta asosiy guruhga bo'linadi, ular mustahkamlikni bevosita aniqlaydi."], ["SCH-35 markali kulrang cho'yanning markalanishidagi \"35\" raqami nimani anglatadi?", "Cho'yanning cho'zilishga mustahkamlik chegarasini, ya'ni 35 kg/mm² ni ifodalaydi.", "Cho'yan tarkibidagi uglerod miqdorining yuzdan bir ulushini, 0.35% C ni ko'rsatadi.", "Cho'yanning qattiqlik darajasini, Brinell shkalasi bo'yicha 35 HB ni bildiradi.", "Cho'yanning eritish haroratini, ya'ni 350°C da erishini ifodalaydi."], ["Uglerod miqdorining kulrang cho'yan tarkibida ortishi uning strukturasiga qanday ta'sir ko'rsatadi?", "Uglerod miqdorining ortishi cho'yan tarkibida erkin grafitning ajralishini ko'paytiradi.", "Uglerod miqdori oshganda, cho'yan yanada mustahkamroq va plastikroq bo'ladi, qattiqligi ortadi.", "Uglerodning ko'payishi po'latga o'xshash struktura hosil qiladi, bu uning yorilishga chidamliligini oshiradi.", "Cho'yanning qattiqligini pasaytiradi va uning mexanik ishlov berish xususiyatlarini yomonlashtiradi."], ["Kremniy (Si) ning cho'yan tarkibidagi asosiy vazifasi va uning xossalarga ta'siri qanday?", "Quyish xossalarini yaxshilaydi va uglerodning erkin grafit shaklida ajralishiga yordam beradi.", "Cho'yanning qattiqligini sezilarli darajada oshiradi, shu bilan birga uning mo'rtligini pasaytiradi.", "Korroziyaga chidamlilikni kuchaytiradi va cho'yan yuzasida himoya qatlami hosil bo'lishiga yordam beradi.", "Eritish haroratini pasaytiradi va cho'yanning suyuqligini kamaytiradi, bu esa quyishni osonlashtiradi."], ["Oltingugurt (S) ning cho'yanga salbiy ta'siri nimada va u qanday xodisaga olib keladi?", "FeS ximik birikmasini hosil qilib, cho'yanda \"qizil sinishlik\" hodisasini keltirib chiqaradi.", "Cho'yan tarkibidagi uglerodni to'liq bog'lab, uning plastisiyasini oshiradi va qattiqligini kamaytiradi.", "Eritish jarayonida ko'p miqdorda shlak hosil qiladi, bu esa metallning tozaligini sezilarli pasaytiradi.", "Cho'yanning zanglashga qarshiligini oshiradi va uning sirtqi qatlamining chidamliligini kuchaytiradi."], ["Cho'yan tarkibidagi oltingugurtning salbiy ta'sirini neytrallash uchun qanday element qo'shiladi va bu jarayon qanday mexanizmga asoslanadi?", "Marganets (Mn) qo'shiladi, u oltingugurt bilan birikib, MnS birikmasini hosil qiladi va uni zararsizlantiradi.", "Kremniy (Si) qo'shiladi, u oltingugurtni metall massasidan ajratib olib, shlakka o'tkazadi.", "Fosfor (P) qo'shiladi, u oltingugurtni bog'lab, cho'yanning mexanik xususiyatlariga ijobiy ta'sir ko'rsatadi.", "Xrom (Cr) qo'shiladi, u oltingugurtning erish nuqtasini pasaytirib, uning metall ichida tarqalishini cheklaydi."], ["Bolg'alanuvchan cho'yan quymalarini olish texnologiyasi qanday jarayonlardan iborat?", "Oq cho'yan qo'ymasini 900 °C haroratda 3-4 sutka davomida qizdirib, so'ng tezda sovutish yo'li bilan olinadi.", "Kulrang cho'yanni past haroratda uzoq vaqt davomida qizdirish va sekin sovutish orqali uning strukturasini o'zgartirish.", "Maxsus legerlovchi elementlar qo'shib, keyin yuqori bosim ostida deformatsiya qilish orqali metallni shakllantirish.", "Suyuq cho'yanga maxsus moddalar qo'shib, uning grafitini sharsimon shaklga keltirish va termik ishlov berish."], ["KCH-37-12 markali bolg'alanuvchan cho'yanning markalanishidagi \"37\" va \"12\" raqamlari nimani ifodalaydi?", "Birinchi raqam (37) cho'zilishga mustahkamlik chegarasini kg/mm², ikkinchisi (12) esa nisbiy cho'zilish foizini bildiradi.", "Birinchi raqam (37) cho'yan tarkibidagi uglerod miqdorini, ikkinchisi (12) esa kremniy miqdorini foizlarda bildiradi.", "Birinchi raqam (37) eritish haroratini (°C), ikkinchisi (12) esa cho'yanning qattiqlik darajasini HV shkalasi bo'yicha ko'rsatadi.", "Birinchi raqam (37) cho'yanning zarba qattiqligini (J/cm²), ikkinchisi (12) esa uning yeyilishga chidamliligini ifodalaydi."], ["Oq cho'yanning asosiy quyish xususiyatlari qaysilardan iborat bo'ladi?", "Yomon quyiluvchanligi, yuqori cho'kishi (hajm bo'yicha 5.1%), hamda yorilishga sezgir bo'lishi.", "Yuqori suyuqligi, kam cho'kishi (kulrang cho'yan kabi 1% atrofida), va yorilishga chidamliligi.", "Oson quyilishi, minimal cho'kishi va yuqori plastikligi bilan ajralib turadi, silliq sirt hosil qiladi.", "Past eritish harorati, yaxshi to'ldiruvchanlik va kichik qisqarish koeffitsienti, bu uning afzalligidir."], ["Uglerodli po'latlar markalaridagi (masalan, 25L, 45L) raqamlar nimani anglatadi?", "Po'lat tarkibidagi uglerod miqdorini yuzdan bir foizlarda (0.01%) ifodalaydi.", "Po'latning cho'zilishga mustahkamlik chegarasini kg/mm² da ko'rsatadi.", "Po'latning qattiqlik darajasini Brinell shkalasi bo'yicha bildiradi.", "Po'latning eritish haroratini Selsiy darajalarida ko'rsatadi."], ["Po'lat tarkibidagi oltingugurt (S) miqdorining oshishi uning mexanik xususiyatlariga qanday ta'sir ko'rsatadi?", "Mustahkamligi, qattiqligi va oquvchanlik chegarasi ortadi, ammo nisbiy cho'zilishi kamayadi.", "Plastikligi va nisbiy cho'zilishi ortadi, lekin mustahkamligi va qattiqligi pasayadi.", "Po'latning zanglashga qarshiligini oshiradi va uning termik ishlov berishga yaroqliligini kamaytiradi.", "Ishlov berish qiyinlashadi, metallning yorilishga sezgirligi oshadi va uning zichligi kamayadi."], ["Maxsus xususiyatli po'latlarning asosiy xususiyatlari qaysilardan iborat va ular qanday sharoitlarda qo'llaniladi?", "Zanglamaslik, kislota va ishqorga chidamlilik, kam eyiluvchanlik hamda yuqori haroratga bardoshliligi.", "Yuqori mustahkamlik, plastiklik va yuqori cho'ziluvchanlik, asosan statik va dinamik yuklamalar ostida ishlaydi.", "Maxsus magnit xususiyatlari va yuqori elektr o'tkazuvchanligi, elektromagnit qurilmalarda ishlatiladi.", "Past issiqlik kengayishi koeffitsienti va yengilligi, aviatsiya va kosmik sanoatda yuqori aniqlik talab qilinadigan qismlarda."], ["Metallarning fizikaviy xossalari qatoriga kirmaydigan xususiyatni aniqlang.", "Tashqi muhit ta'sirida emirilishga qarshilik ko'rsatish qobiliyati.", "Belgilangan haroratda ularning hajmi va o'lchamlarining kengayishi.", "Elektr tokini o'tkazishga bo'lgan qarshilik darajasi yoki qobiliyati.", "Ularning rangini, zichligini va suyuqlanish haroratini namoyon etishi."], ["Metall va qotishmalarning tashqi kuchlar ta'siriga qarshilik ko'rsata olish xususiyati qanday xossalar deb ataladi?", "Mexanik xossalar, chunki ular materialning deformatsiyaga chidamliligini ko'rsatadi.", "Texnologik xossalar, ularning ishlov berish jarayonlariga ta'sir etadi.", "Fizikaviy xossalar, ular moddaning ichki tuzilishini ifodalaydi.", "Kimyoviy xossalar, ular materialning boshqa moddalar bilan reaksiyasini belgilaydi."], ["Kristall panjara termini metall atomlarining qanday joylashishini anglatadi?", "Atomlarning ma'lum bir fazoviy tekislikda tartibli va takrorlanuvchi tarzda joylashuvi.", "Atomlarning fazoda mutlaqo tartibsiz va betartib joylashganligi holati.", "Atomlarning yuqori haroratda erkin harakatlanishiga asoslangan tartibi.", "Atomlarning faqat amorf jismlarda kuzatiladigan o'ziga xos tuzilishi."], ["Metalllarning anizotropiya xususiyati nimani anglatadi?", "Kristall jismlarning xossalarining turli yo'nalishlarda turlicha bo'lishi.", "Amorf jismlarning xossalarining barcha yo'nalishlarda bir xil bo'lishi.", "Metalllarning faqat bitta yo'nalishda mustahkamligining yuqori darajada ekanligi.", "Atomlarning fazoda tartibsiz joylashuvi natijasida hosil bo'ladigan holat."], ["Kristall panjaraning eng kichik, takrorlanuvchi birligi qanday nomlanadi?", "Elementar katakcha, u butun panjaraning asosiy qurilish blokidir.", "Kristallografik tekislik, u atomlarning joylashuv yuzasini ifodalaydi.", "Fazoviy panjara, u bir qancha parallel tekisliklar majmuidir.", "Atomlar to'plami, u faqat amorf jismlarga xos tuzilish hosil qiladi."], ["Metallning qattiqligi deganda qanday xususiyat tushuniladi?", "Bir metalga boshqa qattiqroq materialni botirishga qarshilik ko'rsatish qobiliyati.", "Metallning tashqi kuchlar ta'sirida buzilmasdan deformatsiyaga uchrashi.", "Materialning ma'lum haroratda erish holatiga o'tishi uchun kerakli energiya.", "Elektr tokini o'tkazish yoki magnit maydoniga ta'sir etish xususiyatlari."], ["Brinell qattiqligini (HB) hisoblash uchun qaysi formula qo'llaniladi, bunda P kuch va F chuqurcha yuzasi?", "HB = P / F N/mm², bu yerda F = πD/2 ⋅ (D - √D² - d²) mm² formulasi bilan aniqlanadi.", "HB = F / P N/mm², bu yerda F = πD/2 ⋅ (D + √D² - d²) mm² formulasi bilan aniqlanadi.", "HB = P ⋅ F N/mm², bu yerda F = πD/2 ⋅ (D - √D² + d²) mm² formulasi bilan aniqlanadi.", "HB = P / F N/mm², bu yerda F = πD/4 ⋅ (D - √D² - d²) mm² formulasi bilan aniqlanadi."], ["Metall suyuqligida kristallanish jarayoni qanday boshlanadi?", "Ma'lum bir haroratda atomlar gruppasi shakllanishi bilan, ular tug'ma markazlarga aylanadi.", "Atomlarning harorati ko'tarilib, ularning erkin harakati tezlashishi natijasida.", "Modifikatorlar qo'shilgandan so'ng faqat sun'iy kristallanish markazlari hosil bo'lishi bilan.", "Kristall panjaralar bir-biri bilan to'qnashib, ularning o'sish yo'lini o'zgartirishi orqali."], ["Metallning allotropiya yoki polimorfizm xususiyati nimani anglatadi?", "Turli xil sharoitlarda, masalan, harorat o'zgarishida, turli kristall panjaralar hosil qilish qobiliyati.", "Metallning faqat bitta turdagi kristall panjara tuzilishini saqlab qolish xususiyati.", "Metallning amorf holatdan kristalli holatga o'tish jarayonining nomi.", "Suyuq holatdagi metallning erkin energiyasi qiymatini kamaytirish mexanizmi."], ["Suyuq temir 1147 °S gacha sovutilganda qanday allotropik shaklga ega bo'ladi?", "Yoqlari markazlashgan kub panjara (γ-Fe), bu xossalarining o'zgarishini ko'rsatadi.", "Hajmi markazlashgan kub panjara (α-Fe), u faqat 1392 °S da hosil bo'ladi.", "Geksogonal panjara tuzilishi, bu temir uchun odatiy shakl emas.", "Amorf tuzilma, bu haroratda temir o'z tartibini yo'qotadi."], ["Metallning solishtirma og'irligi (γ) qaysi formula bilan aniqlanadi?", "γ = P / V (g/cm³), bu yerda P – moddaning massasi, V – uning hajmi.", "γ = V / P (cm³/g), bu yerda P – moddaning massasi, V – uning hajmi.", "γ = P ⋅ V (g⋅cm³), bu yerda P – moddaning massasi, V – uning hajmi.", "γ = P + V (g+cm³), bu yerda P – moddaning massasi, V – uning hajmi."], ["Qaysi metal eng yuqori issiqlik o'tkazuvchanligi koeffitsientiga ega?", "Mis (0.9), u issiqlikni boshqa metallarga nisbatan tez o'tkazadi.", "Alyuminiy (0.5), u misdan kamroq issiqlik o'tkazuvchanligini namoyon etadi.", "Temir (0.15), u pastroq issiqlik o'tkazuvchanlikka ega bo'lgan metallardan biridir.", "Simob (0.02), u metallar orasida issiqlikni eng yomon o'tkazuvchilardan biridir."], ["Metalllarning elektr o'tkazuvchanligi harorat o'zgarishiga qanday bog'liq?", "Harorat oshishi bilan elektr o'tkazuvchanligi kamayadi, harorat pasayishi bilan ortadi.", "Harorat oshishi bilan elektr o'tkazuvchanligi ortadi, harorat pasayishi bilan kamayadi.", "Elektr o'tkazuvchanligi haroratga bog'liq emas, har doim o'zgarmas qoladi.", "Mutlaq nol haroratda metallar eng yuqori qarshilikni ko'rsatadi."], ["Metalllarning korroziyaga uchrashi nimani anglatadi?", "Metallarning tashqi muhit ta'sirida kimyoviy o'zgarishlarga duchor bo'lish jarayoni.", "Metallarning yuqori haroratda erish holatiga o'tish qobiliyatini ifodalaydi.", "Metallarning mexanik kuchlanish ostida plastik deformatsiyaga uchrashi.", "Metallning ichki kristall tuzilishining o'zgarishi natijasida qattiqlikning ortishi."], ["Qanday metalllar \"o'tga chidamli\" deb ataladi?", "Cho'g'dek qizdirilganda ham strukturani, qattiqlikni saqlab qoladigan va deformatsiyalanmaydigan.", "Yuqori haroratda oksidlanishga uchramaydigan, lekin yumshashi mumkin bo'lgan metallar.", "Sovuq holatda kuchli magnit xususiyatlarni namoyon qiluvchi, lekin qizdirilganda yo'qotuvchi.", "Kislotaga, tuzga va ishqorga ta'sir qilmaydigan, lekin haroratga chidamsiz bo'lgan."], ["Rokvell usuli bo'yicha metall qattiqligini hisoblash formulasini ko'rsating.", "HR = (K - (h - ho)) / C, bu yerda h va ho botish chuqurliklari, K va C doimiy sonlar.", "HR = (K + (h + ho)) / C, bu yerda h va ho botish chuqurliklari, K va C doimiy sonlar.", "HR = C / (K - (h - ho)), bu yerda h va ho botish chuqurliklari, K va C doimiy sonlar.", "HR = K - C ⋅ (h - ho), bu yerda h va ho botish chuqurliklari, K va C doimiy sonlar."], ["Vikkers usuli bilan qattiqlikni sinashda qanday turdagi indenter qo'llaniladi?", "Burchagi 136° bo'lgan olmos piramida, u aniq iz qoldirishga mo'ljallangan.", "Diametri 1.58 mm bo'lgan po'lat sharik, u asosan yumshoq metallarni sinash uchun ishlatiladi.", "Burchagi 120° bo'lgan olmos konusi, u Rokvell usuli uchun xarakterlidir.", "Har xil diametrdagi maxsus po'lat shariklar, Brinell usulida qo'llaniladigan standart."], ["Vikkers usuli bo'yicha izning yuzasi (F) qaysi formula bilan hisoblanadi?", "F = d² / (2sin(136°/2)) yoki F = d² / 1,8544, bunda d – izning diagonali.", "F = P / (2sin(136°/2)) yoki F = P / 1,8544, bunda P – qo'llanilgan kuch.", "F = d ⋅ (2sin(136°/2)) yoki F = d ⋅ 1,8544, bunda d – izning diagonali.", "F = d² / (136°/2) yoki F = d² / 68, bunda d – izning diagonali."], ["Elastik qaytish usuli bilan qattiqlikni sinashning asosiy afzalligi nimada?", "Metall sirtida hech qanday iz qoldirmaydi, bu esa sinovni buzilmaydigan holga keltiradi.", "Juda yuqori aniqlikda o'lchash imkonini beradi, bu faqat laboratoriya sharoitida amalga oshiriladi.", "Faqat yumshoq metallar uchun qo'llaniladi, chunki qattiqroq metallar iz qoldiradi.", "Bosim kuchi va indenter diametrini o'zgartirish orqali turli sharoitda qo'llaniladi."], ["Quyidagilardan qaysi biri metalllarning mexanik xossalariga kirmaydi?", "Elektr o'tkazuvchanligi, bu materialning fizikaviy xossasidir.", "Mustahkamlik, materialning yukga qarshi turish qobiliyati.", "Qattiqlik, uning botishga qarshilik ko'rsatish darajasi.", "Plastiklik, doimiy deformatsiyaga uchray olish xususiyati."], ["Qotishma deb ikki yoki undan ortiq elementlarni birga suyuqlatish yoʻli bilan olingan qanday murakkab jismga aytiladi?", "Ikki yoki undan ortiq elementlarni birga suyuqlatish orqali olingan murakkab jism hisoblanadi.", "Metallarni maxsus sharoitlarda qattiq holatda biriktirib olingan oddiy aralashma.", "Bir xil turdagi atomlarning kimyoviy reaksiyaga kirishishi natijasida hosil boʻlgan modda.", "Faqatgina sof metallardan iborat boʻlgan, ammo turli shakllarga ega boʻlgan buyum."], ["Qotishmani boshqa usullar bilan ham olish mumkin, yaʼni kukunlarni aralashtirib, maxsus pechlarda necha darajada qizdirish orqali?", "Maxsus pechlarda 1100-1400°S haroratda qizdirish yoʻli bilan olish mumkin.", "Haroratni 500-800°S gacha koʻtarib, past bosim ostida eritish jarayoni natijasida.", "Qotishma kukunlarini 900-1000°S oraligʻida, inert muhitda qizdirib tayyorlash.", "Yuqori vakuum sharoitida, 1500-2000°S haroratda sintez qilish usulidan foydalaniladi."], ["Qotishma tarkibiga kiruvchi elementlarning atom diametrlari farqiga, kristall panjara turiga va suyuqlanish temperaturasi kabi omillarga koʻra qaysi turlarga boʻlinadi?", "Mexanik aralashma, kimyoviy birikma va qattiq eritma kabi asosiy turlarga boʻlinadi.", "Faqatgina metallar aralashmasi va metallmaslar birikmasi kabi ikki asosiy guruhga ajraladi.", "Asosan qattiq holatdagi aralashmalar va suyuq holatdagi birikmalardan tashkil topadi.", "Faqat elementlarning atom radiusiga qarab uch xil sinfga, yaʼni kichik, oʻrta, katta."], ["Mexanik aralashma qanday hosil boʻladi, agar qotishma tarkibidagi element atomlari kristallanish jarayonida bir-biriga tortilmasa?", "Atomlar bir-biriga tortilmay, mustaqil kristallar hosil qilib, mexanik aralashmani tashkil etadi.", "Atomlar kimyoviy bogʻlanish hosil qilib, murakkab kristal panjara ichida erib ketadi.", "Qotishma suyuqlangan holatda bir jinsli eritma hosil qilib, keyin har xil panjaralar hosil qiladi.", "Elementlar atomlari bir-biri bilan toʻliq erib, yagona umumiy kristal panjara yaratadi."], ["Agar qotishma tarkibiga kiruvchi elementlarning atomlari kristallanish jarayonida oʻzaro kimyoviy taʼsir etsalar, qanday birikma hosil boʻladi?", "Ular oʻzaro kimyoviy birikma hosil qiladi va kristal panjarasi murakkab boʻladi.", "Atomlar bir-biriga tortilmasdan, alohida kristallarni mustaqil hosil qiladi.", "Har bir komponentning atomlari mustaqil qattiq holatda kristallanadi, ajralib turadi.", "Bir elementning atomlari ikkinchi elementning panjarasida erib, yagona panjara hosil qiladi."], ["Qattiq eritma qanday hosil boʻladi, agar qotishmaga kiruvchi elementlar biri ikkinchisida erib qotganda?", "Sof metal kabi kristal panjarali struktura hosil qiladi, eruvchanlik saqlanadi.", "Atomlar kimyoviy bogʻlanish hosil qilib, yangi, murakkab kristal panjara yaratadi.", "Elementlar mustaqil ravishda alohida-alohida kristallanadi, bir-biriga aralashmaydi.", "Hech qanday eritma hosil qilmasdan, har bir komponent oʻz holicha qoladi, aralashmasi."], ["Qattiq eritmalar hosil qilishda qaysi element erituvchi element deb ataladi, agar uning kristal panjarasi saqlanib qolsa?", "Kristal panjarasi saqlanib qolgan element erituvchi element deb nomlanadi.", "Boshqa elementning atomlarini oʻz panjarasiga singdirgan element tushunchasi.", "Eritma tarkibida eng koʻp miqdorda boʻlgan, reaksiyaga kirishmaydigan element.", "Eritmada qattiq holatda erib ketadigan, panjarasi oʻzgargan komponent hisoblanadi."], ["Qotishma tarkibida asosiy komponentlardan tashqari oz miqdorda mavjud boʻladigan elementlar qanday nomlanadi?", "Ular primeslar deb yuritiladi va qotishmaning xossalariga aytarli taʼsir etmaydi.", "Kimyoviy birikmalar deb atalib, qotishmaning strukturasini tubdan oʻzgartiradi.", "Ligerlovchi elementlar deb nomlanib, qotishmaning mexanik xossalarini yaxshilaydi.", "Asosiy komponentlar deb hisoblanib, qotishmaning asosiy xossalarini belgilaydi."], ["Sanoatda sof metallardan foydalanish imkoniyati cheklanganligi sababli, ulardan farqli ravishda qanday detallar yasashda foydalaniladi?", "Istalgan va oldindan belgilangan xossali qotishmalardan detallar yasashda foydalaniladi.", "Maxsus sof metallarning texnologik xossalarini yaxshilovchi qoʻshimchalar qoʻshib ishlatiladi.", "Faqat yuqori tozalikdagi, kam aralashmali metallardan maxsus detallar tayyorlanadi.", "Qayta ishlangan ikkilamchi xomashyodan olingan metallardan faqatgina kichik qismlar."], ["Qotishmalarning asosiy afzalliklaridan biri nima, chunki ularning mexanikaviy va texnologik xossalari yuqori boʻladi?", "Ular mashina detallarining asosiy materiallari hisoblanadi va narxi arzon boʻladi.", "Qotishmalar sof metallardan koʻra kamroq bardoshli, lekin yengilroq boʻladi, tez buziladi.", "Ular faqat yuqori haroratga chidamli ilovalarda qoʻllaniladi, oddiy sharoitda zaiflashadi.", "Faqat elektr oʻtkazuvchanligi yuqori boʻlgan joylarda ishlatiladi, boshqa xossalari ahamiyatsiz."], ["Suyuqlantirmay turib (masalan, elektroliz qilish, qizdirib qovushtirish, sublimatlash orqali) hosil qilingan qotishmalar qanday nomlanadi?", "Ular psevdoqotishmalar (yolgʻon qondikam) deb ataladi, aniq eritma emas.", "Ular toʻliq eritmalar deb hisoblanib, barcha komponentlar bir-birida toʻla eriydi.", "Ular kimyoviy birikmalar turiga kiradi, chunki atomlar oʻzaro kuchli bogʻlanadi.", "Ular qattiq eritmalar deb nomlanib, yagona kristal panjarani hosil qiladi."], ["Qotishmalarning suyuq holatdan qattiq holatga oʻtishi jarayoni fan tilida qanday nomlanadi?", "Bu jarayon birlamchi kristallanish deb yuritiladi, fazalar ajralib chiqadi.", "Ikkilamchi eritmalar hosil boʻlishi jarayoni boʻlib, bu paytda qattiq fazalar aralashadi.", "Qayta kristallanish deb atalib, qotishma strukturasida qayta tartiblanish yuzaga keladi.", "Termik stabillashuv jarayoni boʻlib, qotishmaning umumiy energiyasi kamayadi."], ["Mexanik aralashmalar mikroskop ostida koʻrilganda komponentlarning bir-biridan maʼlum chegara bilan ajralib turishi qanday faza tushunchasini bildiradi?", "Bu har bir komponent alohida fazani tashkil etganini koʻrsatadi, ikki fazali qotishma.", "Komponentlarning bir-birida toʻliq erib ketganini va bir fazali tuzilma ekanligini.", "Kimyoviy reaksiyalar natijasida yangi birikmalar hosil boʻlganligini isbotlaydi.", "Atomlarning oʻrin almashuvi natijasida gʻovakliklar paydo boʻlganligini anglatadi."], ["Qotishmalarning holat diagrammasi nimani koʻrsatadi, boshqacha aytganda qanday xususiyatini aks ettiradi?", "Biror qotishmaning qaysi bir temperaturada qanday holatda boʻlishini koʻrsatuvchi.", "Qotishmaning atom ogʻirligi va solishtirma ogʻirligi orasidagi bevosita bogʻliqlikni.", "Qotishmaning elektr oʻtkazuvchanligi va issiqlik oʻtkazuvchanligi oʻzgarishini.", "Asosiy komponentlarning kimyoviy faolligi va korroziyaga chidamliligi haqida."], ["Evtektika deb nimaga aytiladi, yaʼni qanday qotishma eng past temperaturada suyuqlanadigan hisoblanadi?", "Evtektika — oson suyuqlanuvchan qotishma, eng past haroratda qotadi.", "Yuqori haroratda ham qattiq holatda qoladigan, qiyin suyuqlanuvchan qotishma turi.", "Faqat suyuq holatda mavjud boʻladigan, lekin hech qachon toʻliq qotmaydigan aralashma.", "Oʻz tarkibidagi komponentlarning bir-biriga kimyoviy taʼsir etmaydigan tizimi."], ["Qotishmaning holat diagrammasida likvidius chizigʻi bilan solidius chizigʻi orasida qotishmalar qaysi holatda boʻladi?", "Qotishmalar ham suyuq, ham qattiq holatda mavjud boʻladi, ikki fazali hudud.", "Qotishmalar faqatgina qattiq holatda, toʻliq kristallangan fazani tashkil etadi.", "Qotishmalar faqatgina suyuq holatda, bir jinsli eritma koʻrinishida boʻladi.", "Ushbu hududda qotishmalar noʻmalum fazaviy holatda boʻladi, aniqlanmagan."], ["Eng ogʻir metallardan biri simob (Hg) boʻlib, uning solishtirma ogʻirligi qancha boʻladi?", "Uning solishtirma ogʻirligi 13.6 g/sm³ ga teng, bu juda yuqori koʻrsatkichdir.", "Solishtirma ogʻirligi 7.14 g/sm³ atrofida boʻlib, koʻkish-oq tusli metal hisoblanadi.", "Solishtirma ogʻirligi 11.34 g/sm³ ga yaqin, oqish-gʻavorang tusli, gʻoyat plastik.", "Solishtirma ogʻirligi 0.53 g/sm³ ni tashkil etadi, u eng engil metall hisoblanadi."], ["Ruh (Zn) 419 °C da suyuqlanadi va 100-110 °S da plastik holatga keladi. U qanday metallar davriy sistemasining qaysi guruhida joylashgan?", "U D.I.Mendeleev elementlar davriy sistemasining II guruhida joylashgan.", "U D.I.Mendeleev elementlar davriy sistemasining IV guruhida joylashgan.", "U D.I.Mendeleev elementlar davriy sistemasining III gruppasida joylashgan.", "U D.I.Mendeleev elementlar davriy sistemasining V guruhida joylashgan."], ["Latun deb misning qaysi element bilan hosil qilgan qotishmalariga aytiladi?", "Misning rux bilan hosil qilgan qotishmalari Latunlar deb nomlanadi.", "Misning qalay bilan hosil qilgan qotishmalari Bronzalar deb ataladi.", "Misning alyuminiy bilan hosil qilgan qotishmasi maxsus Al bronza hisoblanadi.", "Misning nikel bilan hosil qilgan qotishmalari maxsus nikel bronzalari hisoblanadi."], ["Alyuminiyning kimyoviy belgisi Al, tartib nomeri 13, atom ogʻirligi 26,9815 va solishtirma ogʻirligi qancha boʻlgan yumshoq metall hisoblanadi?", "Uning solishtirma ogʻirligi 2.7 g/sm³ boʻlgan yumshoq, plastik, oq tusli metall.", "Uning solishtirma ogʻirligi 8.93 g/sm³ boʻlib, qizgʻish rangli, choʻziluvchan metall.", "Uning solishtirma ogʻirligi 7.3 g/sm³ boʻlgan, yumshoq, oqish rangli metall turidir.", "Uning solishtirma ogʻirligi 11.34 g/sm³ boʻlgan, oqish-gʻavorang tusli, gʻoyat plastik."], ["Po'latning cho'yandan asosiy farqi nimada bo'lib, bu metallar qanday xususiyatlarga ega?", "Po'lat cho'yandan tarkibidagi elementlar miqdori bilan farq qiladi, yuqori ximiyaviy va fizik mexanik xususiyatga ega, qattiqligi yetarli, yaxshi kesiladi.", "Cho'yan po'latdan mustahkamroq va qayta ishlashga chidamliroq, shuning uchun asosan mashinasozlikda yuqori sifatli detallar uchun ishlatiladi.", "Po'lat tarkibida ko'proq uglerod saqlaydi, bu esa uni mo'rtroq qiladi, ammo cho'yan elektr o'tkazuvchanligi yuqori bo'lgan material hisoblanadi.", "Cho'yan yuqori erish nuqtasiga ega bo'lgan metall bo'lib, po'lat esa tez qotadi, bu ularni turli xil quyish jarayonlarida qo'llash imkonini beradi."], ["Kislorodli konvertorlarda po'lat ishlab chiqarishning Marten pechlariga nisbatan afzalliklari qaysi javobda to'g'ri ko'rsatilgan?", "Ish unumi yuqori, uskunalarning konstruksiyasi sodda, boshqarish qulay, yonilg'i ishlatilmaydi va tannarxi arzon bo'ladi.", "Po'lat tarkibini aniq nazorat qilish osonroq, shuningdek shlakni to'liq ajratish imkoniyati yuqori va metallolomdan ko'proq foydalaniladi.", "Olingan po'lat gazlar va shlaklar bilan kam ifloslanadi, bu esa uning mexanik xossalarini sezilarli darajada yaxshilanishiga olib keladi.", "Turli xil tarkibli cho'yan va metall chiqindilarni qayta ishlash imkoniyati kengroq, natijada istalgan tarkibli po'latlar olinadi."], ["Marten pechlarida ish jarayonida hosil bo'ladigan uglerodning oksidlanish reaksiyasi qanday ifodalanadi?", "C + FeO = Fe + CO ko'rinishida amalga oshib, CO gazi metallni qaynishiga yordam beradi.", "2C + O₂ = 2CO₂ ko'rinishida kechib, atmosferaga chiqadigan CO₂ miqdorini kamaytiradi.", "CO + ½O₂ = CO₂ ko'rinishida boradi, bu esa metallni kislorod bilan to'yinishiga sabab bo'ladi.", "2C + Fe₂O₃ = 2CO + 2Fe ko'rinishida o'tib, temir oksidi miqdorini doimiy ushlab turadi."], ["Marten pechlarida fosforni qaytarish (defozforizatsiya) jarayoni qanday kimyoviy reaksiya orqali sodir bo'ladi?", "(FeO)₃P₂O₅ + 4CaO = (CaO)₄P₂O₅ + 3FeO formulasi bilan yuqori haroratda ohak ishtirokida amalga oshiriladi.", "2P + 5FeO = 5Fe + P₂O₅ formulasi bilan fosfor temir oksidi bilan reaksiyaga kirishib, shlakka o'tadi.", "4P + 5O₂ = 2P₂O₅ formulasi bilan fosfor bevosita kislorod bilan oksidlanadi va gaz holatida chiqariladi.", "P₂O₅ + CaO = Ca₃(PO₄)₂ formulasi bilan fosfor oksidi ohak bilan birikib, shlakdan ajraladi."], ["Kislorodli konvertorlarda po'lat olish jarayonining davomiyligi va bir tonna po'lat olish uchun sarflanadigan kislorod miqdori qancha?", "Jarayon uzoqligi pech hajmiga qarab 30-60 minut, bir tonna po'lat uchun 2.2-4.5 m³ kislorod haydaladi.", "Jarayon davomiyligi 10-20 minutni tashkil etadi, bir tonna po'lat ishlab chiqarishga 4.5-5.0 m³ kislorod sarflanadi.", "Jarayon 60-90 minut davom etadi, bir tonna po'lat hosil qilish uchun 5.0-7.0 m³ kislorod kerak bo'ladi, yuqori sifatli po'latlar olinadi.", "Jarayon 20-30 minutni tashkil etadi, bir tonna po'latga 1.5-2.0 m³ kislorod haydaladi, bu esa jarayonni tezlashtirish imkonini beradi."], ["Elektr yoy pechlarida po'lat eritishning afzalliklari nimada, ular boshqa pechlarga nisbatan qanday ustunliklarga ega?", "Tuzilishi sodda, boshqarish qulay, turli markadagi po'latlarni arzon shixtadan olish mumkin va energiyadan foydalanish koeffitsienti yuqori.", "Yuqori chastotali tokdan foydalanish hisobiga metall tarkibidagi gazlarni to'liq chiqarib tashlash imkonini beradi va eritish vaqti ancha qisqaradi.", "Alanga bo'lmagani uchun havoning kamligi sifatli po'lat olishga yaxshi atmosfera yaratadi, shuningdek uglerod miqdorini nazorat qilish osonlashadi.", "Metall erishi tufayli oksidlarni birikishi natijasida hosil bo'lgan shlak metall sirtida ajraladi, eritishda juda oz metall kuyindisi chiqariladi."], ["Kislorodli konvertorlarda po'lat ishlab chiqarishda ishlatiladigan shixta materiallarining tarkibi qanday bo'lishi mumkin?", "Suyuq oq cho'yan, po'lat temir-tersagi, ohaktosh, temir rudasi, boksit, dala shpati asosiy komponentlar hisoblanadi.", "Qora metallolom, koks, antratsit, qum, shlak hosil qiluvchi qo'shimchalar, turli xil legirlovchi elementlar birgalikda ishlatiladi.", "Asosan chushka cho'yan, temir rudasi va yaroqsiz metall qoldiqlari, ba'zan esa uglerod miqdorini oshirish uchun toshko'mir qo'shiladi.", "Yuqori sifatli temir ruda, oz miqdorda ohaktosh va tabiiy gaz, shuningdek suyuq cho'yan va kislorod aralashmasi ishlatiladi."], ["Marten pechlarida desulfurizatsiya (oltingugutdan tozalash) jarayoni qanday kimyoviy reaksiya orqali sodir bo'ladi?", "FeS + CaO = FeO + CaS formulasi bo'yicha ohak yordamida oltingugurt shlakka o'tadi.", "S + 2FeO = 2Fe + SO₂ formulasi bo'yicha oltingugurt temir oksidi bilan reaksiyaga kirishadi.", "2FeS + O₂ = 2FeO + 2S formulasi bo'yicha temir sulfidi kislorod bilan oksidlanadi.", "CaS + O₂ = CaO + SO₂ formulasi bo'yicha kalsiy sulfidi kislorod ta'sirida parchalanadi."], ["Elektr induksion pechlarining ishlash prinsipi va hosil bo'ladigan harorati qanday tavsiflanadi?", "Elektromagnit energiyaning induksion yo'l bilan o'zgarishi asosida ishlaydi, yuqori chastotali tok ta'sirida metall qiziydi va eriydi, harorat 2000 °C ga yaqin bo'ladi.", "Elektr yoyi hosil qilish orqali metallni eritishga asoslanadi, har bir elektrod bilan metall orasida yonadi va harorat 1800-1900 °S ga yetadi.", "Qizdirilgan gazning, qizdirilgan havoda yondirilishi natijasida pechning ishchi yuzasida harorat 1800-1900 °S ga etadi, bu esa po'lat ishlab chiqarish uchun etarlidir.", "Kimyoviy reaksiyalar natijasida ajralib chiqadigan issiqlik energiyasidan foydalanishga asoslanadi, bu esa metallning haroratini 1500-1600 °S gacha ko'taradi."], ["Marten pechlarining asosiy qismlari qaysilar, ularning tuzilishi va ishlatiladigan olovbardosh materiallar haqida ma'lumot bering?", "Pechning asosiy qismi vannadir, devorlari o'tga chidamli dinas yoki xrom-magnezit g'ishtlardan terilgan, pech tubi metalni joylaydi.", "Asosiy qismi yuqori qismidagi bo'g'iz, devori o'tga chidamli materialdan yasalgan va tashqi tomoni po'lat list bilan qoplangan.", "Elektr yoyi hosil qiluvchi elektrodlar va shu bilan bog'liq bo'lgan kamera tizimi, pech devorlari esa kislotali magnezit g'ishtlardan terilgan.", "Asosiy qismi suyuq metallni eritish uchun tigel, u mis trubadan yasalgan bo'lib, suv bilan sovutiladi va yuqori chastotali tok ta'sirida ishlaydi."], ["Kislorodli konvertorlarda po'lat sifati pasayishiga olib keladigan asosiy sabab nima, agar havoda ishlatilsa?", "Havoning tarkibidagi ba'zi elementlar, masalan azot, po'latga singib qolishi natijasida po'latning sifati pasayadi.", "Kislorod miqdorining yetarli bo'lmasligi tufayli uglerodning to'liq oksidlanmasligi, bu esa metallning qattiqligini oshirib yuboradi.", "Pech devorlari kislota xarakterli g'ishtlardan terilganligi sababli, metallga zararli qo'shimchalar o'tishi va sifatni buzishi mumkin.", "Jarayonning qisqa muddatda borishi po'lat tarkibini aniq nazorat qilishni qiyinlashtiradi, bu esa zaruriy sifatga erishishga to'sqinlik qiladi."], ["Marten pechlarining ish unumi va olingan po'lat sifati haqida qanday ma'lumotlar berilgan?", "Ish unumi 80 t/s bo'lib, olingan po'lat sifati yaxshi, chunki gazlar va shlak kam bo'ladi, mexanik xossalari yuqori.", "Ish unumi 400-500 t/s ga yetadi, lekin po'lat tarkibidagi uglerod nazorati qiyinligi sababli sifati pastroq bo'ladi.", "Ish unumi 20-30% ga oshishi mumkin, bu esa regeneratorlar yordamida erishiladi, ammo metall tarkibida azot miqdori ko'proq bo'ladi.", "Ish unumi kichik hajmli pechlarda 25-100 tonna atrofida bo'lib, o'rtacha sifati ham Marten pechlariga nisbatan sezilarli darajada pasayadi."], ["Kislorodsizlantirish jarayoni nimaga asoslangan va u qanday materiallar yordamida amalga oshiriladi?", "Jarayon oxirida temir kislorod bilan tuyinib qoladi, shuning uchun Mn, Si, Al solinadi va ular temir oksididagi kislorod bilan birikib, shlakka o'tadi.", "Jarayon oxirida uglerodni yo'qotish uchun ohak va temir rudasi qo'shiladi, ular kislorodni o'ziga tortib, metallni tozalaydi.", "Jarayon cho'yanni suyultirish bilan boshlanadi, bu esa metall tarkibidagi barcha zararli elementlarni yuzaga chiqarishga yordam beradi.", "Jarayon metallga kislorod haydash bilan amalga oshiriladi, bu esa barcha qo'shimchalarning oksidlanishiga va shlak hosil bo'lishiga olib keladi."], ["Marten pechlarining hajmlari qanday diapazonda bo'ladi va ularda qancha muddatda po'lat eritib olish mumkin?", "Eng ko'p tarqalgan hajmlar 50-175 t gacha bo'lib, bir sutkada 2-5 marta po'lat eritib olish mumkin, ish hajmi 500 t gacha yetishi ham mumkin.", "Hajmlari 0.5-500 t gacha bo'ladi, o'rtacha pechlarniki 25-100 t, bir sutkada 3-6 martagacha po'lat eritib olish mumkin.", "Hajmlar V=100-300 t bo'lib, ayrim hollarda 500 t gacha yetishi mumkin, jarayon uzoqligi 30-60 minutni tashkil etadi.", "Marten pechlarining hajmi doimiy bo'lib, bir sutkada 1-2 marta po'lat eritib olish mumkin, bu esa yuqori sifatli po'latlar uchun qo'llaniladi."], ["Po'lat ishlab chiqarishda qo'llaniladigan kombinasiyalashgan usul (dupleks yoki tripleks jarayoni)ning asosiy maqsadi nimada?", "Kimyoviy tarkibi aniq bo'lgan po'latni konvertorlarda olish qiyinligi va elektr pechlarida qimmatga tushishi sababli, shixtani eritish uchun energiya sarfini kamaytirish.", "Ushbu usul metallolomdan foydalanish imkoniyatini oshirish va po'lat eritish jarayonini tezlashtirish uchun qo'llaniladi, bu esa ishlab chiqarishni ko'paytiradi.", "Bu usulda po'lat tarkibidagi zararli qo'shimchalarni to'liq yo'qotish va metallning mexanik xususiyatlarini maksimal darajada yaxshilash nazarda tutiladi.", "Asosan legirlangan po'latlarni ishlab chiqarishda qo'llaniladi, bu usulda yakuniy mahsulotning strukturasi va donadorligini nazorat qilish osonlashadi."], ["Marten pechlarida shixta materiallarini qayta ishlashning necha xil jarayoni qo'llaniladi?", "Shixta materiallarining harakteriga qarab 4 xil jarayon qo'llaniladi: skrap, cho'yan rudali, skrap ruda va karbyuratorli jarayonlar.", "Asosan 2 xil jarayon qo'llaniladi: kislotali va asosli jarayonlar, ular pech devorlarining materiallariga bog'liq bo'ladi.", "Umuman 3 xil jarayon qo'llaniladi: eritish, oksidlash va kislorodsizlantirish, bu jarayonlar har bir Marten pechida ketma-ket bajariladi.", "Faqatgina 1 xil jarayon qo'llaniladi: umumiy eritish jarayoni, bunda barcha shixta materiallari bir vaqtda pechga solinib eritiladi."], ["Kislorodli konvertorga quyilayotgan cho'yanning harorati qanday diapazonda bo'lishi kerak va temir rudasi hamda skrapdan foydalanish foizi qancha?", "Cho'yanning temperaturasi 1250-1400 °C bo'lishi kerak, katta hajmda 20-30% temir ruda va skrapdan foydalanish mumkin.", "Cho'yanning harorati 1500-1600 °C atrofida bo'lishi talab etiladi, 10-15% gacha temir rudasi va skrap ishlatiladi.", "Cho'yan harorati 1100-1200 °C dan oshmasligi kerak, bunda 30-40% temir rudasi va skrap qo'shilishi tavsiya etiladi.", "Cho'yan harorati 1350-1450 °C oralig'ida bo'lib, unga 5-10% temir rudasi va skrap aralashtiriladi, bu esa sifati yaxshilaydi."], ["Elektr yoy pechlarida ishlatiladigan elektrodlar qanday materialdan yasaladi va ularning energiya sarfi qancha?", "Grafit elektrodlar ishlatiladi, ular ko'mir elektrodlarga nisbatan yuqori haroratga chidamli va tokka qarshiligi kam, bir tonna po'latga 5-10 kg grafit elektrod sarflanadi.", "Ko'mir elektrodlar asosan ishlatiladi, chunki ular arzon va oson topiladi, bir tonna po'latga 15-20 kg ko'mir elektrod sarflanadi.", "Temir elektrodlar qo'llaniladi, chunki ular yuqori elektr o'tkazuvchanlikka ega, bir tonna po'lat ishlab chiqarishga 2-3 kg temir elektrod ketadi.", "Kremniy karbid elektrodlari ishlatiladi, ular juda qattiq va uzoq muddat xizmat qiladi, bir tonna po'latga 10-12 kg kremniy karbid elektrod sarflanadi."], ["Qadim zamonlarda po'lat olish jarayoni qanday bo'lgan va sanoat ehtiyojlari uchun ishlab chiqarish qachon rivojlangan?", "Qadim zamonlarda oz miqdorda po'lat olishgan, ammo sanoat tez o'sishi bilan talab kuchayib, 1856 yilda Genri Bessemer po'lat ishlab chiqarishni kashf etgan.", "Po'lat ishlab chiqarish qadimdan keng tarqalgan bo'lib, sanoatning rivojlanishi bilan 1886 yilda Marten pechlari yordamida yanada takomillashtirilgan.", "Qadimda po'lat faqat qurollar uchun ishlab chiqarilgan, sanoat ehtiyojlari uchun esa elektr pechlari paydo bo'lgandan so'ng, XIX asr oxirida rivojlangan.", "Qadimgi jamiyatlarda po'lat faqat hunarmandchilikda qo'llanilgan, XX asr boshlariga kelib, kombinasiyalashgan usullar joriy etilishi bilan sanoatlashtirilgan."], ["Elektr induksion pechlarning asosiy kamchiligi nimada, bu ulardan foydalanishni qanday cheklaydi?", "Ular yoyli pechlarga nisbatan energiyani ko'p sarf qiladi, bu esa ishlab chiqarish xarajatlarini sezilarli darajada oshiradi.", "Bu pechlar faqat kichik hajmdagi po'latlarni eritish uchun mo'ljallangan, katta hajmli ishlab chiqarishda samaradorligi past bo'ladi.", "Metall tarkibidagi uglerod va boshqa qo'shimchalarni aniq nazorat qilish imkoniyati cheklangan, bu esa yuqori sifatli po'lat olishni qiyinlashtiradi.", "Ular metallni juda yuqori haroratgacha qizdirgani sababli, elektrodlarning tez yemirilishi sodir bo'ladi va ularni tez-tez almashtirish talab etiladi."], ["Quymakorlik san'ati qaysi davrda va qaysi mamlakatlarda paydo bo'lganligi haqida dastlabki ma'lumotlar mavjud?", "Miloddan avvalgi 5000 yil oldin Misr, Gretsiya va Xitoyda. (64 belgili)", "Miloddan avvalgi 3000 yil oldin Rim, Hindiston va Mesopotamiyada. (68 belgili)", "Miloddan avvalgi 1000 yil oldin Fors, Vizantiya va Yaponiyada. (64 belgili)", "Miloddan avvalgi 2000 yil oldin Mayya, Inka va Aztek sivilizatsiyalarida. (72 belgili)"], ["Qadimgi Rossiyada cho'yan quymalar ishlab chiqarish qaysi asrlarda boshlangan?", "XV-XVI asrlarda mis va bronza buyumlari bilan bir vaqtda rivojlangan.", "XIII-XIV asrlarda faqat bronza quyish texnologiyalari ustunlik qilgan.", "XVII-XVIII asrlarda po'lat quyish korxonalari faoliyat boshlagan.", "XI-XII asrlarda faqat qimmatbaho metallardan zargarlik buyumlari uchun."], ["XIX asrning ikkinchi yarmigacha quymakorlik ilmiy asosga ega bo'lmagan, so'ngra qaysi rus olimlari tomonidan uning asoslari yaratildi?", "A. S. Lavrov, N. V. Kalakutskiy, P. P. Anosov, P. M. Obuxov, D. K. Chernov, A. A. Baykov.", "M. V. Lomonosov, D. I. Mendeleev, N. I. Lobachevskiy, I. P. Pavlov kabi olimlar.", "K. E. Tsiolkovskiy, S. P. Korolev, A. N. Tupolev, I. V. Kurchatov tomonidan.", "V. I. Vernadskiy, N. N. Semenov, I. M. Sechenov, I. I. Mechnikovning tadqiqotlari."], ["Suyuqlantirilgan metall yoki qotishmani qoliplarga quyish yo'li bilan turli shakldagi zagotovka, buyum yoki detallar hosil qilish san'ati nima deb ataladi?", "Quymakorlik deb atalib, uning mahsuloti esa \"quyma\" nomini oladi.", "Metallurgiya jarayoni deb atalib, uning mahsuloti esa \"eritma\" deb belgilanadi.", "Mexanik ishlov berish deb atalib, uning mahsuloti esa \"zagotovka\" bo'ladi.", "Termik ishlov berish jarayoni deb atalib, uning mahsuloti esa \"qotishma\" bo'ladi."], ["Mashina detallarining og'irlik jihatdan qariyb qancha foizi quyma tarzida olinadi, bu esa texnik-iqtisodiy afzallik beradi?", "40-80% gacha bo'lgan qismi turli shakldagi va og'irlikdagi buyumlar.", "20-30% gacha bo'lgan qismi kichik hajmli va yengil detallar.", "85-95% gacha bo'lgan qismi yuqori aniqlikdagi nozik qismlar.", "10-15% gacha bo'lgan qismi maxsus mustahkamlangan komponentlar."], ["Ishlab chiqariladigan quymalarning turi tez-tez o'zgarib turadigan quymakorlik korxonalari qanday nomlanadi?", "Individual korxonalar bo'lib, ular buyurtma asosida kichik miqdorda ishlaydi.", "Seriyalab ishlab chiqaruvchi korxonalar bo'lib, mahsulotlari standarti yuqori.", "Ko'plab quymalar ishlab chiqaruvchi yirik zavodlar bo'lib, ommaviy ishlab chiqaradi.", "Tajriba-eksperimental ustaxonalar bo'lib, yangi texnologiyalarni sinovdan o'tkazadi."], ["Asosan qum va gilni suv bilan qorishtirib tayyorlanadigan, faqat bir marta ishlatiladigan qoliplar qanday nomlanadi?", "Bir martalik qoliplar bo'lib, ular an'anaviy usulda ishlab chiqariladi.", "Muvaqat qoliplar bo'lib, ular yuqori haroratga chidamli materiallardan.", "Doimiy qoliplar bo'lib, ular metall qotishmalaridan yasaladi.", "Maxsus qoliplar bo'lib, ular murakkab shakllar uchun mo'ljallangan."], ["Asosan cho'yan va po'latdan (ba'zan mis va alyuminiy qotishmalaridan) tayyorlanadigan qoliplar qanday toifaga kiradi?", "Doimiy qoliplar bo'lib, ular qayta-qayta foydalanish uchun mo'ljallangan.", "Bir martalik qoliplar bo'lib, ular har bir quyma uchun yangilanadi.", "Muvaqat qoliplar bo'lib, ular o'rta muddatli ishlatishga mo'ljallangan.", "Aralash qoliplar bo'lib, turli materiallar kombinatsiyasidan iboratdir."], ["Nam qoliplar quyma olish siklini qisqartirib, narxini arzonlashtirsa-da, quruq qoliplar bilan solishtirganda qanday kamchilikka ega?", "Zich va puxtalikka ega bo'lmaydi, chunki namlik sababli g'ovakliklar paydo bo'ladi.", "Yuqori issiqlik o'tkazuvchanligiga ega bo'lib, metallning tez sovishiga olib keladi.", "Yaxshi gaz o'tkazuvchanligiga ega bo'lib, bu gazlarning oson chiqishini ta'minlaydi.", "Uzoq muddatli foydalanishga mo'ljallanmagan bo'lib, tezda yaroqsiz holga keladi."], ["Qolipga quyiladigan aralashmalarning asosiy texnik talablari nimadan iborat?", "Puxta, plastik, gaz o'tkazuvchan, o'tga chidamli, siqiluvchan, metallarga yopishmaydigan va tannarxi arzon bo'lishi.", "Yuqori elektr o'tkazuvchanlik, minimal g'ovaklik, oson ajralish va yuqori zichlik.", "Past issiqlik sig'imi, yuqori zichlik, kimyoviy passivlik va suvga chidamli bo'lishi.", "Oson eruvchan, yopishqoq, tez qotuvchi va yuqori darajada magnitlanuvchan bo'lishi."], ["Model komplektiga asosan qaysi komponentlar kiradi va ulardan eng muhimi qaysi biri hisoblanadi?", "Model, tag taxtasi, sterjen yashiklari, model plitalari, nazorat andazalari, shibba, opoka, lineyka va eng muhimi modeldir.", "Faqat model, sterjen yashiklari va opoka kiradi, qolganlari yordamchi elementlar vazifasini bajaradi.", "Model plitalari, nazorat andazalari va lineyka, model esa alohida tayyorlanishi lozim.", "Asosan tag taxtasi, shibba va lineyka, model komplektga kiritilmaydi, u alohida."], ["Model komplekti materiallari sifatida nimalardan foydalaniladi va metall modellarining asosiy afzalligi nimada?", "Yog'ochlar, metall qotishmalari va plastmassalar; metall modellar o'lchamlarini uzoq vaqt saqlaydi.", "Shisha, keramika va rezina; metall modellar yuqori elektr o'tkazuvchanligiga ega bo'ladi.", "Tsement, gips va polimerlar; metall modellar eng arzon material hisoblanadi.", "Qog'oz, mato va charm; metall modellar eng yengil va oson ishlov beriluvchan."], ["Qolip materiallarida model aksini olishga ko'maklashuvchi ramaga nima deyiladi va uning turlari qanday?", "Opokalar deb ataladi; ajraluvchi, ajralmaydigan, qovurg'asiz va kovurg'ali turlari mavjud.", "Sterjen yashiklari deb ataladi; ochiladigan, yopiladigan, burama va silindrsimon shakllari.", "Model plitalari deb ataladi; tekis, botiq, qavariq va o'yma yuzali turlari bor.", "Qolip tana qismlari deb ataladi; yuqori, pastki, yon va oraliq qismlarga bo'linadi."], ["Vtulka quymasi hosil qilish misolida quymakorlik sanoati texnologiyasi qaysi asosiy bosqichlarni o'z ichiga oladi?", "Model va sterjen qolipini tayyorlash, metall quyish, qolipni buzish, quymani tozalash.", "Faqat suyuq metallni eritish va uni qolipga quyish, so'ngra sovutish va qotirish.", "Faqat quymani mexanik ishlov berish va unga yakuniy ko'rinish berish amallari.", "Faqat xomashyoni tanlash va uni eritish uchun pechlarni sozlash va ta'mirlash."], ["Quymakorlik sexlarida quyma buyumlar ishlab chiqarish texnologik operatsiyalaridan biri sifatida metall qolip yuzasiga qanday ishlov beriladi?", "O'tga chidamli qatlam qoplash va uning ustidan yupqa maxsus buyoqlar berish.", "Qolip yuzasini silliqlash va maxsus parlatish pastalari bilan ishlov berish.", "Qolip yuzasini suv bilan yuvish va unga himoya plyonkasi tortish amaliyoti.", "Qolip yuzasini elektr toki yordamida oksidlash va korroziyadan himoyalash."], ["Modelning o'lchamlari tayyorlanadigan quymaning o'lchamlaridan kattaroq qilinishi nimaga bog'liq?", "Qolipga quyilgan metall qotishida ma'lum darajada kirishishi (qisqarishi) hisobga olinadi.", "Metallning og'irligi va zichligini kompensatsiya qilish uchun oldindan kattalashtiriladi.", "Qolipdan oson ajralishi va silliq yuzaga ega bo'lishi uchun xato yuzalar qoldiriladi.", "Quyma metallining rangini saqlash va uning strukturaviy yaxlitligini ta'minlash uchun."], ["Jadvalda keltirilgan qotishmalarning erkin chiziqli kirishuvini foiz hisobida qaysi formula yordamida hisoblash mumkin?", "Δlch.k = (lm - lq) / lm ⋅ 100% (lm - model uzunligi, lq - quyma uzunligi).", "Δlch.k = (lm + lq) / lm ⋅ 100% (lm - model uzunligi, lq - quyma uzunligi).", "Δlch.k = (lm ⋅ lq) / lm ⋅ 100% (lm - model uzunligi, lq - quyma uzunligi).", "Δlch.k = (lm / lq) ⋅ 100% (lm - model uzunligi, lq - quyma uzunligi)."], ["Modelni qolipdan chiqarish oson bo'lishi uchun uning vertikal yuzalari ma'lum darajada qiya qilib tayyorlanadi. Yog'och va metall modellar uchun bu qiyalik burchagi qancha bo'ladi?", "Yog'och modellar uchun 0°15′ dan 3° gacha, metall modellar uchun esa 0°20′ dan 1°30′ gacha.", "Yog'och modellar uchun 5° dan 10° gacha, metall modellar uchun esa 3° dan 7° gacha.", "Yog'och modellar uchun 0° dan 1° gacha, metall modellar uchun esa 0°30′ dan 0°45′ gacha.", "Yog'och modellar uchun 10° dan 15° gacha, metall modellar uchun esa 7° dan 12° gacha."], ["Sterjenlar qolipga qaraganda og'irroq sharoitda ishlashi sababli ularning materiallariga qanday talablar qo'yiladi?", "Puxtaroq, gazlarni yaxshi o'tkazishi, quymadan oson ajraladigan va nam tortmaydigan bo'lishi.", "Yuqori issiqlik o'tkazuvchanligi, past zichlik, oson eruvchanligi va tez qotishi.", "Minimal mexanik mustahkamlik, past gaz o'tkazuvchanlik va yuqori yopishqoqlik.", "Yuqori elektr o'tkazuvchanligi, magnitlanuvchanlik va qisman korroziyaga chidamli bo'lishi."], ["Quyiladigan quyma devori qanchalik yupqa bo'lsa, quyiladigan metall yoki qotishmaning temperaturasi qanday bo'lishi talab qilinadi?", "Shuncha yuqori bo'lishi talab qilinadi, chunki ingichka devorlar tez sovushga moyil.", "Shuncha past bo'lishi talab qilinadi, chunki ortiqcha issiqlik deformatsiyaga olib keladi.", "Harorat o'rtacha bo'lishi talab qilinadi, qalin devorlarga nisbatan farq qilmaydi.", "Maxsus qo'shimchalar orqali barqaror bo'lishi talab qilinadi, harorat ahamiyatli emas."]]}, {"name": "Metrologiya, standartlashtirish va o‘zaro almashuvchanlik", "q": [["Qadimgi davrlarda qo'llanilgan «organoleptik o'lchashlar» iborasi nimani anglatadi?", "Insonning his etish a'zolari vositasida fizik xossalarni taxminiy baholash usulini", "Maxsus optik asboblar yordamida olingan o'ta yuqori aniqlikdagi hisoblash tizimini", "Tabiatdagi fizik hodisalarning matematik modellarini tuzish va tahlil qilishni", "Xalqaro etalonlar asosida fizik parametrlarni laboratoriyada qiyoslash uslubini"], ["Qadimgi antropometrik o'lchov birliklaridan biri bo'lgan «qarich» qanday aniqlangan?", "Qo'l kafti yoyilganda bosh barmoq va jimjiloq orasidagi masofa bilan", "Qo'l kafti yozilganda ko'rsatkich va bosh barmoq orasidagi masofa bilan", "Odamning tirsagidan boshlab o'rta barmoqning uchigacha bo'lgan masofada", "To'rtta barmoqning yonma-yon qo'yilgandagi umumiy enining kengligi bilan"], ["Tarixiy antropometrik o'lchovlar tizimida «qadam» birligi qanday tavsiflanadi?", "Balog'at yoshidagi shaxsning bir maromdagi sokin yurish oraliq o'lchovi", "Chopish paytida insonning ikki oyog'i orasida hosil bo'ladigan keng oraliq", "Voyaga yetgan odamning eng maksimal darajada keng ochilgan oyoq qadami", "Harbiy askarlarning safda yurishi chog'idagi o'rtacha qat'iy belgilangan siljish"], ["Qadimgi uzunlik o'lchovlari jadvaliga muvofiq «tutam» qanday qiymatga ega bo'lgan?", "4 ta barmoq kengligiga teng bo'lib, 8,7 - 9,1 sm oraliqni tashkil qilgan", "2 ta barmoq kengligiga teng bo'lib, 4,2 - 4,5 sm oraliqni tashkil qilgan", "5 ta barmoq kengligiga teng bo'lib, 10,5 - 11 sm oraliqni tashkil qilgan", "3 ta barmoq kengligiga teng bo'lib, 6,1 - 6,5 sm oraliqni tashkil qilgan"], ["Qadimgi og'irlik birliklari tizimida 1 pud necha misqolga va necha kilogrammga teng?", "4 000 misqolga teng bo'lib, zamonaviy o'lchovda 16,38 kg ni tashkil etadi", "2 000 misqolga teng bo'lib, zamonaviy o'lchovda 12,50 kg ni tashkil etadi", "5 000 misqolga teng bo'lib, zamonaviy o'lchovda 20,45 kg ni tashkil etadi", "3 000 misqolga teng bo'lib, zamonaviy o'lchovda 14,20 kg ni tashkil etadi"], ["Qadimgi hajm o'lchov birliklari bo'yicha 1 barrel hajmi necha litrga teng qilib olingan?", "159 litr hajmga ega bo'lgan suyuqlik miqdoriga teng qilib qabul qilingan", "120 litr hajmga ega bo'lgan suyuqlik miqdoriga teng qilib qabul qilingan", "185 litr hajmga ega bo'lgan suyuqlik miqdoriga teng qilib qabul qilingan", "200 litr hajmga ega bo'lgan suyuqlik miqdoriga teng qilib qabul qilingan"], ["Ingliz qiroli Genrix I tomonidan joriy etilgan «yard» birligi qanday aniqlangan?", "Qirol burni uchidan cho'zilgan qo'l o'rtacha barmog'i uchigacha masofa bilan", "Qirol yelkasidan boshlab to'g'riga cho'zilgan bosh barmoqning uchigacha masofada", "Qirol qulochining ikki tomonga yozilgandagi umumiy uzunligining yarmi orqali", "Qirol oyog'ining tovoni qismidan bosh barmoq tirnog'i uchigacha bo'lgan oraliqda"], ["Qadimgi Vavilonda vaqt o'lchovi bo'lgan «mina» birligi qanday ma'noni anglatgan?", "Ikki astronomik soatda suv soatidan oqib chiqqan 500 gramm suv miqdorini", "Bir quyosh soati davomida qum soatidan to'kilgan maxsus mayda qum vaznini", "Yarim kecha-kunduzda o'zgarmas idishdan bug'langan toza suvning massasini", "To'liq bir kunda quyosh soati soyasining bosib o'tgan geometrik masofasini"], ["Kiyev Rusida ishlatilgan «vershok» uzunlik birligi qaysi o'lchamga muvofiq kelgan?", "Ko'rsatkich barmoqning oxirgi bo'g'ini uzunligiga to'liq teng bo'lgan o'lcham", "Bosh barmoqning birinchi bo'g'inining umumiy eniga to'liq teng bo'lgan o'lcham", "Kichik barmoqning butun bo'yi uzunligiga qat'iy tenglashtirilgan qadimiy o'lchov", "O'rta barmoqning ikkita bo'g'ini uzunligiga tenglashtirilgan qadimiy o'lchov"], ["Metrik tizimni shakllantirishda olimlar qaysi qadimiy hisoblash tizimiga tayandilar?", "Qadimgi Bobil davlatida amalda keng qo'llanilgan «o'nlik tizimi» qoidalariga", "Qadimgi Rim me'morchiligida qo'llanilgan o'n ikkilik hisoblash tizimi asosiga", "Qadimgi Misr piramidalari qurilishida qo'llangan oltmishlik hisob tamoyiliga", "Qadimgi Yunoniston olimlari kiritgan yigirmalik hisoblash mezonlari asosiga"], ["Xalqaro Metrik Konvensiyasi qachon va qayerda rasman qabul qilingan?", "1875-yil 20-mayda Parij shahrida 20 ta davlat vakillari konferensiyasida", "1889-yil 4-iyunda Peterburg shahrida 15 ta davlat vakillari kengashida", "1906-yil 12-oktabrda London shahrida 13 ta davlat vakillari yig'ilishida", "1923-yil 18-aprelda Toshkent shahrida 10 ta davlat vakillari anjumanida"], ["Metrologiya so'zining etimologik ma'nosi qaysi javobda to'g'ri ko'rsatilgan?", "Qadimgi grekcha «metro» — o'lchov va «logos» — ta'limot ma'nosini anglatadi", "Qadimgi lotincha «metrum» — hisob va «logos» — qonuniyat ma'nosini bildiradi", "Qadimgi yunoncha «metron» — qoida va «logos» — belgi ma'nosini ifodalaydi", "Qadimgi slavyancha «mera» — mezon va «logos» — tartib ma'nosini bildiradi"], ["Metrologiya fanining «Nazariy metrologiya» tarmog'i nima bilan shug'ullanadi?", "Metrologiyaning fundamental nazariy asoslarini ilmiy ishlab chiqish bilan", "O'lchash vositalarining amaliyotda to'g'ri qo'llanilishini nazorat qilishda", "Milliy korxonalarda davlat metrologik standartlarini tatbiq qilish bilan", "Xalqaro savdo shartnomalaridagi o'lchov vositalarini huquqiy tekshirishda"], ["Metrologiya sohasining «Qonunlashtiruvchi metrologiya» bo'limi vazifasi nimadan iborat?", "O'lchash vositalari, birliklari va usullariga davlat talablarini belgilashdan", "Nazariy bilimlarni ishlab chiqarish sexlariga bevosita amaliy tatbiq etishdan", "Yangi fundamental fizik doimiyliklarni matematik modellashtirib kashf etishdan", "Xalqaro ilmiy konferensiyalarda standartlar loyihasini faqat muhokama qilishdan"], ["O'zbekistonda metrologiya bo'yicha faoliyatning davlat boshqaruvini qaysi organ bajaradi?", "Texnik jihatdan tartibga solish agentligi boshqaruv vazifasini amalga oshiradi", "Davlat bojxona qo'mitasi huzuridagi maxsus sertifikatlashtirish laboratoriyasi", "Savdo-sanoat palatasi qoshidagi tovar sifatini baholash inspeksiyasi organi", "Fanlar Akademiyasining Ilmiy asbobsozlik va metrologiya ilmiy muassasasi"], ["Standartlashtirish bo'yicha xalqaro tashkilot (ISO) qaysi yillarda tashkil topgan?", "1946–1947-yillarda BMT Bosh Assambleyasi tarkibida faoliyat ko'rsata boshlagan", "1926–1927-yillarda Millatlar Ligasi qoshida rasmiy ravishda ta'sis etilgan", "1904–1906-yillarda Xalqaro elektrotexnika kongressi natijasida tuzilgan", "1970–1972-yillarda Yevropa iqtisodiy hamkorlik ittifoqi doirasida qurilgan"], ["ISO tashkilotida yangi xalqaro standart qabul qilinishi uchun ovoz berish sharti qanday?", "Kichik qo'mitalarning 2/3 qismi va umumiy ovoz beruvchilarning 3/4 qismi yoqlashi", "Barcha qo'mita a'zolarining to'liq 100% bir ovozdan yakdil ma'qullab chiqishi", "Faol a'zolarning 1/2 qismi va umumiy yig'ilgan delegatlarning 2/3 qismi ovozi", "Kengash tarkibidagi yetakchi mamlakatlar vakillarining mutlaq ko'pchilik ovozi"], ["ISO tashkilotining eng yuqori boshqaruv idorasi va uning yig'ilish davriyligi qanday?", "Bosh Assambleya hisoblanadi va uning yig'ilishi uch yilda bir marta o'tkaziladi", "Texnikaviy byuro hisoblanadi va uning yig'ilishi har yili ikki marta o'tkaziladi", "Ijroiya kengashi hisoblanadi va uning yig'ilishi besh yilda bir marta chaqiriladi", "Markaziy kotibiyat hisoblanadi va uning rasmiy majlisi har chorakda o'tkaziladi"], ["Xalqaro elektrotexnika komissiyasi (MEK) dastlab nechanchi yilda va qayerda tashkil topgan?", "1906-yili London shahrida 13 mamlakat vakillarining konferensiyasida tuzilgan", "1881-yili Parij shahrida elektr bo'yicha birinchi xalqaro kongressda tuzilgan", "1926-yili Praga shahrida 20 ta milliy tashkilotlar vakillari yig'ilishida tuzilgan", "1947-yili Jeneva shahrida xalqaro sanoat ko'rgazmasi ishtirokchilari tomonidan"], ["MEK va ISO hujjatlari qaysi yildan boshlab xalqaro standart maqomiga ega bo'ldi?", "1972-yildan boshlab ularning tavsiyalari xalqaro standartga aylantirildi", "1947-yildan boshlab ularning tavsiyalari xalqaro standartga aylantirildi", "1926-yildan boshlab ularning tavsiyalari xalqaro standartga aylantirildi", "1985-yildan boshlab ularning tavsiyalari xalqaro standartga aylantirildi"], ["O‘lchash vositasining me’yoriy ta’rifi qaysi javobda to‘liq va to‘g‘ri ifodalangan?", "Xatoligi belgilangan doirada saqlanadigan, fizik kattalik birligini e’tirof etuvchi yoki saqlovchi texnik vositadir.", "Faqatgina fizik kattaliklarni saqlash va ularni keyingi ishlov berish kanallariga uzatishga mo‘ljallangan apparatdir.", "Texnologik jarayonlarni avtomat tarzda to‘xtatish hamda tekshiruv signallarini hosil qilish uchun kerakli blokdir.", "Tajriba natijalarini matematik jihatdan hisoblab beruvchi va xatoliklarni butunlay bartaraf qiluvchi hisoblagichdir."], ["Nazorat-o‘lchash asboblarini tanlash jarayonida qaysi ko‘rsatkich inobatga olinishi shart emas?", "Asbob korpusining ishlab chiqarilgan sanasi va tashqi yuzasining bo‘yoq qatlami qalinligi.", "Asbobning o‘lchash usuli, ishlash prinsipi hamda o‘lchanadigan fizik kattaliklar diapazoni.", "Asbobning aniqlik klassi va olingan ma’lumotlarni foydalanuvchiga taqdim etish shakllari.", "Asbob sxemasining himoyalanish usuli, uning asosiy vazifasi va umumiy qo‘llanish uslubi."], ["O‘lchash vositalarining xili (tipi) tushunchasiga berilgan eng to‘g‘ri ta’rifni ko‘rsating.", "Bir xil vazifali, bitta ishlash prinsipiga ega va bitta texnik hujjat bo‘yicha tayyorlangan vositalar majmui.", "Turli vazifalarni bajaruvchi, har xil prinsipga tayanib faqat bitta konstruksiyada yasalgan o‘lchash uskunalari.", "Mavjud bo‘lgan barcha fizik kattaliklarni bir paytning o‘zida o‘lchashga qaratilgan universallashgan uskunalar.", "Faqat davlat metrologik sinovlaridan o‘tmagan hamda bir martalik nostandart tadqiqotlarda ishlatiladigan asboblar."], ["O‘lchash vositalarining turi (vidi) ta’rifi qaysi javobda to‘g‘ri keltirilgan?", "Mavjud fizik kattalikni o‘lchash uchun mo‘ljallangan o‘lchash vositalarining umumiy jamlanmasidir.", "Faqat birgina texnik chizma asosida chiqarilgan muayyan o‘lchamli o‘lchash asboblari guruhidir.", "Boshqa o‘lchash vositalariga birlik o‘lchamini uzatuvchi namunaviy asboblar majmuasining nomidir.", "O‘lchash natijalarini qayta ishlash uchun xizmat qiladigan elektron hisoblash mashinalari turidir."], ["Metrologik mohiyatiga ko‘ra o‘lchash vositalari qanday asosiy toifalarga bo‘linadi?", "Ishchi o‘lchash vositalari hamda namunaviy o‘lchash vositalari.", "Ko‘chma o‘lchash asboblari va statsionar o‘lchash qurilmalari.", "Standartlashtirilgan hamda standartlashtirilmagan vositalar.", "Avtomatlashtirilgan vositalar va noavtomatik o‘lchash tizimlari."], ["Ishchi o‘lchash vositalari (IO‘V) qanday vazifani bajarishga mo‘ljallangan?", "O‘lchov birligini boshqa asboblarga uzatish bilan bog‘liq bo‘lmagan o‘lchashlarni bajarish.", "Mamlakatda o‘lchovlar yagonaligini ta’minlash maqsadida boshqa asboblarni tekshirib turish.", "Faqat laboratoriya sharoitida o‘lchash uskunalarini kalibrlash va attestatsiyadan o‘tkazish.", "O‘lchash vositalarini davlat reyestridan chiqarish uchun maxsus sinov ishlarini olib borish."], ["Quyidagilardan qaysi biri namunaviy o‘lchash vositasiga misol bo‘la oladi?", "MO turdagi namunaviy manometr vositasi.", "TM turdagi umumtexnik manometr asbobi.", "Maishiy gaz sarfini hisoblagich qurilmasi.", "Oddiy po‘lat metall o‘lchash chizg‘ichi."], ["Avtomatik o‘lchash vositalarining asosiy xarakterli xususiyati nimadan iborat?", "O‘lchash, qayd qilish va uzatish kabi barcha operatsiyalarni to‘liq avtomatik amalga oshiradi.", "O‘lchash operatsiyasining faqatgina ma’lum bir qisminigina qisman avtomatik tarzda bajaradi.", "Natijalarni qayta ishlash uchun maxsus elektron blokga ega bo‘lmagan holda faoliyat yuritadi.", "Faqat inson qo‘li bilan boshqarilgandagina signallarni hosil qilish imkoniyatiga ega bo‘ladi."], ["Avtomatlashtirilganlik darajasiga ko‘ra noavtomatik vositalar guruhiga qaysi asboblar kiradi?", "Shaytonlar, burchak o‘lchagichlar va metall o‘lchash chizg‘ichlari.", "GIPERFLOU-3PM sarfo‘lchagichi va FloBoss 407 nazoratchi vositasi.", "Remikont R-130 markali mikroprotsessorli boshqaruvchi nazoratchi.", "Harorat hamda namlikni rostlovchi zamonaviy datchik-regulyatorlar."], ["Standartlashtirilmagan o‘lchash vositalari qanday tartibda ko‘rikdan o‘tkaziladi?", "Davlat sinovlaridan o‘tkazilmasdan, metrologik attestatsiyadan o‘tkaziladi.", "Faqat umumiy davlat sinovlaridan o‘tkazilib, attestatsiya talab etilmaydi.", "Hech qanday tekshiruvsiz to‘g‘ridan-to‘g‘ri ishlab chiqarishga yo‘naltiriladi.", "Standart talablariga mos kelmagani sababli foydalanishga ruxsat berilmaydi."], ["Konstruktiv tuzilishi bo‘yicha o‘lchash vositalari qaysi toifalarga ajratiladi?", "O‘lchov, o‘lchash o‘zgartkichi, o‘lchash asbobi, o‘lchash uskunasi va tizimi.", "Termometr, manometr, sath o‘lchagich, sarfo‘lchagich hamda defektoskoplar.", "Ko‘rsatuvchi, o‘ziyozar, hisobga oid, raqamli hamda shkalali o‘lchash asbobi.", "Ishchi vositalar, etalonlar, namunaviy asboblar va nazoratchi qurilmalar."], ["Metrologiyada 'o‘lchov' (mera) tushunchasiga qanday ta’rif berilgan?", "Berilgan o‘lchamlar kattaligini qayta tiklash yoki saqlash uchun mo‘ljallangan vosita.", "O‘lchash signalini faqat kuzatuvchi bevosita idrok etadigan shaklga keltiruvchi tizim.", "Kuzatuvchiga ko‘rinmaydigan elektr signallarini mustaqil ravishda kuchaytiruvchi asbob.", "Turli nuqtalarda joylashgan asboblarni axborot kanallari orqali bog‘lovchi vosita."], ["Quyidagi vositalardan qaysi biri o‘lchash o‘zgartkichiga yorqin misol bo‘la oladi?", "Termopara, dinamometr prujinasi, vint-gayka mikrometrik juftligi.", "Burchak o‘lchagich, po‘lat chizg‘ich, metall qalinlik o‘lchagichlari.", "Ko‘rsatkichli texnik manometr, gazoanalizator va psixrometrlar.", "Namunaviy tarozi toshlari, oxirgi uzunlik o‘lchovlari majmualari."], ["O‘lchash asbobining asosiy funksional vazifasi nimadan iborat?", "Kuzatuvchi bevosita qabul qila oladigan shakldagi ma’lumot signalini hosil qilish.", "Faqat boshqa o‘lchash asboblariga ma’lumotni kompyuter tarmoqlari orqali uzatish.", "Fizik kattalikning o‘lchamini o‘zgarmas holatda uzoq muddat mobaynida saqlab turish.", "O‘lchash jarayonida yuzaga keladigan barcha xatoliklarni matematik kompensatsiyalash."], ["Bir joyda o‘rnatilgan va funksional birlashtirilgan o‘lchash vositalari majmui nima deb ataladi?", "O‘lchash uskunasi.", "O‘lchash tizimi.", "O‘lchash o‘zgartkichi.", "Namunaviy o‘lchov."], ["Obyektning turli nuqtalarida joylashgan va aloqa kanallari bilan bog‘langan majmua nima deyiladi?", "O‘lchash tizimi.", "O‘lchash o‘zgartkichi.", "O‘lchash uskunasi.", "O‘lchash asbobi."], ["Bosim va siyraklashishni o‘lchash uchun qaysi asboblar qo‘llaniladi?", "Manometrlar, vakuummetrlar va barometrlar.", "Defektoskoplar hamda qalinlik o‘lchagichlar.", "Sath o‘lchagichlar va sarf ko‘rsatkichlari.", "Termometrlar, pirometrlar va psixrometrlar."], ["Ko‘rsatish xarakteriga ko‘ra o‘lchash asboblari qanday turlarga bo‘linadi?", "Ko‘rsatuvchi, o‘ziyozar va jamlovchi (summalovchi) asboblarga.", "Mexanik, elektr, gidravlik, pnevmatik va kimyoviy asboblarga.", "Operativ, hisobga oid, texnik va laboratoriya asboblariga.", "Mahalliy hamda ko‘rsatkichlarni masofaga uzatuvchi vositalarga."], ["Ma’lumotni tavsif etish usuliga ko‘ra o‘lchash vositalari qanday guruhlanadi?", "Shkalali, raqamli va o‘zi yozar o‘lchash vositalariga.", "Statsionar, ko‘chma hamda laboratoriya o‘lchash vositalariga.", "Standart, namunaviy, operativ va etalon o‘lchash vositalariga.", "Oddiy, ixcham, kichik gabaritli hamda miniatyur vositalarga."], ["Atrof-muhit ta’sirlaridan himoyalanganlik darajasiga ko‘ra qaysi turdagi asboblar mavjud emas?", "Mutlaq xatoliksiz ishlovchi va gravitatsiya ta’siridan xoli o‘lchash vositalari.", "Titrashga chidamli, changdan va namlik ta’siridan himoyalangan o‘lchash asboblari.", "Uchqundan hamda portlash xavfidan yuqori darajada himoyalangan o‘lchash asboblari.", "Oddiy konstruksiyali hamda korroziyabardosh gazdan himoyalangan o‘lchash asboblari."], ["\"Standart\" tushunchasiga berilgan eng to‘liq ta’rif qaysi javobda keltirilgan?", "Manfaatdor tomonlar kelishuvi asosida tasdiqlangan va ko‘p marta qo‘llaniladigan me’yoriy hujjatdir.", "Korxonaning shaxsiy faoliyat rejasini amalga oshirish uchun tayyorlangan ichki me’yoriy hujjatdir.", "Faqat davlat nazorati organlari ko‘rsatmasi bo‘yicha tuziladigan majburiy tavsiyalar to‘plamidir.", "Ishlab chiqarish texnologik xarajatlarini hisob-kitob qilish uchun tuzilgan moliyaviy hujjatdir."], ["Standartlar qaysi manbalarning umumlashtirilgan natijalariga asoslangan bo‘lishi lozim?", "Fan, ilg‘or texnika hamda amaliy tajribalarning umumlashtirilgan ilmiy-amaliy natijalariga.", "Ayrim tor doiradagi korxonalarning qisqa muddatli moliyaviy-xo‘jalik hisoboti natijalariga.", "Faqatgina xorijiy kompaniyalarning cheklangan tijorat takliflari va xususiy ma’lumotlariga.", "Davlat rejalashtirish qo‘mitasining yillik rejalashtirilgan istiqbolli statistik xulosalariga."], ["Manbada keltirilgan tasnifga muvofiq standartlar darajasiga ko‘ra qanday guruhlarga bo‘linadi?", "Xalqaro, mintaqaviy davlatlararo, milliy hamda xorijiy davlatlar milliy standartlariga.", "Hududiy, tumanlararo tarmoqli, korxonaviy hamda davlatlararo xususiy standartlariga.", "Davlatlararo ilmiy, umumtarmoq texnikaviy, xususiy korxonaviy va xalqaro standartlarga.", "Universal umumiqtisodiy, maxsus ishlab chiqarish, regional va xorijiy standartlarga."], ["Matnda \"standartlashtirish\" atamasiga berilgan rasmiy ta’rifning mazmuni nimadan iborat?", "Mavjud yoki potensial vazifalarga nisbatan optimal tartibga solishga qaratilgan faoliyatdir.", "Mahsulot tannarxini pasaytirish va bozor bahosini erkin nazorat qilishga qaratilgan tizimdir.", "Korxonalardagi texnologik uskunalarni yangilashga qaratilgan amaliy chora-tadbirlar rejasidir.", "Yangi tovarlarning tashqi ko‘rinishini baholash va tekshirish uchun o‘tkaziladigan jarayondir."], ["Xalqaro standartlashtirish faoliyatining o‘ziga xos xususiyati qaysi javobda to‘g‘ri bayon etilgan?", "Faoliyatda barcha mamlakatlarning tegishli idoralari erkin tarzda ishtirok etishi mumkin.", "Faoliyatda faqat Birlashgan Millatlar Tashkilotiga a’zo rivojlangan davlatlar qatnashadi.", "Faoliyat doirasida qatnashish faqat sanoati yuqori texnologiyali mamlakatlarga beriladi.", "Faoliyat tizimiga faqatgina cheklangan iqtisodiy blok vakillarigina jalb etilishi mumkin."], ["Mintaqaviy standartlashtirish tushunchasi o‘z mazmuniga ko‘ra qanday tavsiflanadi?", "Dunyodagi birgina jo‘g‘rofiy yoki iqtisodiy mintaqa mamlakatlari idoralari ishtirokidagi faoliyat.", "Dunyoning barcha qit’alaridagi yetakchi ilmiy institutlar ishtirokida olib boriladigan jarayon.", "Faqatgina bitta mamlakatning ichki sanoat tarmoqlari o‘rtasida o‘tkaziladigan standartlashtirish.", "Cheklangan korxonalar konsorsiumi doirasida tasdiqlanadigan vaqtinchalik texnik qoidalar tizimi."], ["Muayyan bir mamlakat doirasidagina o‘tkaziladigan standartlashtirish qanday ataladi?", "Milliy standartlashtirish deb ataladi.", "Mintaqaviy standartlashtirish sanaladi.", "Tarmoqlararo standartlashtirish deyiladi.", "Xalqaro miqyosli standartlashtirishdir."], ["Davlat standartlari mahsulotni ishlab chiqish va ishlab chiqarishga qo‘yishda nimalarga xizmat qiladi?", "Mahsulotlarning yuqori sifatli turlarini yaratish va iste’molchi bilan munosabatlarni yaxshilashga.", "Mahsulot tannarxini sun’iy kamaytirish va korxonalararo raqobat muhitini to‘liq to‘xtatib turishga.", "Faqat chet eldan keltiriladigan xomashyolarni qabul qilish shartlarini qat’iy me’yorlashtirishga.", "Korxonada faoliyat yuritayotgan ishchi-xizmatchilarning umumiy sonini qisqartirib optimallashga."], ["Standartlashtirish tizimi yangi mahsulotni ishlab chiqarish jarayonida qanday funksiyani bajaradi?", "Yangi buyumga sifatli loyiha-konstruktorlik hujjatlar berish va mahsulot tayyorlanishini belgilash.", "Yangi mahsulot tannarxini hisoblash hamda xodimlarga oylik maosh to‘lash shartlarini muvofiqlashtirish.", "Ishlab chiqarilgan mahsulotlarni xorijiy bozorlarga sotish uchun bojxona to‘lovlarini qayta belgilash.", "Ishchilarning texnika xavfsizligi qoidalariga rioya etishini tekshirish hamda intizomni nazorat qilish."], ["Mahsulot muomalada bo‘lganida va sotish bosqichlarida standartlashtirish qanday talablarni belgilaydi?", "Mahsulotni joylashtirish, saqlash, tashish va sotish tashkilotlariga nisbatan me’yoriy talablarni.", "Mahsulotning chakana narxini oshirish hamda xususiy savdo tarmoqlarida keng realizatsiya qilishni.", "M
