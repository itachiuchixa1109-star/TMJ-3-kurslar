iruvchi kuch sifatida quvurning ikki chetidagi gidrostatik bosimlar farqi to‘liq xizmat qiladi.", "Harakatlantiruvchi kuch sifatida kanal devorlaridagi suyuqlik ishqalanish kuchlarining yig‘indisi olinadi.", "Harakatlantiruvchi kuch sifatida oqim sirtidagi atmosfera havosining dinamik qarshilik kuchi xizmat qiladi."], ["Ochiq kanaldagi oqim qanday shart bajarilganda statsionar oqim deb hisoblanadi?", "Vaqt o‘tishi bilan kanalning ma’lum kesimida chuqurlik, tezlik va sarf mutlaqo o‘zgarmasdan saqlanib qolsa.", "Kanalning butun uzunligi bo‘ylab oqim tezligi, chuqurligi va gidravlik qiyaligi doimiy qiymatga ega bo‘lsa.", "Oqimning erkin sirt sathi atmosfera bosimining o‘zgarishiga mutanosib ravishda keskin kamayib borsa.", "Kanal tubining g‘adir-budirlik koeffitsiyenti barcha qismlarda bir xil geometrik o‘lchamlarga ega bo‘lsa."], ["Oqim ko‘ndalang kesimining gidravlik radiusi R qaysi formula orqali hisoblanadi?", "𝑅 = 𝐴 / 𝑃 nisbati orqali, bu yerda A — oqim yuzasi, P — suyuqlik bilan ho‘llangan perimetr.", "𝑅 = 𝑃 / 𝐴 nisbati orqali, bu yerda P — ho‘llangan perimetr, A — erkin sirt kengligi hisobi.", "𝑅 = 𝐴 / 𝑇 nisbati orqali, bu yerda A — oqim yuzasi, T — kanal tubining umumiy kenglik o‘lchovi.", "𝑅 = 𝑇 / 𝑃 nisbati orqali, bu yerda T — erkin sirt kengligi, P — oqimning ho‘llangan perimetri."], ["Ochiq kanallarda gidravlik chuqurlik D_h qanday formula yordamida aniqlanadi?", "𝐷_ℎ = 𝐴 / 𝑇 ko‘rinishida aniqlanadi, bu yerda A — oqim yuzasi va T — erkin sirt kengligi.", "𝐷_ℎ = 𝐴 / 𝑃 ko‘rinishida aniqlanadi, bu yerda A — oqim yuzasi va P — ho‘llangan perimetr.", "𝐷_ℎ = 𝑃 / 𝑇 ko‘rinishida aniqlanadi, bu yerda P — ho‘llangan perimetr va T — sirt kengligi.", "𝐷_ℎ = 𝑏 / 𝑦 ko‘rinishida aniqlanadi, bu yerda b — tub kengligi va y — oqim chuqurligi sathi."], ["Uzluksizlik qonuniga binoan oqim sarfi o‘zgarmagan holda oqim kesim yuzasi kichraytirilsa nima ro‘y beradi?", "Oqimning o‘rtacha tezligi mutanosib ravishda ortadi, chunki sarf va yuza teskari bog‘liq.", "Oqimning o‘rtacha tezligi mutanosib ravishda kamayadi, chunki sarf va yuza to‘g‘ri bog‘liq.", "Oqimning harakatlantiruvchi gidravlik radiusi ortadi, ammo tezlik doimiy bo‘lib qoladi.", "Oqimning erkin sirtidagi atmosfera bosimi oshadi, ammo sarf qiymati keskin o‘zgaradi."], ["Ochiq kanal uchun Bernulli tenglamasida bosim energiyasi ko‘pincha qaysi parametr orqali ifodalanadi?", "Kanal kesimidagi suv chuqurligi y orqali ifodalanadi, chunki erkin sirt atmosferaga ochiqdir.", "Kanal tubining umumiy nishabligi i orqali ifodalanadi, chunki u harakat kuchini ta’minlaydi.", "Erkin tushish tezlanishi g orqali ifodalanadi, chunki u og‘irlik maydoni ta’sirini belgilaydi.", "Kinetik energiya koeffitsiyenti α orqali ifodalanadi, chunki u tezlik taqsimotini tuzatadi."], ["Solishtirma energiya egri chizig‘ida minimum energiyaga mos keluvchi chuqurlik qanday nomlanadi?", "Kritik chuqurlik deb ataladi va u minimum solishtirma energiya holatiga to‘g‘ri keladi.", "Normal chuqurlik deb ataladi va u bir tekis sokin oqim holatiga to‘liq to‘g‘ri keladi.", "To‘yingan chuqurlik deb ataladi va u maksimal gidravlik radius holatiga to‘g‘ri keladi.", "Gidravlik sakrash chuqurligi deb ataladi va u energiyaning to‘liq so‘nishini bildiradi."], ["Froude soni (Fr) ochiq kanaldagi qaysi kuchlarning o‘zaro nisbatini ifodalovchi parametr hisoblanadi?", "Oqimdagi inertsiya kuchlarining og‘irlik kuchlariga bo‘lgan nisbatini aniq ifodalaydi.", "Oqimdagi bosim kuchlarining yopishqoq ishqalanish kuchlariga bo‘lgan nisbatini beradi.", "Oqimdagi sirt taranglik kuchlarining gravitatsiya kuchlariga bo‘lgan nisbatini ko‘rsatadi.", "Oqimdagi turbulent ishqalanish kuchlarining inertsiya kuchlariga bo‘lgan nisbatini topadi."], ["Fr > 1 bo‘lganda superkritik (tez) oqim rejimida sirt to‘lqinlarining tarqalishi qanday kechadi?", "Inertsiya kuchi ustun bo‘lganligi sababli yuzadagi buzilishlar faqat oqim bo‘ylab pastga tarqaladi.", "Og‘irlik kuchi ustun bo‘lganligi sababli yuzadagi to‘lqinlar oqimga qarshi yuqoriga qarab tarqaladi.", "Yopishqoqlik kuchi ustun bo‘lganligi sababli yuzadagi buzilishlar har ikki tomonga teng tarqaladi.", "Sirt taranglik kuchi ustun bo‘lganligi sababli yuzadagi to‘lqinlar butunlay harakatsiz to‘xtab qoladi."], ["Superkritik oqim rejimidan subkritik oqim rejimiga keskin o‘tish jarayonida qanday hodisa sodir bo‘ladi?", "Gidravlik sakrash sodir bo‘lib, suv chuqurligi keskin ortadi va energiya turbulentlikka sarflanadi.", "Laminar sokinlashuv yuz berib, oqim chuqurligi keskin pasayadi va o‘rtacha tezlik ortib ketadi.", "Kavitatsiya hodisasi paydo bo‘lib, kanal tubida gidravlik bosim atmosfera bosimidan oshib ketadi.", "To‘liq erkin to‘lqinlanish boshlanib, solishtirma energiya miqdori o‘zining maksimumiga yetadi."], ["Bir tekis oqimda o‘rtacha tezlikni hisoblash uchun Shezi formulasi qaysi ko‘rinishda ifodalanadi?", "𝑣 = 𝐶 √(𝑅 𝑖) ko‘rinishida, bu yerda C — Shezi koeffitsiyenti, R — gidravlik radius, i — nishablik.", "𝑣 = 𝐶 √(𝐴 / 𝑖) ko‘rinishida, bu yerda C — Shezi koeffitsiyenti, A — oqim yuzasi, i — qiyalik.", "𝑣 = 𝑛 √(𝑅 / 𝑖) ko‘rinishida, bu yerda n — g‘adir-budirlik, R — gidravlik radius, i — nishablik.", "𝑣 = 𝐶 (𝑅 𝑖)² ko‘rinishida, bu yerda C — Shezi koeffitsiyenti, R — gidravlik chuqurlik sathi."], ["Manning formulasi yordamida ochiq kanaldagi o‘rtacha tezlik v qanday formula bilan hisoblanadi?", "𝑣 = (1/𝑛) 𝑅^(2/3) 𝑖^(1/2) ko‘rinishida, bu yerda n — kanal tubining g‘adir-budirlik koeffitsiyenti.", "𝑣 = (1/𝑛) 𝑅^(1/2) 𝑖^(2/3) ko‘rinishida, bu yerda n — kanal tubining g‘adir-budirlik koeffitsiyenti.", "𝑣 = 𝑛 𝑅^(2/3) 𝑖^(1/2) ko‘rinishida, bu yerda n — kanal tubining g‘adir-budirlik koeffitsiyenti.", "𝑣 = (1/𝑛) 𝑅^(1/3) 𝑖^(1/3) ko‘rinishida, bu yerda n — kanal tubining g‘adir-budirlik koeffitsiyenti."], ["Kanal materiali silliq betondan tabiiy notekis o‘zanga o‘zgarganda Manning koeffitsiyenti n qanday o‘zgaradi?", "G‘adir-budirlik koeffitsiyenti n kattalashadi va buning oqibatida oqimning o‘rtacha tezligi kamayadi.", "G‘adir-budirlik koeffitsiyenti n kichrayadi va buning oqibatida oqimning o‘rtacha tezligi oshib ketadi.", "G‘adir-budirlik koeffitsiyenti n o‘zgarmaydi, faqat oqimning gidravlik radiusi mutanosib ravishda ortadi.", "G‘adir-budirlik koeffitsiyenti n nolga intiladi, chunki ishqalanish yo‘qotishlari mutlaqo to‘xtaydi."], ["To‘g‘ri to‘rtburchak kanal kengligi b = 1,20 m va chuqurligi y = 0,50 m bo‘lganda oqim yuzasi A qanchaga teng?", "0,60 m² ga teng bo‘ladi, chunki tirik kesim yuzasi eni va chuqurlik ko‘paytmasiga (b · y) teng.", "1,70 m² ga teng bo‘ladi, chunki tirik kesim yuzasi eni va chuqurlik yig‘indisiga (b + y) teng.", "2,40 m² ga teng bo‘ladi, chunki tirik kesim yuzasi kenglikning chuqurlikka nisbatiga (b / y) teng.", "0,30 m² ga teng bo‘ladi, chunki tirik kesim yuzasi yarim perimetr va chuqurlik ko‘paytmasiga teng."], ["To‘g‘ri to‘rtburchak kanal kengligi b = 1,20 m va chuqurligi y = 0,50 m bo‘lsa, ho‘llangan perimetr P qancha bo‘ladi?", "2,20 m ga teng bo‘ladi, chunki ho‘llangan perimetr tub kengligi va ikki chuqurlik yig‘indisidir.", "1,70 m ga teng bo‘ladi, chunki ho‘llangan perimetr faqat bitta tub va bitta devor balandligidir.", "2,40 m ga teng bo‘ladi, chunki ho‘llangan perimetr barcha to‘rtta tomon uzunliklari yig‘indisidir.", "3,40 m ga teng bo‘ladi, chunki ho‘llangan perimetr ikki tub va ikki devor yig‘indisidan iboratdir."], ["Matndagi hisoblash namunasida Froude soni Fr ≈ 0,63 chiqishi oqim haqida qanday xulosa beradi?", "Oqim subkritik (sokin) rejimda bo‘lib, chuqurlik nisbatan katta, tezlik esa kritikdan kichik bo‘ladi.", "Oqim superkritik (tez) rejimda bo‘lib, chuqurlik juda kichik, tezlik esa kritikdan ancha yuqori bo‘ladi.", "Oqim kritik chegaraviy holatda bo‘lib, solishtirma energiya o‘zining eng minimal nuqtasiga yetadi.", "Oqim turbulent bo‘lmagan to‘liq to‘xtagan rejimda bo‘lib, gidravlik nishablik mutlaqo nolga tenglashadi."], ["Temir yo‘l xo‘jaligida suv qochirish kanallari noto‘g‘ri loyihalansa qanday jiddiy texnologik xavf yuzaga keladi?", "Suv yo‘l poyini yuvishi, ballast qatlamini haddan tashqari namlashi va inshootlarni yemirishi mumkin.", "Temir yo‘l izlarining nishabligi o‘zgarib, poyezdlar harakatida tortish kuchi keskin ravishda ortadi.", "Atmosfera bosimi pasayib, temir yo‘l stansiyalaridagi texnologik suvlarning sarfi keskin kamayadi.", "Ballast qatlami qurib ketishi oqibatida relslar orasidagi mexanik ishqalanish kuchi butunlay yo‘qoladi."], ["Kanal tubiga nisbatan hisoblangan oqim energiyasi gidravlikada qanday nom bilan yuritiladi?", "Solishtirma energiya deb ataladi va u chuqurlik hamda tezlik balandligi yig‘indisidan iboratdir.", "Potensial energiya deb ataladi va u faqat solishtirish tekisligining balandligi bilan belgilanadi.", "Gidrostatik energiya deb ataladi va u faqat atmosfera havosi bosimining ta’siri orqali aniqlanadi.", "Turbulent energiya deb ataladi va u faqat devorlarning g‘adir-budirlik koeffitsiyentiga bog‘liqdir."]]}];
const $=id=>document.getElementById(id);
let cur=0;
function drawSubs(){const b=$('subs');b.innerHTML='';SUBJ.forEach((s,k)=>{const x=document.createElement('button');x.className='opt sub'+(k===cur?' sel':'');
  const a=document.createElement('span');a.textContent=s.name;const c=document.createElement('small');c.textContent=s.q.length+' ta savol';x.append(a,c);
  x.onclick=()=>{cur=k;drawSubs()};b.appendChild(x)});
  $('avail').textContent='(mavjud: '+SUBJ[cur].q.length+')'}
drawSubs();
let list=[],i=0,score=0,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['start','quiz','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(items){list=items.map(r=>({q:r[0],c:r[1],o:shuffle(r.slice(1))}));i=0;score=0;wrong=[];show('quiz');render()}
function render(){
  const it=list[i];locked=false;
  $('pos').textContent='Savol '+(i+1)+' / '+list.length;
  $('sc').textContent='To’g’ri: '+score;
  $('pb').style.width=(i/list.length*100)+'%';
  $('qt').textContent=it.q;
  const box=$('opts');box.innerHTML='';
  it.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
  $('next').classList.add('hidden');
}
function pick(btn,t){
  if(locked)return;locked=true;const it=list[i];
  const ok=t===it.c;
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===it.c)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push({q:it.q,mine:t,c:it.c,raw:[it.q,...it.o.filter(x=>x!==it.c).concat([])]})}
  $('sc').textContent='To’g’ri: '+score;
  $('next').textContent=i===list.length-1?'Natijani ko’rish':'Keyingi savol';
  $('next').classList.remove('hidden');$('next').focus();
}
function finish(){
  show('end');$('fin').textContent=score+' / '+list.length;
  $('pct').textContent=Math.round(score/list.length*100)+'% to’g’ri javob';
  $('retry').classList.toggle('hidden',!wrong.length);
  const r=$('rev');r.innerHTML=wrong.length?'<h3>Xato javoblar</h3>':'<p>Barcha javoblar to’g’ri. Ajoyib!</p>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';
    const q=document.createElement('b');q.textContent=w.q;
    const a=document.createElement('div');a.className='a';a.style.background='var(--bad-bg)';a.style.color='var(--bad-text)';a.textContent='Sizning javobingiz: '+w.mine;
    const c=document.createElement('div');c.className='a';c.style.background='var(--ok-bg)';c.style.color='var(--ok-text)';c.textContent='To’g’ri javob: '+w.c;
    d.append(q,a,c);r.appendChild(d)});
}
$('next').onclick=()=>{if(i<list.length-1){i++;render()}else{$('pb').style.width='100%';finish()}};
$('go').onclick=()=>{let n=parseInt($('cnt').value)||25;const D=SUBJ[cur].q;n=Math.max(1,Math.min(D.length,n));begin(shuffle(D).slice(0,n))};
$('again').onclick=()=>show('start');
$('retry').onclick=()=>{const ids=new Set(wrong.map(w=>w.q));begin(shuffle(SUBJ[cur].q.filter(r=>ids.has(r[0]))))};
</script></body></html>
