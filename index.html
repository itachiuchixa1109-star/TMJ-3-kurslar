html,body{margin:0}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}

<script>
const SUBJ=[{"name": "Falsafa", "q": [["«Falsafa» atamasining yunoncha etimologik ma'nosi to'g'ri ifodalangan javobni aniqlang.", "Donolikka intilish hamda cheksiz muhabbat qo'yish", "Borliq qonunlarini mutlaq va o'zgarmas deb tushunish", "Tabiat hodisalarini faqat tajriba orqali o'rganish", "Insoniyat tafakkurini diniy e'tiqod bilan boyitish"], ["«Falsafa» so'zini fanga birinchi bo'lib kiritgan qadimgi yunon mutafakkiri kim?", "Pifagor", "Demokrit", "Epikur", "Geraklit"], ["Qaysi qadimgi mutafakkir falsafani «ezgulik va yovuzlikni bilish vositasi» deb ta'riflagan?", "Suqrot", "Arastu", "Platon", "Seneka"], ["Arastu falsafa faniga qanday ta'rif bergan?", "Narsalarning sababi va prinsiplarini tadqiq qilish fani", "Inson ruhiyatining sirli va noaniq qirralarini bilish fani", "Tabiat qonunlarini tajribalar vositasida tushunish fani", "Ezgulik va adolat mezonlarini amalda qo'llash haqidagi fan"], ["Epikurning falsafiy qarashlariga ko'ra falsafaning asosiy vazifasi nimadan iborat?", "Baxt-saodatga aql vositasida erishish", "Tabiat sirlarini tajribada sinab ko'rish", "Jamiyat qonunlarini qat'iy tartibga solish", "Moddiy boyliklarni to'plashga yo'l ochish"], ["Falsafani «foydali narsalarni bilish jarayoni» deb ta'riflagan faylasuf kim?", "J. Dyui", "F. Bekon", "T. Gobbs", "G. Gegel"], ["Mavjudlik va borliq haqidagi ta'limot falsafada qanday nomlanadi?", "Ontologiya", "Gnoseologiya", "Aksiologiya", "Antropologiya"], ["Bilish jarayoni, uning imkoniyatlari va chegaralarini o'rganuvchi sohani toping.", "Gnoseologiya", "Ontologiya", "Aksiologiya", "Sotsiologiya"], ["Falsafiy bilimlarning qaysi sohasi qadriyatlar mohiyatini tadqiq etadi?", "Aktsiologiya", "Gnoseologiya", "Ontologiya", "Metodologiya"], ["Nafosatshunoslik, ya'ni go'zallik qonuniyatlarini o'rganadigan falsafiy ta'limot qaysi?", "Estetika", "Mantiq", "Etika", "Fizika"], ["Insonning bilishni amalga oshirish shakllari va qonuniyatlarini qaysi fan o'rganadi?", "Mantiq", "Etika", "Tarix", "Huquq"], ["Quyidagilardan qaysi biri dunyoqarashning asosiy funktsiyalaridan biri hisoblanadi?", "Bilish funktsiyasi", "Ishlab chiqarish", "Iqtisodiy nazorat", "Moddiy ta'minot"], ["Insoniyat tarixida vujudga kelgan dunyoqarashning uch asosiy tarixiy shakli qaysi?", "Mifologiya, din, falsafa", "San'at, madaniyat, maorif", "Fan, texnika, sotsiologiya", "Axloq, huquq, iqtisodiyot"], ["Mifologik dunyoqarashga xos bo'lgan yetakchi xususiyat to'g'ri ko'rsatilgan javobni toping.", "Dunyo va tabiat hodisalarini fantastik obrazlar bilan izohlash", "Voqelikni qat'iy ilmiy tajribalar va mantiq asosida isbotlash", "Olamni faqat mavhum falsafiy tushunchalar yordamida ifodalash", "Jamiyat taraqqiyotini iqtisodiy munosabatlar bilan bog'lash"], ["Lotincha «religare» so'zining dastlabki lug'aviy ma'nosi qanday ifodalanadi?", "Birikish, bog'lanish va ittifoq", "Tafakkur qilish va aql yuritish", "Mustaqil izlanish va tadqiqot", "Tajriba o'tkazish va xulosalash"], ["Falsafiy dunyoqarashning boshqa dunyoqarash shakllaridan asosiy ustunligi nimada?", "Ratsionalligi, tizimliligi va nazariy shaklga egaligi", "Voqelikni his-tuyg'ular vositasida qabul qila olishi", "G'ayritabiiy kuchlarga to'liq ishonch hosil qilishi", "An'anaviy rivoyatlar asosida xulosalar chiqarishi"], ["Falsafa ta'limining inson tafakkurini rivojlantirishdagi eng asosiy vazifasi nima?", "Mustaqil fikrlash va haqiqatning tub mohiyatiga yetishga o'rgatish", "Tayyor ma'lumotlarni yodlab olish va ularni aynan takrorlashga undash", "Barcha qarashlarni shubhasiz qabul qilish qobiliyatini shakllantirish", "Faqat o'tmish allomalari fikrlariga tayanib faoliyat yuritishni o'rgatish"], ["Matnga ko'ra zamonaviy davrda falsafaning dolzarb tadqiqot mavzusi nima hisoblanadi?", "Globallashuv jarayonining mohiyati", "Texnologik taraqqiyotning tezlashuvi", "An'anaviy qadriyatlarning yo'qolishi", "Ijtimoiy tabaqalanishning kuchayishi"], ["Falsafiy tarbiyaning barcha tarbiya turlari tizimidagi asosiy o'rni nimada aks etadi?", "Barcha tarbiya turlarining metodologik asosi hisoblanishida", "Shaxsning kasbiy ko'nikmalarini amaliyotda shakllantirishida", "Faqat yoshlarning estetik didini yuksaltirishga xizmat qilishida", "Jamiyatdagi siyosiy qarashlarni qat'iy nazorat ostiga olishida"], ["Insonning «bioijtimoiy mavjudot» sifatidagi yaxlit mohiyati matnda qanday izohlanadi?", "Tana va ruh, jism va jon, moddiylik va ma'naviylikning uzviy birligi", "Faqat biologik ehtiyojlar va tabiiy instinktlarning yig'indisi", "Ijtimoiy muhit tomonidan to'liq shakllantiriladigan ong shakli", "Moddiy olamdan mutlaqo ajralgan sof ma'naviy borliq ko'rinishi"], ["Ontologiya tushunchasining etimologik va falsafiy ma'nosi qaysi javobda to'g'ri ko'rsatilgan?", "Borliq haqidagi ta'limot bo'lib, voqelikning tub negizlarini tadqiq etadi", "Bilish jarayoni haqidagi ta'limot bo'lib, sub'ekt va ob'ektni o'rganadi", "Qadriyatlar tizimi haqidagi ta'limot bo'lib, ma'naviy mezonlarni qamraydi", "Jamiyat taraqqiyoti haqidagi ta'limot bo'lib, ijtimoiy qonunlarni ochadi"], ["O'z mavjudligi uchun o'zidan boshqa hech narsaga ehtiyoj sezmaydigan mustaqil borliq nima deb ataladi?", "Substantsiya tushunchasi orqali ifodalanadi", "Abstraksiya tushunchasi orqali ifodalanadi", "Atributsiya tushunchasi orqali ifodalanadi", "Konsepsiya tushunchasi orqali ifodalanadi"], ["\"Ontologiya\" atamasini 1513-yilda o'zining \"Falsafa lug'ati\" asarida ilk bor qo'llagan mutafakkir kim?", "Nemis faylasufi R.Goklenius", "Nemis mutafakkiri X.Volf", "Qadimgi yunon olimi Arastu", "Sharq mutafakkiri Farobiy"], ["Eley falsafiy maktabi namoyandalari ontologiyani qanday talqin qilganlar?", "Mangu o'zgarmas, yagona sof borliq haqidagi ta'limot sifatida", "Doimiy harakatda bo'lgan o'zgaruvchan moddiy asos sifatida", "Inson tafakkuri yaratgan mavhum mantiqiy tushuncha sifatida", "Ilohiy qudrat tomonidan yaratilgan ko'p shaklli olam sifatida"], ["Sharq falsafasida ontologiya asosan qaysi ta'limotlar ko'rinishida o'rganilgan?", "\"Vahdati mavjud\" va \"Vahdati vujud\" ta'limotlari tizimida", "\"Atomizm\" va \"Elementar zarralar\" g'oyalari doirasida", "\"Ratsionalizm\" va \"Sensualizm\" qarashlari doirasida", "\"Apriorizm\" va \"Agnostitsizm\" tamoyillari asosida"], ["Abu Nasr Farobiy yagona borliq tizimini necha bosqichdan iborat deb hisoblagan?", "Olti bosqichdan iborat yaxlit tizim deb hisoblagan", "To'rt bosqichdan iborat tabiiy tizim deb hisoblagan", "Sakkiz bosqichdan iborat ilohiy tizim deb bilgan", "Uch bosqichdan iborat moddiy tizim deb qaragan"], ["Abu Nasr Farobiy ontologiyasiga ko'ra, mavjudlikning birinchi sababi (sababi avval) nima?", "Xudo borlig'i barcha mavjudlikning ilk sababidir", "Samoviy jismlar barcha mavjudlikning ilk sababidir", "Faol aql hodisasi barcha mavjudlikning ilk sababidir", "Moddiy substantsiya barcha borliqning ilk sababidir"], ["Abu Nasr Farobiy borliq bosqichlarida to'rtinchi o'ringa qaysi omilni qo'yadi?", "Jon (an-nafs) tushunchasini to'rtinchi o'ringa qo'yadi", "Shakl (as-surat) tushunchasini to'rtinchi o'ringa qo'yadi", "Modda (al-modda) asosini to'rtinchi o'ringa qo'yadi", "Faol aql (al-aql) quvvatini to'rtinchi o'ringa qo'yadi"], ["Farobiy ontologik tasnifiga binoan, beshinchi va oltinchi sabablar qaysi javobda to'g'ri ko'rsatilgan?", "Beshinchi sabab – shakl, oltinchi sabab – moddadir", "Beshinchi sabab – aql, oltinchi sabab – osmondir", "Beshinchi sabab – jon, oltinchi sabab – harakatdir", "Beshinchi sabab – fazo, oltinchi sabab – zamondir"], ["Materiya tushunchasining falsafiy mohiyati qaysi ta'rifda to'g'ri aks ettirilgan?", "Barcha moddiy ob'ektlarni qamragan ob'ektiv reallikdir", "Inson tafakkurining hissiy idrokka asoslangan xomxayolidir", "Faqatgina jonsiz tabiat jismlarini ifodalovchi tushunchadir", "Faqat tajribada bevosita seziladigan buyumlar yig'indisidir"], ["Zamonaviy ilmiy tasavvurlarga binoan, Yer sayyorasi taxminan qachon shakllangan?", "Taxminan 4,5 milliard yil muqaddam gaz-changdan hosil bo'lgan", "Taxminan 1,5 milliard yil muqaddam qattiq jinslardan yaralgan", "Taxminan 10 milliard yil muqaddam quyosh parchalaridan chiqqan", "Taxminan 2,5 milliard yil muqaddam yulduzlar to'qnashuvidan o'sgan"], ["Matnga binoan, Yer sayyorasi paydo bo'lgach, uning geologik tarixi qancha vaqtdan so'ng boshlangan?", "Oradan yana bir milliard yilcha vaqt o'tgandan keyin", "Oradan yana uch milliard yilcha vaqt o'tgandan keyin", "Oradan besh yuz million yilcha vaqt o'tgandan keyin", "Yer sayyorasi paydo bo'lgan zahoti darhol boshlangan"], ["Masofa, massa, hajm va zichlik kabi belgilarga ega bo'lgan ob'ektlar qaysi borliq shakliga kiradi?", "Moddiy borliq shakliga kiruvchi jismlar sanaladi", "Ideal borliq shakliga kiruvchi g'oyalar sanaladi", "Ijtimoiy borliq shakliga kiruvchi munosabatlardir", "Sub'ektiv borliq shakliga xos ruhiy holatlardir"], ["Noumenal borliq tushunchasi matnda qanday izohlangan?", "Kuzatuvchi anglashidan qat'i nazar o'z-o'zicha real mavjud borliq", "Inson hissiy tajribasi orqali bevosita idrok etiladigan hodisa", "Faqat biluvchi sub'ekt ongida vujudga keluvchi zohiriy holat", "Jamiyatdagi ijtimoiy munosabatlar jarayonida namoyon bo'ladigan voqelik"], ["Fenomenal borliq tushunchasining asosiy xususiyati nimadan iborat?", "Tajribada berilgan, sub'ekt qanday ko'rishiga bog'liq zohiriy borliq", "Tashqi sub'ekt idrokidan mutlaqo xoli, o'z-o'zicha mustaqil voqelik", "Hech qanday o'zgarishga uchramaydigan mangu turg'un substantsiya", "Faqatgina mavhum tushunchalar doirasida yashaydigan ideal mohiyat"], ["Tirik tabiat borlig'ining birinchi darajasiga quyidagilarning qaysilari kiritilgan?", "Mikroelementlar, zarralar, atomlar, elektronlar, protonlar", "Ruhsiz jismlar, o'simliklar, hayvonlar va butun biosfera", "Inson ongi, ijtimoiy tizimlar va madaniy qadriyatlar", "Galaktikalar, yulduzlar turkumi va sayyoralar harakati"], ["Matnga muvofiq, makonning asosiy xossalari to'g'ri ko'rsatilgan qatorni aniqlang.", "Ko'lamlilik, bir jinslilik hamda ko'p o'lchovlilik", "Davomlilik, bir yo'nalishlilik hamda bir jinslilik", "Orqaga qaytmaslik, dinamiklik hamda ko'lamlilik", "Cheksizlik, izotroplik hamda faqat bir o'lchovlilik"], ["Matnga muvofiq, vaqt kategoriyasining muhim xossalari qaysi javobda bayon etilgan?", "Davomlilik, orqaga qaytmaslik va izotroplik xosdir", "Uch o'lchovlilik, ko'lamlilik va turg'unlik xosdir", "Muvozanatlilik, bir xillilik va fazoviy hajm xosdir", "Mangu turg'unlik, o'zgarmaslik va qat'iylik xosdir"], ["Vaqtga substansional yondashuvning asosiy mazmuni nimadan iborat?", "Vaqtni alohida, azaliy va mustaqil substansiya deb hisoblash", "Vaqtni faqat moddiy jarayonlarning nisbiy o'lchovi deb qarash", "Vaqtni hodisalarning ruhiy idrokdagi shartli belgisi deb bilish", "Vaqtni faqat inson ongidagi o'tmish xotirasi sifatida tushunish"], ["Vaqtning statik konsepsiyasiga ko'ra inson va zamon munosabati qanday tushuntiriladi?", "Barcha lahzalar mavjud, biz unda o'tmish yoki kelajakka siljiymiz", "Hodisalar faqatgina uzluksiz dinamik harakat oqimida yaratiladi", "Faqat hozirgi zamon mavjud bo'lib, o'tmish va kelajak butkul yo'qdir", "Vaqt sub'ektning ichki kechinmalariga qarab kengayadi yoki torayadi"], ["«Gnoseologiya» atamasining etimologik kelib chiqishi va uning lug‘aviy ma’nosi qaysi javobda to‘g‘ri ifodalangan?", "Yunoncha «gnosis» – bilim hamda «logos» – ta’limot so‘zlaridan olingan bo‘lib, bilish haqidagi ta’limotni anglatadi.", "Lotincha «gnosis» – mohiyat hamda «logos» – tafakkur so‘zlaridan olingan bo‘lib, mantiqiy tafakkur ta’limotini anglatadi.", "Yunoncha «gnosis» – ong hamda «logos» – tajriba so‘zlaridan olingan bo‘lib, insoniy amaliyot haqidagi fanni anglatadi.", "Lotincha «gnosis» – aql hamda «logos» – qonuniyat so‘zlaridan olingan bo‘lib, ilmiy bilimlarni asoslash fani hisoblanadi."], ["Gnoseologiya yoki bilish nazariyasi falsafa fani bo‘limi sifatida quyidagi qaysi yo‘nalishni o‘rganmaydi?", "Tabiatdagi moddiy jismlarning fazoviy o‘zgarishlarini mexanika qonuniyatlari asosida o‘lchashni.", "Inson tafakkurining bilmaslik holatidan chuqurroq ilmiy bilimlar sari yuksalib borish jarayonini.", "Insonning butun borliqni va tevarak-atrofdagi moddiy olamni bilish imkoniyatlari chegaralarini.", "Bilimlar tabiati va ularning mazkur bilimlarda aks etuvchi obyektiv narsalar bilan o‘zaro nisbatini."], ["Gnoseologiyaning asosiy predmeti hisoblangan ongning moddiy olam hodisalaridan tub farqi nimada?", "U bevosita ko‘rinmaydi, kuzatish imkonsiz bo‘lib, vaqt va makon chegaralaridan tashqarida turadi.", "U faqat tajribada aniqlanadi, o‘zgaruvchan bo‘lib, tashqi ta’sirlarsiz mustaqil mavjud bo‘la olmaydi.", "U moddiy shaklga ega bo‘lib, fiziologik holatlarning o‘zaro mexanik harakatlari orqali belgilanadi.", "U aniq fizik o‘lchamlarga ega bo‘lib, inson hissiy sezgilarining to‘g‘ridan-to‘g‘ri biologik mahsulidir."], ["Gnoseologiyadagi «Bilimlarimiz tajribada sinalganmi?» degan asosiy masalada empirizm qanday yo‘lni tutadi?", "Barcha insoniy bilimlar faqat hissiy tajriba va amaliyot orqali shakllanganini qat’iy e’tirof etadi.", "Bilimlar tajribaga mutlaqo bog‘liq bo‘lmagan tug‘ma aql mahsuli ekanligini to‘liq ma’qullab chiqadi.", "Bilimlarning haqqoniyligini faqat mavhum mantiqiy xulosalar tizimi orqali isbotlanishini ta’kidlaydi.", "Tashqi olamni idrok qilishda amaliy tajribaning o‘rnini inkor etib, sof intuitsiyaga asoslanadi."], ["Falsafada «persepsiya» va «appersepsiya» tushunchalari o‘rtasidagi asosiy farq nimadan iborat?", "Persepsiya narsalarni sezgilar orqali idrok etish bo‘lsa, appersepsiya ularni aql bilan anglashdir.", "Persepsiya bilimlarni amaliyotda tekshirish bo‘lsa, appersepsiya ularning nazariy tavsifini berishdir.", "Persepsiya aqlning sof g‘oyalarini ifodalasa, appersepsiya tashqi olamni subyektiv inkor etishdir.", "Persepsiya ilmiy bilishning yakuniy bosqichi bo‘lsa, appersepsiya bilish jarayonining boshlanishidir."], ["Falsafiy ma’noda «bilish» tushunchasiga berilgan eng to‘g‘ri ta’rif qaysi javobda keltirilgan?", "Insonning borliq va uning obyektiv qonunlarini o‘rganish, anglash, o‘zlashtirish va egallash jarayoni.", "Insonning tashqi ta’sirlarga nisbatan fiziologik reaksiyalarini tajriba orqali tartibga solish tizimi.", "Borliq haqidagi subyektiv tasavvurlarning mavhum g‘oyalar shaklida o‘zgarishsiz saqlanib qolishi.", "Tafakkurning moddiy voqelikdan butunlay ajralgan holda o‘z-o‘zini anglashga qaratilgan faoliyati."], ["Falsafiy nuqtai nazardan «bilim» tushunchasining mazmuni qanday izohlanadi?", "Obyektiv borliq yoki muayyan sohalarga oid tartibga solingan ilmiy, amaliy ma’lumotlar majmuidir.", "Inson ongida paydo bo‘ladigan va hech qanday isbot talab qilmaydigan subyektiv xulosalardir.", "Faqatgina mavhum tushunchalar doirasida yuzaga keladigan va amaliyotga tatbiq etilmaydigan g‘oyadir.", "Tashqi olamdagi narsalarning inson hissiy sezgilarida qoldirgan vaqtinchalik tasavvurlari yig‘indisi."], ["Mifologik bilim shakliga xos bo‘lgan eng asosiy xususiyat qaysi javobda to‘g‘ri ko‘rsatilgan?", "U borliqning fantastik in’ikosi hisoblanib, tabiat va inson haqidagi qadimiy tasavvurlarni ifodalaydi.", "U tajribaviy faktlarga asoslangan bo‘lib, voqelikning qat’iy qonuniyatlarini mantiqiy aks ettiradi.", "U estetik tuyg‘ular vositasida reallikni badiiy obrazlar orqali qayta idrok etishga xizmat qiladi.", "U ilohiy vahiylarga tayangan holda olamning yaralishi to‘g‘risidagi qat’iy aqidalarni o‘rgatadi."], ["Badiiy bilim shakli borliqni anglash jarayonida qanday ro‘yobga chiqadi?", "San’at asari g‘oyasidan tortib uning odamlar tomonidan qabul qilinishigacha bo‘lgan refleksiyada.", "Ilmiy tajribalar orqali olingan aniq formulalar va qat’iy tushunchalarni umumlashtirish yo‘lida.", "Mifologik timsollarning jamiyatdagi ijtimoiy munosabatlarga ko‘rsatgan ta’sirini tahlil qilishda.", "Moddiy dunyo obyektlarining ichki tuzilishini laboratoriya tahlillari yordamida o‘rganish orqali."], ["Bilish muammosini o‘rganishda aniq fanlar bilan falsafaning vazifalari qanday farqlanadi?", "Aniq fanlar dunyoning konkret tomonlarini ochsa, falsafa bilishning tabiati va mohiyatini tushuntiradi.", "Aniq fanlar g‘oyaviy qarashlarni tahlil qilsa, falsafa laboratoriya tadqiqotlari bilan shug‘ullanadi.", "Aniq fanlar inson ruhiy dunyosini o‘rgansa, falsafa faqat tabiatning moddiy qonuniyatlarini tekshiradi.", "Aniq fanlar bilish imkoniyatini inkor etsa, falsafa barcha bilimlarning mutlaqligini isbotlab beradi."], ["Skeptitsizm oqimi vakillarining bilish nazariyasidagi bosh da’vosi nimadan iborat?", "Inson bilishining nisbiyligini aytib, isbot talab qilmaydigan mutlaq bilimlarga shubha bilan qaraydi.", "Olamni bilish mutlaqo imkonsiz ekanligini ta’kidlab, aqlning har qanday faolligini butunlay rad etadi.", "Barcha ilmiy bilimlarning faqat aprior tushunchalarga tayangan holda vujudga kelishini ma’qullaydi.", "Hissiy a’zolar orqali olinadigan ma’lumotlarning yagona va o‘zgarmas haqiqat ekanligini ilgari suradi."], ["Agnostitsizm falsafiy yo‘nalishining asosiy ta’limoti qaysi fikrda o‘z aksini topgan?", "Inson o‘zining cheklangan idroki tufayli obyektiv dunyoni to‘liq bilishga qodir emas deb hisoblaydi.", "Inson tafakkuri cheksiz imkoniyatlarga ega bo‘lib, butun koinot sirini to‘liq ocha olishini uqtiradi.", "Haqiqat faqat ilohiy vahiylar orqali namoyon bo‘lishini aytib, aql bilan bilishni chetga suradi.", "Bilish faqat amaliy mehnat jarayonida rivojlanishini e’tirof etib, nazariy bilimlarni inkor etadi."], ["Ingliz agnostik faylasufi D. Yum ta’limotiga ko‘ra bilish obyekti nima hisoblanadi?", "Obyektiv borliq emas, balki insonning subyektiv sezgilari va idroklari chegarasidagi hodisalardir.", "Inson ongidan tashqarida mustaqil ravishda mavjud bo‘lgan moddiy jism va narsalarning o‘zidir.", "Mantiqiy mushohada yordamida kashf etiladigan tabiatning o‘zgarmas obyektiv qonuniyatlaridir.", "Jamiyat taraqqiyoti jarayonida shakllanadigan ijtimoiy-iqtisodiy munosabatlar tizimi majmuidir."], ["Agnostitsizm ta’limotining skeptitsizm bilan qo‘shilib ketishi qanday oqibatga olib keladi?", "Bilish imkoniyatlarini butunlay inkor etuvchi nigilizm dunyoqarashining yuzaga kelishiga.", "Haqiqatni sof ratsionalizm asosida tushuntiruvchi falsafiy maktabning shakllanishiga.", "Borliqni faqat empirik vositalar bilan tadqiq etuvchi amaliy metodlarning rivojlanishiga.", "Inson aql-zakovatining cheksiz qudratini e’tirof etuvchi gumanistik qarashlarning o‘sishiga."], ["I. Kant olamni qanday ikki qismga ajratadi va ularning qaysi birini inson bila oladi?", "«Narsalar biz uchun»ni inson bila oladi, ammo «narsalar o‘zida»ni hech qachon to‘liq bila olmaydi.", "«Narsalar o‘zida»ni inson to‘liq bila oladi, «narsalar biz uchun»ni esa faqat his qilish mumkin.", "Moddiy olamni bilish mutlaqo imkonsizdir, faqat ma’naviy olamgina inson aqliga to‘liq bo‘ysunadi.", "Tabiat hodisalarini faqat tajriba orqali, Xudo va erkinlikni esa ilmiy tajribada bilib bo‘ladi."], ["I. Kant falsafasida keltirilgan «aprior bilimlar» qanday ma’noni anglatadi?", "Inson tajribasiga mutlaqo bog‘liq bo‘lmagan, tajribadan oldin mavjud bo‘lgan tug‘ma bilimlardir.", "Insonning uzoq yillik hayotiy tajribasi natijasida bosqichma-bosqich yig‘iladigan tushunchalardir.", "Ilmiy laboratoriya tajribalarida qayta-qayta tekshirib tasdiqlangan obyektiv ma’lumotlar tizimidir.", "Ijtimoiy munosabatlar ta’sirida paydo bo‘lib, vaqt o‘tishi bilan yo‘qolib ketadigan qarashlardir."], ["O‘rta asr Markaziy Osiyo mutafakkirlari (Forobiy, Ibn Sino, Beruniy) bilish jarayonini qanday tavsiflaganlar?", "Bilish sezgi va idroklardan boshlanib, tafakkur sari, ma’lumdan noma’lum tomon rivojlanadi.", "Bilish faqat sof aqlning o‘zida tug‘iladi va tashqi moddiy olam bilan hech qanday aloqa qilmaydi.", "Bilish obyektiv dunyoni aks ettira olmaydi, chunki insonning hissiy a’zolari doim aldaydi.", "Bilish insonning tug‘ma g‘oyalari yuzaga chiqishi bo‘lib, tajribaning unga hech qanday ta’siri yo‘q."], ["Islom falsafasida ilm tushunchasiga berilgan metodologik ta’rif qaysi javobda to‘g‘ri keltirilgan?", "Kuzatuv, tajribalar va xulosalar asosida vujudga kelgan qonun-qoidalar hamda faoliyatlar jarayonidir.", "Faqat g‘ayb olami va ilohiy vahiylarni tafakkur qilmasdan qabul qilishga asoslangan qarashlar majmuidir.", "Mavjud moddiy olamni butunlay inkor etgan holda sof ruhiy holatlarni o‘rganuvchi nazariy ta’limotdir.", "Inson aqlini cheklab, tajribaviy tadqiqotlarni nomaqbul deb hisoblovchi aqidaparastlik tizimidir."], ["Islom falsafasi olimlarining bilish borasidagi dunyoqarashida qaysi jihat hech qachon inkor etilmagan?", "Ilohiylik, payg‘ambarlarga vahiy yuborilishi hamda g‘aybga tegishli narsalarning haqiqiy mavjudligi.", "Moddiy borliqning faqat mexanik qonunlar asosida o‘z-o‘zidan yaratilgani va boshqarilishi.", "Inson hissiy a’zolarining borliqni bilishdagi mutlaq ustunligi va mustaqil yagona mezoni.", "Mantiqiy xulosalarning ilohiy haqiqatlardan butunlay yuqori turishi va ularni bekor qilishi."], ["Olim T. Karimov fikricha, «dunyoviylik» tushunchasi kimning asarlaridan so‘ng bilish ta’limotida aniq mazmunga ega bo‘lgan?", "Qadimgi yunon faylasufi Platon asarlaridan so‘ng konkret falsafiy mazmunga ega bo‘lgan.", "Nemis mumtoz faylasufi Immanuil Kant asarlaridan so‘ng mustaqil ilmiy kategoriya bo‘lgan.", "Sharq mutafakkiri Abu Nasr Forobiy risolalaridan so‘ng tizimli falsafiy asosga ega bo‘lgan.", "Yangi davr faylasufi Frensis Bekon asarlaridan so‘ng amaliy bilish usuliga aylantirilgan."], ["Falsafiy va diniy tizimlarda insonga nisbatan qanday tushuncha qo'llanilgan?", "Butun olam mohiyatini ifodalovchi kichik Koinot yoki mikrokosm", "Olam tuzilishiga mutlaqo zid bo'lgan yirik olam yoki makrokosm", "Barcha moddiy ne'matlarni vujudga keltiruvchi mexanik mexanizm", "Faqat jamiyatdagi iqtisodiy qonunlarga bo'ysunuvchi biologik tur"], ["Qadimgi Yunonistonning Delfi ibodatxonasi ustuniga qanday hikmatli ibora yozilgan edi?", "O'z-o'zingni angla", "Olam sirini kashf et", "Tabiat qonuniga bo'ysun", "Jamiyat talabini bajar"], ["Qadimgi xitoy faylasufi Lao Szi fikricha, kim haqiqiy donishmand hisoblanadi?", "O'zining ichki mohiyatini chuqur bilgan kishi", "Atrofdagi barcha o'zga insonlarni bilgan kishi", "Tabiat qonunlarini to'liq anglab yetgan kishi", "Dunyoviy ilmlarni to'la egallab olgan shaxs"], ["«Inson barcha narsalar mezonidir» degan mashhur falsafiy g'oya qaysi mutafakkirga tegishli?", "Qadimgi yunon mutafakkiri Protagorga tegishlidir", "Mashhur antik davr faylasufi Suqrotga taalluqlidir", "Sharqning buyuk qomusiy olimi Forobiyga mansubdir", "Yangi davr faylasufi Rene Dekart tomonidan aytilgan"], ["Matnga ko'ra, Islom ta'limotida insonning o'zini anglashi qanday natijaga olib keladi?", "O'zligini bilgan inson Parvardigorni ham taniydi", "Inson butun borliq ustidan mutlaq hukmron bo'ladi", "Barcha ilmiy va amaliy jumbog'larga yechim topadi", "Jamiyatdagi barcha ijtimoiy illatlardan qutuladi"], ["Matnda falsafa va fanning borliqni bilish usullari o'rtasidagi asosiy farq qanday izohlangan?", "Falsafa olamni inson orqali ichdan, fan esa tashqi tomondan biladi", "Falsafa faqat ilohiy asoslarni, fan esa moddiy olamni to'liq o'rganadi", "Falsafa yuzaki tasavvurlar beradi, fan esa mutlaq haqiqatni kashf etadi", "Falsafa qat'iy tajribaga tayanadi, fan esa farazlar bilan cheklanadi"], ["Matnga ko'ra, insonning o'zida va insondan tashqarida borliq qanday shakllarda namoyon bo'ladi?", "Insonda mutlaq borliq, undan tashqarida esa nisbiy borliq namoyon bo'ladi", "Insonda nisbiy borliq, undan tashqarida esa mutlaq borliq aks etadi", "Insonda moddiy borliq, undan tashqarida esa ma'naviy borliq mavjuddir", "Insonda abstrakt borliq, undan tashqarida esa haqiqiy borliq aks etadi"], ["Sharq mutafakkiri Beruniy jahon fanida inson masalasida qanday yangilik kiritdi?", "Inson va tabiat munosabatlarini dunyoviy fan nuqtai nazaridan o'rgandi", "Inson vujudini faqat ilohiy qonunlarning in'ikosi sifatida talqin etdi", "Insoniyat rivojini faqat ijtimoiy munosabatlar mahsuli deb hisobladi", "Odamning paydo bo'lishini sof mexanik jarayonlar orqali tushuntirdi"], ["Beruniy ta'limotiga ko'ra, odamlarning fe'l-atvori, qiyofasi va madaniyati nimalarga bog'liq?", "Faqat nasabga emas, balki tuproq, suv, havo va tabiiy muhitga ham bog'liq", "Faqatgina ajdodlarning qoni va nasliy xususiyatlarining uzatilishiga bog'liq", "Faqat kishilarning jamiyatdagi ijtimoiy va iqtisodiy mavqeiga tayanadi", "Faqat davlat tuzilishi hamda qonunlarning qat'iy nazoratiga asoslanadi"], ["Beruniy qarashlariga binoan, inson tanasining ichki tuzilishi qanday xarakterlanadi?", "Bir-biriga qarama-qarshi qismlardan iborat bo'lib, tobelik kuchi bilan birlashgan", "Butunlay bir jinsli moddalardan tashkil topgan bo'lib, ziddiyatlardan xolidir", "Tashqi muhit ta'siriga mutlaqo bog'liq bo'lmagan mustaqil elementlardan iborat", "Ijtimoiy mehnat jarayonida sun'iy shakllangan a'zolar yig'indisidan iboratdir"], ["Ibn Sino ta'limotiga muvofiq, inson hayvonot olamidan qaysi xususiyatlari bilan ajralib turadi?", "So'zi, tili, aqli hamda fikrlash va tafakkur qilish qobiliyati bilan farqlanadi", "Tirik qolish instinkti va o'ziga ozuqa topishdagi chaqqon harakati bilan ajraladi", "Jismoniy baquvvatligi hamda barcha tabiiy sharoitlarga tez moslashuvi bilan ajraladi", "Guruh bo'lib yashash va birgalikda himoyalanish xususiyatiga egaligi bilan farqlanadi"], ["Forobiy qarashlariga ko'ra, insonning jamiyatdan ajralib yolg'iz (uzlatda) yashashi qanday oqibatga olib keladi?", "Insonni qashshoqlashtiradi, insoniy qiyofasini va baxtga olib boruvchi iste'dodini yo'qotadi", "Insonning ma'naviy dunyosini boyitadi hamda uning mutlaq erkinligini to'liq ta'minlaydi", "Inson aql-zakovatini yanada o'stiradi va unga yuksak ma'naviy darajaga yetish imkonini beradi", "Insonni jamiyatning barcha ziddiyatli ta'sirlaridan saqlab, yuksak fozillikka yetaklaydi"], ["Ibn Xaldun inson mohiyatini qaysi jihat bilan bog'liq holda talqin qiladi?", "Insonni jamiyatda yashashga intiluvchi ijtimoiy voqelik sifatida tavsiflaydi", "Insonni faqatgina biologik qonunlar asosida harakatlanuvchi mavjudot deb biladi", "Insonni tabiatning barcha boshqa turlaridan mutlaqo ajralgan unsuri deb qaraydi", "Insonni koinotdagi sof mexanik qonuniyatlarning yagona mahsuli sifatida ko'radi"], ["«Inson–mashina» asarida insonga mexanistik yondashuvni ilgari surgan faylasuf kim?", "Fransuz faylasufi Julien Lametri", "Fransuz mutafakkiri Rene Dekart", "Nemis olimi Artur Shopengauer", "Fransuz mutafakkiri Jan-Pol Sartr"], ["Rene Dekart inson mohiyatini belgilashda qaysi fikrni asos qilib olgan?", "«Inson fikrlovchi narsadir» degan qoidani ilgari suradi", "«Inson mehnat qurollari yasovchi hayvondir» deb ta'riflaydi", "«Inson barcha ijtimoiy munosabatlar mahsulidir» deb hisoblaydi", "«Inson tabiatning eng katta xatosidir» degan g'oyaga tayanadi"], ["P.T. de Sharden insonning evolyutsiyadagi o'rnini qanday baholagan?", "Inson dunyoning statik markazi emas, balki evolyutsiyaning o'zi va cho'qqisidir", "Inson tabiat rivojlanishidagi xatolik va noqobil rivojlanishning boshi berk ko'chasidir", "Inson evolyutsiya jarayonidan butunlay chetda turgan, o'zgarmas doimiy jonzotdir", "Inson faqat tirik moddaning tasodifiy hosilasi bo'lib, uning yuksak maqsadi yo'qdir"], ["Insonni «tabiat xalturasi» va nuqsonli mavjudot deb baholagan mutafakkir kim?", "Nemis faylasufi Artur Shopengauer", "Fransuz olimi Per Teyyar de Sharden", "Sharq qomusiy olimi Abu Rayhon Beruniy", "Fransuz faylasufi Jan-Pol Sartr"], ["Jan-Pol Sartrning inson mohiyatiga oid konsepsiyasi qanday ifodalangan?", "Inson doim kelajakka qarab intiladi va shu tariqa o'zini o'zi yaratadi", "Inson tug'ilishidanoq tayyor tabiatga ega bo'lib, taqdiriga bo'ysunadi", "Inson o'z mohiyatini faqat ibtidoiy xohishlarini qondirish bilan quradi", "Insonning butun hayotiy yo'li faqat biologik qonunlar bilan belgilanadi"], ["Inson kelib chiqishining tabiiy-ilmiy evolyutsion nazariyasi qaysi asarga tayanadi?", "CH.Darvinning «Hayvon va o'simlik turlarining kelib chiqishi haqida»gi asariga", "J.Lametrining jamiyat taraqqiyotiga bag'ishlangan «Inson–mashina» asariga", "Rene Dekartning inson idrokini tahlil qiluvchi mashhur falsafiy risolasiga", "Abu Rayhon Beruniyning qadimgi xalqlar tarixiga oid fundamental tadqiqotiga"], ["Insonning paydo hi bilan", "Xususiy mulkchilikning paydo bo'lishi va mehnat taqsimoti bilan", "Jamiyatda turli diniy marosimlar va urf-odatlarning boyishi bilan"], ["Aksiologiya atamasining kelib chiqishi va lug'aviy ma'nosi qaysi javobda to'g'ri ko'rsatilgan?", "Yunoncha \"axio\" – qadriyat hamda \"logos\" – ta'limot ma'nosini bildiradi.", "Lotincha \"action\" – harakat hamda \"logos\" – qonuniyat ma'nosini bildiradi.", "Yunoncha \"askesis\" – mashq hamda \"logos\" – fan ma'nolarini ifoda etadi.", "Lotincha \"aestimatio\" – baho hamda \"logos\" – usul ma'nolarini anglatadi."], ["\"Aksiologiya\" atamasini XX asrning ikkinchi yarmida ilmiy sohaga olib kirgan olimlar kimlar?", "Nemis aksiologi Y. Gartman hamda fransuz mutafakkiri P. Lapi", "Nemis faylasufi I. Kant hamda fransuz sotsiologi E. Dyurkgeym", "Nemis olimi G. Gegel hamda fransuz pozitivisti O. Kont hisoblanadi", "Nemis olimi F. Nitsshe hamda fransuz tadqiqotchisi R. Dekartdir"], ["Matnga binoan qadriyat kategoriyasiga berilgan eng to'liq falsafiy ta'rif qaysi?", "Voqelikning umuminsoniy, ijtimoiy-axloqiy, madaniy-ma'naviy ahamiyati ifodasidir.", "Inson ehtiyojlarini qondiruvchi moddiy mahsulotlarning narx-navo ko'rsatkichidir.", "Jamiyat a'zolari tomonidan ixtiyoriy ravishda bajariladigan burchlar majmuasidir.", "Davlat boshqaruv tizimida belgilangan rasmiy-huquqiy me'yorlar va qoidalaridir."], ["Olam, tabiat va jamiyatning abadiy qonun-qoidalarini ifodalovchi qadriyatlar qanday ataladi?", "Umumbashariy qadriyatlar", "Mintaqaviy qadriyatlar", "Korporativ qadriyatlar", "Iqtisodiy qadriyatlar"], ["Muayyan bir millat yoki xalqning tili, madaniyati va o'tmishi bilan bog'liq qadriyatlar qaysi?", "Milliy qadriyatlar", "Shaxsiy qadriyatlar", "Guruhli qadriyatlar", "Hududiy qadriyatlar"], ["Insonning shaxsiy e'tiqodi, umr ma'nosi, odobi va go'zalligi bilan bog'liq qadriyatlar qaysi turga kiradi?", "Shaxsiy qadriyatlar tizimiga kiradi", "Umuminsoniy qadriyatlar turiga kiradi", "Siyosiy-mafkuraviy guruhga ajratiladi", "Moddiy-iqtisodiy boyliklarga tengdir"], ["Tarixiy zaruriyatga ko'ra, imperiya hukmronligi nihoyasiga yetganda qaysi qadriyatning o'rni keskin oshadi?", "Istiqlol qadriyati ustuvor ahamiyat kasb etadi", "Boylik to'plash tamoyili birinchi o'ringa chiqadi", "Ijtimoiy tabaqalanish jarayoni yuqoriga intiladi", "Madaniy yakranglik hodisasi jamiyatda kengayadi"], ["Jamiyat hayotida urush davrida kishilar uchun eng birinchi o'ringa ko'tariladigan qadriyat qaysi?", "Tinchlik qadriyatining ahamiyati oshadi", "Boylik orttirish qadriyati oldinga chiqadi", "Martabaga erishish maqsadi ustun keladi", "Ilmiy unvon olish istagi keskin yuksaladi"], ["Qadriyatlarning shakllanishi va rivojlanishidagi obyektiv zamin qaysi javobda ko'rsatilgan?", "Moddiy turmush darajasi, sharoiti va iqtisodiy imkoniyatlar", "Alohida mutafakkirlarning subyektiv qarashlari va istaklari", "Siyosiy partiyalarning qisqa muddatli manfaatli dasturlari", "Diniy oqimlarning tasavvurlari hamda falsafiy afsonalari"], ["Qadriyatlarni baholashdagi subyektiv omil nimalarga asoslanadi?", "Shaxsiy, guruhiy, milliy va umuminsoniy manfaatlarga tayanadi", "Faqatgina tabiat qonunlari va geografik muhit talablariga bog'liq", "Moddiy buyumlarning fizik va kimyoviy xususiyatlariga tayanadi", "Jamiyatdagi texnologik ishlab chiqarish quvvatlariga asoslanadi"], ["\"Meros\" va \"qadriyat\" tushunchalarining nisbati haqidagi to'g'ri xulosa qaysi?", "Meros tushunchasi hajman keng bo'lib, har qanday meros ham qadriyat bo'lavermaydi.", "Har qanday o'tmish merosi istisnosiz ravishda yuksak qadriyat maqomiga ega bo'ladi.", "Qadriyat tushunchasi merosdan kengroq bo'lib, o'tmish hodisalarini qamrab olmaydi.", "Bu ikki tushuncha mutlaqo bir xil ma'noni anglatib, o'zaro to'liq sinonim sanaladi."], ["O'tmishdan qolgan meros qanday holatda chinakam qadriyat darajasiga ko'tarilishi mumkin?", "Hozirgi jamiyat taraqqiyoti uchun ijobiy va zarur omil bo'lib xizmat qilgan taqdirda", "Faqatgina qadimiy yozma yodgorliklar ro'yxatiga rasman kiritilgan vaqtning o'zida", "Ayrim siyosiy guruhlarning tor mafkuraviy manfaatlarini to'liq ifoda etgan paytda", "Bozor iqtisodiyoti tizimida juda katta moddiy foyda keltirish qobiliyatiga ega bo'lsa"], ["\"Qadriyat\" so'zining o'zak ma'nosi dastlab qanday tushunchani ifodalaydi?", "Qadr-qimmat va narsa-hodisalarning ahamiyatini", "Buyumlarning tijoriy tannarxi va bozor bahosini", "Fizik jismlarning tashqi shakli va tuzilishini", "Insonning tug'ma ruhiy quvvati hamda g'ayratini"], ["Qadriyatlarga tor sinfiy yoki partiyaviy manfaatlardan kelib chiqib yondashish qanday oqibatga olib keladi?", "Ularning asl mohiyati va imkoniyatlarini noto'g'ri talqin qilishga", "Jamiyatda mutlaq ijtimoiy adolat va tenglikning to'liq qaror topishiga", "Umumbashariy qadriyatlarning yanada chuqur anglab yetilishiga olib keladi", "Milliy madaniyatning dunyo miqyosida jadal ravishda e'tirof etilishiga"], ["Matnda ko'rsatilgan sohaviy tasnifga muvofiq qadriyatlarning besh asosiy turi qaysi?", "Tabiiy, iqtisodiy, ijtimoiy-siyosiy, ma'naviy, axloqiy qadriyatlar", "Biologik, texnikaviy, dunyoviy, g'oyaviy, shaxsiy qadriyatlar majmui", "Diniy, qonuniy, davlatparvarlik, kasbiy, guruhli qadriyatlar guruhi", "Ibtidoiy, o'rta asriy, yangi davr, zamonaviy, kelajak qadriyatlari"], ["Milliy-ma'naviy qadriyatlar qaysi uch tushunchaning o'zaro kesishgan nuqtasida shakllanadi?", "\"Milliylik\", \"Ma'naviyat\" va \"Qadriyat\" tushunchalari kesishuvida", "\"Davlat\", \"Jamiyat\" hamda \"Huquqiy me'yor\" tushunchalari doirasida", "\"Iqtisodiyot\", \"Siyosat\" va \"Texnika\" tushunchalari sintezida", "\"Falsafa\", \"Mantiq\" hamda \"Gnoseologiya\" tushunchalari birligida"], ["O'zbek xalqi uchun oliy darajadagi ma'naviy qadriyat va qalb gavhari sifatida nima ko'rsatilgan?", "Yaqin insonlar va qo'shnilarning omon-esonligi to'g'risida g'amxo'rlik qilish", "Moddiy boylik to'plab, o'z oilasining moliyaviy qudratini boshqalarga ko'rsatish", "Shaxsiy martaba hamda boshqaruv sohasida eng yuqori mavqega erishishga intilish", "O'zining shaxsiy manfaatlarini jamiyat talablaridan doimo yuqori qo'ya bilish"], ["Mustaqillik tufayli sobiq ittifoq davrida ilgari surilgan qaysi qadriyatlar sarobga aylandi?", "Oldin ulug'langan partiyaviy-sinfiy tamoyillar sarobga aylandi", "Umumbashariy gumanistik g'oyalar butunlay o'z kuchini yo'qotdi", "Xalqimizning an'anaviy oilaviy hurmat-ehtirom qadriyatlari so'ndi", "Ilm-ma'rifat va halol mehnatga bo'lgan ijobiy e'tiqod yo'qoldi"], ["Qadriyatlar o'z tabiatiga ko'ra qanday xarakterga ega va ijtimoiy jarayonda qanday o'zgaradi?", "Ijtimoiy-tarixiy xarakterga ega bo'lib, muttasil o'zgaradi va takomillashadi.", "Mutlaqo o'zgarmas, biologik asosga ega bo'lib, doimiy statik holatda qoladi.", "Faqat subyektiv tasavvur bo'lib, jamiyat taraqqiyotiga hech qanday ta'sir etmaydi.", "Faqatgina moddiy ehtiyojlar bilan belgilanib, ma'naviy omillarga bog'liq bo'lmaydi."], ["Quyidagilardan qaysi biri milliy g'oyaning axloqiy mezonlariga xos fazilatlar qatoriga kiritilgan?", "Halollik, adolatlilik, vatanparvarlik, burch va mas'uliyat hissi", "Shaxsiy xudbinlik, pragmatizm, befarqlik va moddiy boylikka hirs", "Tor guruhbozlik, konservatizm, yangilikka to'siq bo'lish va loqaydlik", "Hissiyotlarga berilish, maqsadsiz hayot kechirish va murosasizlik"]]}, {"name": "Materialshunoslik va konstruksion materiallar texnologiyasi", "q": [["Konstruksion materiallar texnologiyasi fanining asosiy bo'limlari qaysi javobda to'g'ri ko'rsatilgan?", "Metallshunoslik, metallurgiya, quymakorlik va metallarni bosim ostida ishlash.", "Fizika, kimyo, materialshunoslik va metallarning mustahkamlik tahlili.", "Matematika, geometriya, fizika va materiallarning issiqlik o'tkazuvchanligini o'rganish.", "Biologiya, ekologiya, geologiya va metalldan foydalanishning atrof-muhitga ta'siri."], ["M.V.Lomonosovning metallshunoslik faniga qo'shgan hissasi nimada?", "Metallarga xos bo'lgan yaltiroqlik va plastiklik xossalarini birinchi bo'lib tasvirlab bergan.", "Mikroskopdan foydalanib metallarning ichki tuzilishini o'rganish metodini joriy etgan.", "Po'lat tarkibidagi uglerod miqdoriga bog'liq kritik vaziyatni aniqlagan va uni izohlab bergan.", "Qotishmalarni fizik va kimyoviy analiz qilishning yangi metodlarini ishlab chiqqan."], ["Metallshunoslik fani nimani o'rganuvchi asosiy soha hisoblanadi?", "Metall va qotishmalarning tarkibiy qismlari, tuzilishlari hamda xossalarini bog'lab tashqi ta'sirlar natijasini.", "Organik moddalarning fizik va kimyoviy xususiyatlarini, ularning sintezlash jarayonlarini.", "Yuqori haroratda materiallarning erish nuqtasini va issiqlik o'tkazuvchanlik koeffitsientini.", "Qurilish materiallarining mustahkamlik xossalarini va ularning ishlatilishini."], ["P.P.Anosov metallshunoslik faniga qanday muhim yangiliklarni olib kirgan?", "Metallarning strukturasini o'rganish uchun mikroskopdan birinchi bo'lib foydalangan va uglerodni to'yintirish metodini kashf etgan.", "Temir-uglerod qotishmalari holat diagrammasini yaratishning nazariy asoslarini ishlab chiqqan.", "Ishqalanishga chidamli bo'lgan yangi qotishmalarni tayyorlashning zamonaviy usullarini taklif etgan.", "Metallurgik jarayonlarning fizik-kimyoviy mohiyatini ochib beruvchi nazariy tadqiqotlarni amalga oshirgan."], ["Konstruktsion materiallar texnologiyasi deb nimaga aytiladi?", "Tegishli xom ashyoni ma'lum bir texnologik jarayonlar orqali qayta ishlash usullari bilan metallar, qotishmalar ishlab chiqarish.", "Kimyoviy elementlarning atom tuzilishini va ularning molekulyar bog'lanish xususiyatlarini o'rganish.", "Faqat tabiiy resurslarni qazib olish va ulardan xom ashyo tayyorlash jarayonlarini o'rganish.", "Mashinalar va qurilmalarning dizaynini optimallashtirish, estetik jihatlarini takomillashtirish."], ["Metallurgiya fanining asosiy ta'rifi qaysi javobda to'g'ri aks ettirilgan?", "Tabiiy birikmalardan metallni ajratib olib, uni ishlab, aniq zaruriy xususiyatli metall olish texnologik jarayoni.", "Faqat qora metallarni yer ostidan qazib olish va ularni dastlabki qayta ishlash amaliyotini o'rganish.", "Materiallarning mexanik xossalarini, masalan, qattiqlik va elastiklikni o'lchash usullarini.", "Kimyoviy elementlarning davriy jadvaldagi o'rnini va ularning atom massasini aniqlash."], ["Magnit temirtoshning (Fe₃O₄) asosiy xarakteristikasi nimada?", "Tarkibida 55-65% toza temir, rangi qoramtir, solishtirma og'irligi 5 ga teng va magnit xossasiga ega.", "Tarkibida 30-50% temir, rangi kul rang, suvli oksid bo'lib, engil va mo'rt struktura.", "Tarkibida 35-45% temir, rangi och qizil, juda yuqori issiqlik o'tkazuvchanligiga ega.", "Tarkibida 75-90% uglerod, qizdirilganda kul qoldirmaydigan, oq rangli mineral."], ["Rudadagi temir miqdori, qo'shimchalar turi va kimyoviy tarkibi, ularni miqdori, qazib olish narxi, boyligi va uni qayta ishlash imkoniyatlari nimani ifodalaydi?", "Har qanday rudaning sanoat ahamiyatiga ega ekanligini aniqlovchi asosiy mezonlar hisoblanadi.", "Faqatgina rudadan metall ajratib olishning texnik imkoniyatlarini belgilovchi yordamchi ko'rsatkichlar.", "Rudalarning geologik yoshini va ularning yer ostida joylashish chuqurligini baholash uchun muhim omillar.", "Rudani quritish va maydalash jarayonining iqtisodiy samaradorligini o'lchovchi birliklar."], ["Rudani boyitish yoki eritishga tayyorlashdagi \"aglomerasiya\" jarayoni nimani anglatadi?", "Mayda ruda zarrachalarini yiriklashtirish orqali ularni domna pechlariga yuklash uchun qulay holatga keltirish.", "Rudani suv bilan yuvish orqali keraksiz jinslardan tozalash va temir miqdorini oshirish usuli.", "Rudadagi karbonat angidrid va oltingugurtdan tozalash maqsadida rudani 600-800°S haroratda qizdirish.", "Rudani magnit xususiyatiga asoslanib, elektromagnit separatorlardan o'tkazish texnologiyasi."], ["Koks yonilg'isi qaysi xususiyatlari bilan ajralib turadi?", "Kokslanuvchi toshko'mirlardan 1000-1100°C haroratda olinadi va 7000-8000 k kal/kg issiqlik berish darajasiga ega.", "Yog'ochni havosiz muhitda 400-600°S haroratda qizdirish orqali olinadi va tarkibida atigi 0,8% kul bo'ladi.", "Tarkibida 0,5-4%S namligi va 20-40% gacha qo'shimchalar bo'lib, 2500-4000 k kal/kg issiqlik beradi.", "Vodorod (50-60%) va metan (20-34%) asosiy komponentlari bo'lib, 4000-4500 k kal issiqlik ajratadi."], ["O'tga chidamli materiallarga qo'yiladigan asosiy talablar qaysilar?", "Pechdagi yuqori temperaturada parchalanmasligi, yumshamasligi, metall va pechdagi gazlar ta'sirida shaklini o'zgartirmasligi.", "Engil bo'lishi, estetik ko'rinishi yaxshi bo'lishi va mexanik ishlov berishga osonlik bilan berilishi.", "Yuqori elektr o'tkazuvchanligiga ega bo'lishi, suvni o'tkazmasligi va tovushni yutish xususiyati.", "Kam zichlikka ega bo'lishi, kimyoviy jihatdan passiv bo'lishi va rangini o'zgartirmasligi."], ["Domna pechining asosiy qismlari qaysi javobda to'g'ri keltirilgan?", "Koloshnik, shaxta, raspar va gorn.", "Konverter, elektr pechi, qoliplash bo'limi.", "Kokslash kamerasi, maydalash sexi, yuvish bo'limi.", "Kauper, aglomeratsiya mashinasi, transportyor."], ["Domna pechida temirning rudasidan qaytarilish jarayoni qaysi harorat oralig'ida sodir bo'ladi?", "500°S da asta-sekin boshlanib, 900-1000°S da tugaydi.", "200-300°S haroratda boshlanib, 400°S da yakunlanadi.", "1600-1750°S haroratda boshlanib, 1900°S dan oshganida tezlashadi.", "Xona haroratida avtomatik ravishda, qo'shimcha isitish talab etilmaydi."], ["Domna pechida temir rudasini tiklovchi asosiy modda qaysi?", "Uglerod 2 oksidi (CO).", "Kislorod (O₂).", "Uglerod (C).", "Azot (N₂)."], ["Oq cho'yanning asosiy xususiyati nimada?", "Tarkibidagi uglerod karbid holida bo'ladi va sindirilganda yuzasi oq rangda bo'ladi, po'lat olish uchun ishlatiladi.", "Tarkibida yuqori miqdorda kremniy bo'lib, uni kul rangga aylantiradi va mustahkamlikni oshiradi.", "Tarkibida titanium va nikel kabi legirlovchi elementlar mavjud bo'lib, korroziyaga chidamlilikni ta'minlaydi.", "Yuqori darajada egiluvchanlikka ega bo'lib, osonlik bilan shakl berishga imkon beradi."], ["D.K.Chernovning metalshunoslik faniga asosiy hissalari nimalardan iborat?", "Metalshunoslikning ilmiy asoslarini yaratdi, po'latning xossalari kimyoviy tarkibi va tuzilishiga bog'liqligini isbotladi.", "Birinchi bo'lib metallarning strukturasini o'rganishda mikroskopik analizni qo'llagan.", "Qotishmalarni fizik va kimyoviy analiz qilishning yangi usullarini ishlab chiqqan.", "Ishqalanishga chidamli bo'lgan yangi metall qotishmalarini sintezlash jarayonlarini kashf etgan."], ["Domna pechida hosil bo'ladigan shlakning asosiy tarkibi nimalardan iborat?", "Keraksiz jinslar, flyuslar, yonilg'i kuli va pechning erigan devori komponentlarining birikmasi.", "Faqatgina uglerod va kisloroddan iborat bo'lib, u yonganda yuqori issiqlik ajratib chiqaradi.", "Metall qotishmalarining asosiy elementlari va ularning turli oksidlari.", "Suv bug'i, azot va domna gazining yonish mahsulotlari."], ["Kislotali xarakterli o'tga chidamli materiallarga misol qaysi?", "Dinas g'ishti va kvars.", "Magnezit va dolomit.", "Gil tuproq va qum tuproq.", "Shlak va temir oksidi."], ["Domna pechidagi C + O₂ = CO₂ reaksiyasi taxminan qanday haroratda sodir bo'ladi?", "1600-1750°C.", "500-600°C.", "900-1000°C.", "1100-1200°C."], ["Temir rudalarining boyitish jarayonida \"yuvish\" usuli qanday natija beradi?", "Keraksiz jinslar suv bilan oqib ketadi va rudaning tarkibidagi temir miqdori 5-20% gacha ko'payishi mumkin.", "Rudadagi karbonat angidrid va oltingugurt birikmalari bug'lanib, rudaning massasi kamayadi.", "Mayda ruda zarrachalarini yirikroq bo'laklarga birlashtirib, ularni domna pechiga yuklashni osonlashtiradi.", "Rudaning magnit xususiyatlarini oshirib, elektromagnit separatorlarda ajratish samaradorligini yaxshilaydi."], ["Poʻlatni choʻyandan farqlaydigan asosiy xususiyat nima va uning qanday mexanik xususiyatlari yuqori baholanadi?", "Poʻlatning tarkibidagi elementlar miqdori bilan farqlanadi va u yuqori qattiqlikka, yaxshi kesiluvchanlikka ega boʻladi.", "Poʻlat choʻyan kabi faqat ugleroddan iborat boʻlib, uning plastikligi sezilarli darajada pasaytirilgan.", "Poʻlat choʻyanga qaraganda doim pastroq erish haroratiga ega va uning kimyoviy xususiyatlari oʻxshashdir.", "Poʻlat choʻyandan faqat rangi bilan farq qiladi, mexanik xususiyatlari har doim bir xil boʻladi."], ["Birinchi marta poʻlat ishlab chiqarishni sanoat miqyosida rivojlantirishga hissa qoʻshgan ixtirochi kim va qaysi yili?", "Angliyalik Genri Bessemer tomonidan 1856 yilda, konvertor texnologiyasi asosida kashf etilgan.", "Fransiyalik Pyer va Emil Martenlar tomonidan 1886 yilda, regeneratorli pechlar yordamida taklif qilingan.", "Amerikalik Endryu Karnegi tomonidan 1901 yilda, elektr yoy pechlari asosida amalga oshirilgan.", "Nemis olimi Karl Benz tomonidan 1879 yilda, avtomobil sanoati ehtiyojlari uchun ishlab chiqilgan."], ["Kislorodli konvertorlarda yuqori miqdordagi uglerod (C) va fosfor (P) mavjud boʻlgan shixta materiallarini qayta ishlash uchun qanday oʻtga chidamli materialdan foydalaniladi?", "Devori asosli olovbardosh gʻishtlardan terilgan pechlar ishlatiladi, masalan, magnezit gʻishtlari qoʻllaniladi.", "Devori kislotali xarakterli gʻishtlardan terilgan pechlar, yaʼni dinas gʻishti materiallari talab qilinadi.", "Devori neytral olovbardosh gʻishtlardan terilgan pechlar, masalan, xrom-magnezitdan foydalaniladi.", "Devori yuqori kremniy oksidi asosli, sement bilan bogʻlangan refraktor materiallaridan tashkil topadi."], ["Nima sababdan kislorodli konvertorlarda poʻlat sifati havoda ishlaydigan konvertorlarga nisbatan ancha yuqori boʻladi?", "Kislorod havoning tarkibidagi azot kabi baʼzi elementlar bilan poʻlatning toʻyinib qolishini oldini oladi.", "Havodagi kislorod miqdori poʻlatni oksidlash uchun yetarli boʻlmaydi, bu jarayonni sekinlashtiradi.", "Havodan foydalanish konvertor ichidagi haroratni juda tez koʻtarib yuboradi, bu esa poʻlatni haddan tashqari qizdiradi.", "Kislorodli konvertorlar kamroq energiya sarflaydi va ish jarayonini avtomatlashtirish imkonini beradi."], ["Kislorodli konvertorga berilayotgan kislorodning odatdagi bosimi va tezligi qanday koʻrsatkichlarga ega boʻladi?", "Kislorod bosimi 10-20 atm, tezligi 97-99 %, bir tonna poʻlat uchun bir minutda 2.2-4.5 m³ sarflanadi.", "Kislorod bosimi 1-5 atm, tezligi 80-90 %, bir tonna poʻlat uchun bir minutda 1.0-1.5 m³ sarflanadi.", "Kislorod bosimi 50-60 atm, tezligi 99-100 %, bir tonna poʻlat uchun bir minutda 5.0-7.0 m³ sarflanadi.", "Kislorod bosimi 0.5-1.0 atm, tezligi 70-85 %, bir tonna poʻlat uchun bir minutda 0.5-1.0 m³ sarflanadi."], ["Kislorodli konvertorlarda kremniyning oksidlanish jarayoni qanday kimyoviy reaksiya orqali sodir boʻladi?", "Si + 2O = SiO₂ koʻrinishida, hosil boʻlgan kremniy oksidi shlakka oʻtadi va ajraladi.", "2Si + O₂ = 2SiO koʻrinishida, bu jarayonda gazsimon mahsulot hosil boʻladi va u atmosferaga chiqariladi.", "Si + O₂ = Si O₂ koʻrinishida, natijada metall yuzasida kremniy karbidi qatlami hosil boʻladi.", "Si + FeO = SiO₂ + Fe koʻrinishida, kremniy temir bilan reaksiyaga kirishib, uni deoksidlaydi."], ["Fosforning (P) oksidlanishidan keyin uning konvertorda shlakka oʻtishi uchun qanday dephosphorizatsiya reaksiyasi sodir boʻladi?", "(FeO)₃P₂O₅ + 4CaO = (CaO)₄P₂O₅ + 3FeO reaksiyasi orqali fosfor kaltsiy bilan birikadi.", "2P + 5O₂ = 2P₂O₅ reaksiyasi orqali fosfor faqat kislorod bilan birikib shlakka oʻtadi.", "P + FeO = PO + Fe reaksiyasi orqali fosfor temir oksidini tiklaydi va metallga qaytadi.", "4P + 5CaO = (CaO)₅P₄ reaksiyasi orqali fosfor kaltsiy fosfatini hosil qiladi va gazga aylanadi."], ["Kislorodsizlantirish jarayonida poʻlatdagi kislorodni yoʻqotish uchun qanday elementlar qoʻllaniladi?", "Jarayon oxirida pechga Mn, Si, Al solinadi va ular kislorod bilan birikib shlakka oʻtadi.", "Jarayon boshida uglerod va oltingugurt qoʻshiladi, chunki ular kislorod bilan reaksiyaga kirishadi.", "Jarayon davomida temir rudasi va ohaktosh qoʻshiladi, bu materiallar kislorodni bogʻlashga yordam beradi.", "Jarayon soʻngida faqat temir kiritiladi, chunki u metallga singib kislorodni eritadi."], ["Kislorodli konvertorlarda poʻlat tarkibini aniq nazorat qilish nega qiyin va bu qanday kamchiliklarga olib keladi?", "Vaqt juda qisqa boʻlganligi sababli, shlak toʻla ajralib ulgurmaydi va suyuq choʻyan tez sovib qoladi.", "Jarayon juda uzoq davom etganligi sababli, metall tarkibidagi elementlar oksidlanishga ulgurmaydi.", "Shixta tarkibiga doimiy ravishda yuqori sifatli metallom solinadi, bu esa reaksiya tezligini sekinlashtiradi.", "Kislorod bosimi juda past boʻlganligi uchun aralashtirish jarayoni samarali kechmaydi va nazorat qiyinlashadi."], ["Marten pechlarida poʻlat ishlab chiqarish usulini kimlar va qaysi yili taklif qilishgan?", "Fransuz metallurglari Pyer va Emil Martenlar tomonidan 1886 yilda ishlab chiqilgan.", "Angliyalik Genri Bessemer va Tomas Gilchrist tomonidan 1856 yilda yaratilgan.", "Amerikalik Endryu Karnegi va Genri Kort tomonidan 1870 yilda taklif etilgan.", "Shved kimyogari Jöns Yakob Berzelius tomonidan 1845 yilda joriy qilingan."], ["Marten pechlarida qoʻllaniladigan 'karbyuratorli jarayon'ning oʻziga xos xususiyati nimada va u qaysi materialdan foydalanadi?", "Ushbu jarayonda faqat temir-tersak (metallolom) dan foydalaniladi, choʻyan oʻrniga toshkoʻmir, torf koksi kabi materiallar ishlatiladi.", "Ushbu jarayon asosan suyuq choʻyan va temir rudasidan foydalanib, uglerodni kamaytirishga qaratilgan boʻladi.", "Ushbu jarayonda shixtani 70% gacha chushka choʻyan va qolganini temir-tersak tashkil etadi, kamroq uglerod qoʻllaniladi.", "Ushbu jarayon faqat yuqori sifatli, kam uglerodli poʻlatlarni olish uchun moʻljallangan boʻlib, maxsus qotishmalar talab qiladi."], ["Marten pechlarida regeneratorlarning asosiy vazifasi nimadan iborat va ular qanday tuzilgan?", "Havo va gazni qizigan holda berish, ular oʻtga chidamli gʻishtlardan vertikal kanalchalar shaklida terilgan.", "Eritilgan metallni toʻplash va uni tashqi muhitdan himoya qilish, ular metall qobiqdan iborat.", "Pechdagi shlakni yigʻish va uni metall eritmasidan ajratish, ular magnitlangan qatlamlardan tashkil topgan.", "Yonuvchi gazlarni yoʻnaltirish va ularni yoqish, ular elektr isitgichlar va ventilyatorlardan iborat."], ["Marten pechlarida marganetsning (Mn) oksidlanish jarayoni qanday kimyoviy reaksiya orqali sodir boʻladi?", "2Mn + O₂ = 2MnO reaksiyasi orqali marganets oksidi shlakka oʻtadi.", "Mn + CO₂ = MnCO₃ reaksiyasi orqali marganets karbonat hosil qilib, gaz holida chiqib ketadi.", "Mn + FeO = MnO + Fe reaksiyasi orqali marganets temir oksidini qaytarib, oʻzi oksidlanadi.", "Mn + 2O₂ = MnO₄ reaksiyasi orqali marganets yuqori oksid holatiga oʻtib, metall tarkibida qoladi."], ["Marten pechlarida eritilgan poʻlatning mexanik xossalari kislorodli konvertorlarda olingan poʻlatga nisbatan qanday farqlanadi?", "Marten pechida eritilgan poʻlat gazlar va shlak kam boʻlgani uchun yuqori mexanik xossalarga ega.", "Marten pechidagi poʻlat tarkibida koʻproq gazlar qolgani uchun uning mexanik xossalari pasaygan boʻladi.", "Ikkala usulda olingan poʻlatlarning mexanik xossalari bir xil darajada boʻlib, farq faqat tannarxda kuzatiladi.", "Marten pechida olingan poʻlatning qattiqligi pastroq, lekin plastikligi konvertor poʻlatidan yuqori boʻladi."], ["Elektr pechlarida poʻlat olishning Marten pechlariga nisbatan asosiy afzalligi nimada va u qanday poʻlatlar uchun muhim?", "Oksidlovchi alanga boʻlmasligi va havo kamligi tufayli sifatli, legirlangan poʻlatlarni olish imkonini beradi.", "Elektr pechlari ancha sodda tuzilishga ega boʻlib, Marten pechlaridan kamroq joyni egallaydi va tezroq eritadi.", "Elektr pechlari yonilgʻi sarfi boʻyicha Marten pechlaridan ancha tejamkor, chunki elektr energiyasi arzonroqdir.", "Elektr pechlari faqat suyuq choʻyandan poʻlat olish uchun qulay boʻlib, qattiq shixta materiallarini qayta ishlay olmaydi."], ["Vertikal joylashgan elektr yoy pechlarida issiqlikning metallga taʼsir etish usuli qanday va bu jarayonni qanday tezlashtiradi?", "Har bir elektrod bilan metall orasida yoy yonadi, bu esa issiqlikni metalga toʻgʻridan-toʻgʻri taʼsirini oshiradi.", "Shixta elektrodlar orasida hosil boʻlgan tapsirda erib, bilvosita issiqlik uzatilishini taʼminlaydi va sekinlashadi.", "Metallni qizigan havo oqimi yordamida eritadi, bunda yoyning roli faqat qoʻshimcha isitish vazifasidir.", "Metallni pech devorlari orqali isitadi, yoy esa faqat pech ichidagi atmosfera haroratini oshirishga xizmat qiladi."], ["Bir tonna poʻlat olish uchun elektr yoy pechlarida qancha elektr energiyasi sarflanadi?", "Odatda 700-800 Kvt/soat elektr energiyasi sarflanadi, qoʻshimcha elektrodlar ham ishlatiladi.", "Odatda 150-200 Kvt/soat elektr energiyasi sarflanadi, bu juda tejamkor jarayon hisoblanadi.", "Odatda 2000-2500 Kvt/soat elektr energiyasi sarflanadi, bu yuqori haroratlarni taʼminlash uchun kerak.", "Odatda 300-400 Kvt/soat elektr energiyasi sarflanadi, shunda grafit elektrodlar kamroq yonadi."], ["Yuqori chastotali induksion elektr pechlarida poʻlat eritish jarayonining asosiy printsipi nimaga asoslangan?", "Elektromagnit energiyaning induksiya yoʻli bilan metallni toʻgʻridan-toʻgʻri qizdirishga asoslangan.", "Elektr yoyining yuqori haroratidan foydalangan holda metallni eritish printsipiga asoslanadi.", "Kimyoviy reaksiyalar natijasida ajralib chiqqan issiqlikdan foydalangan holda metallni eritishga asoslanadi.", "Gazsimon yoqilgʻi va havo aralashmasining yonishi natijasida hosil boʻlgan issiqlikdan foydalanishga asoslanadi."], ["Poʻlat olishda kombinasiyalashgan (dupleks yoki tripleks) usullarning asosiy maqsadi nimadan iborat?", "Kimyoviy tarkibi aniq boʻlgan poʻlatni arzonroq va samaraliroq usulda olish, energiya sarfini kamaytirish.", "Faqatgina juda katta hajmdagi poʻlatlarni tezda eritish va qimmatli qotishma elementlarini ajratib olish.", "Har bir jarayon bosqichida turli xil yakuniy mahsulotlarni olish va ularni boshqa sanoatga yoʻnaltirish.", "Kam sifatli shixta materiallaridan yuqori sifatli poʻlatni yuqori narxda olish imkoniyatini yaratish."], ["Uglerod (C) va temir oksidi (FeO) oʻrtasidagi reaksiya Marten pechining jarayon oxirida qanday amalga oshadi?", "C + FeO = Fe + CO koʻrinishida sodir boʻladi, bu temirni metallga qaytarib, uglerod monoksidi hosil qiladi.", "2C + O₂ = 2CO reaksiyasi orqali uglerod faqat kislorod bilan birikadi, temir oksidiga taʼsir etmaydi.", "C + 2FeO = Fe₂C + O₂ koʻrinishida uglerod temir bilan birikib, karbid hosil qiladi va kislorod ajratadi.", "C + FeO = FeC + O reaksiyasi orqali uglerod temir karbidini hosil qilib, erigan metall tarkibida qoladi."], ["Rangli metallarning qaysi xususiyati ularni samolyotsozlik sanoatida keng qo'llashga sabab bo'ladi?", "Ular engil va mustahkam, bu esa aviatsiya texnikasi uchun muhim talab hisoblanadi.", "Ular elektrni juda yaxshi o'tkazadi, shu sababli samolyotlar elektr tizimida ishlatiladi.", "Ular yuqori issiqlik o'tkazuvchanlikka ega, dvigatel sovutish tizimlari uchun mos keladi.", "Ular korroziyaga to'liq chidamli bo'lgani sababli dengiz muhitida qo'llaniladi."], ["Mis rudalari asosan necha guruhga bo'linadi va ularning asosiy kimyoviy tarkibi qanday?", "Ikki guruhga: sulfidli rudalar (oltingugurt va temir birikmalari) va oksidli rudalar.", "Uch guruhga: karbonatli rudalar, silikatli rudalar va sof mis birikmalari hisoblanadi.", "To'rt guruhga: galoidli, fosfatli, nitratli va sof holdagi mis rudalari mavjuddir.", "Faqat bir guruhga, yaʼni mis sulfidlariga, chunki ular tabiatda eng ko'p uchraydi."], ["Sanoatda mis rudalaridan mis olish uchun ularning tarkibidagi sof mis miqdori qancha bo'lishi kerak?", "Odatda rudalar tarkibida 0.5% dan 3% gacha mis bo'lgan rudalar ishlatiladi.", "Mis rudalari tarkibida kamida 5% dan 10% gacha sof mis bo'lishi talab etiladi.", "Sanoatda mis olish uchun rudalarda 10% dan yuqori mis miqdori zarurdir.", "Mis rudalari tarkibida 0.1% dan 0.5% gacha mis bo'lsa ham foydali deb hisoblanadi."], ["Mis rudalarini boyitishning asosiy usullari nimalardan iborat bo'lib, ular qanday printsipga asoslangan?", "Solishtirma og'irligi bo'yicha ajratish va flotatsion usul, suv bilan namlanish farqiga asoslangan.", "Magnit separatsiya va eritish usuli, ularning magnit xususiyatlari va erish nuqtalari farqidan foydalanadi.", "Kimyoviy eritish va elektroliz usuli, metallarni reaksiyaga kirishish qobiliyatiga tayanadi.", "Vakuumda qizdirish va kondensatsiya, metallarining uchuvchanlik darajasiga asoslangan."], ["Sulfidli mis rudalarini ko'p tagli pechlarda qizdirish (yondirish) jarayonida qanday kimyoviy reaksiya sodir bo'ladi?", "Oltingugurt havo kislorodi bilan birikib, kükürt dioksid (SO₂) hosil qiladi va tashqariga chiqadi.", "Mis sulfidlari to'g'ridan-to'g'ri sof mis va oltingugurt dioksidiga parchalanadi va ajratiladi.", "Temir sulfid temir oksidi va kislorodga parchalanib, mis bilan reaksiyaga kirishadi.", "Mis oksidi karbonat angidrid bilan birikib, mis karbonatini hosil qiladi va gaz ajralmaydi."], ["Mis shteyni nimalardan iborat bo'lib, uning erish harorati qanday diapazonda joylashgan?", "Asosan mis sulfidi (Cu₂S) va temir sulfidi (FeS) hamda ozroq qo'shimchalar, 950-1150 °C.", "Sof mis va temir oksidi (FeO) aralashmasi, 1000-1200 °C haroratda eritiladi.", "Asosan mis oksidi (Cu₂O) va temir, 800-900 °C haroratda suyuq holatga o'tadi.", "Sulfat kislota va erigan mis birikmalari, 700-850 °C haroratda hosil bo'ladi."], ["Mis shteynini konvertorlash jarayonining birinchi davrida qanday kimyoviy reaksiyalar sodir bo'ladi?", "Temir sulfidi havo kislorodi bilan oksidlanib, temir oksidi va SO₂ hosil qiladi: FeS + 1.5 O₂ = FeO + SO₂.", "Mis sulfidi oksidlanib, mis oksidi va SO₂ gazi ajraladi: Cu₂S + 1.5 O₂ = Cu₂O + SO₂.", "Temir oksidi qum tuproq bilan birikib, shlak hosil qiladi: 2FeO + SiO₂ = Fe₂SiO₄.", "Mis oksidi qolgan mis sulfidi bilan reaksiyaga kirishib, sof misni qaytaradi."], ["Mis shteynini konvertorlash jarayonining ikkinchi davrida qanday asosiy reaksiya amalga oshiriladi?", "Mis sulfidining oksidlanishi va hosil bo'lgan mis oksidi bilan sof misni qaytarish: 2Cu₂O + Cu₂S = 6Cu + SO₂.", "Temir oksidi silikatlar bilan reaksiyaga kirishib, yanada ko'proq shlak hosil qiladi.", "Qolgan temir sulfidining karbonat angidrid bilan to'liq reaksiyasi sodir bo'ladi.", "Barcha oltingugurt komponentlari inert gazlar yordamida ajratib olinadi."], ["Olingan xomaki misni tozalashning hozirgi vaqtdagi asosiy usullari qaysilar?", "Olovli usul (reverberator pechlarda havo berish) va elektroliz usuli (elektrolitik vannalarda).", "Faqat gidrometallurgiya usuli, ya'ni eritmalar yordamida metallarni ajratish.", "Termik parchalash va distillash usuli, metallarni bug'latib tozalashga asoslangan.", "Mexanik filtratsiya va magnit ajratish usuli, suyuq metallardan aralashmalarni tozalash."], ["Alyuminiy rudalaridan toza alyuminiy oksidini olishning nam ishqorli usulida qanday asosiy reaksiya sodir bo'ladi?", "Al₂O₃ natriy sulfid (Na₂SO₃) bilan reaksiyaga kirishib, alyuminiy natriyli massani hosil qiladi: Al₂O₃+Na₂SO₃=Al₂O₃·Na₂O+SO₂.", "Alyuminiy oksidi to'g'ridan-to'g'ri suv bilan birikib, gidroksid holida cho'kmaga tushadi va tozalanadi.", "Temir oksidi karbonat angidrid bilan reaksiyaga kirishib, temir karbonatini hosil qiladi.", "Kremniy oksidi eritmada erib, keyinchalik kislota bilan neytrallanadi va ajratiladi."], ["Alyuminiy kriolitda (Na₃AlF₆) erigan gil tuproqlarni elektroliz qilish jarayonida qanday reaksiya yuz beradi?", "Alyuminiy oksidi uglerod bilan reaksiyaga kirishib, sof alyuminiy va karbon monoksidni hosil qiladi: Al₂O₃ + 3C = 2Al + 3CO.", "Kriolit elektrolizlanib, natriy va ftor gazini hosil qiladi, ular alyuminiy bilan birikadi.", "Uglerod elektrodlar alyuminiy bilan bevosita reaksiyaga kirishib, alyuminiy karbidini hosil qiladi.", "Alyuminiy oksidi to'g'ridan-to'g'ri metall alyuminiyga parchalanib, kislorod ajratadi."], ["Nima sababdan alyuminiyni to'g'ridan-to'g'ri metallurgiya usulida rudalardan ajratib olish mumkin emas?", "Alyuminiy oksidi (Al₂O₃) ning erish harorati juda yuqori (2200 °C) va kislorod bilan tez birikadi.", "Alyuminiy rudalari tarkibida juda ko'p temir mavjud, bu esa ajratish jarayonini murakkablashtiradi.", "Alyuminiy juda og'ir metal bo'lib, uning erish jarayoni uchun katta energiya talab qilinadi.", "Alyuminiy havoda juda tez oksidlanadi, shuning uchun sof holda olish qiyinlashadi."], ["Magniy olishning ikkita asosiy texnologik usuli nimalardan iborat?", "Magniy xloridlarini elektroliz qilish va magniy rudalarini termik yo'l bilan ajratish usuli.", "Gidrometallurgiya va magnit ajratish usuli, suyuq muhitda ajratishga asoslangan.", "Flotatsion usul va konsentratlash usuli, asosan rudalarni boyitish uchun qo'llaniladi.", "Vakuumda bug'latish va zonali eritish usuli, yuqori tozalikdagi metallarni olish uchun."], ["Magnezit (MgCO₃) dan elektroliz uchun MgCl₂ olishda qanday dastlabki bosqichlar amalga oshiriladi?", "Magnezitni 850-900°C da qizdirib, MgO hosil qilish (MgCO₃→MgO+SO₂), so'ngra xlorlash (MgO+C+Cl₂→MgCl₂+CO).", "Magnezitni to'g'ridan-to'g'ri elektroliz qilib, magniy va karbonat angidridni ajratib olish.", "Magnezitni suvda eritib, magniy gidroksidini hosil qilish va keyin uni xlor kislota bilan reaksiyaga kiritish.", "Magnezitni magnit yordamida ajratib, keyin uni yuqori bosim ostida eritib yuborish."], ["Magniy xloridini elektroliz qilish jarayonida anodda va katodda qanday mahsulotlar hosil bo'ladi?", "Katodda suyuq magniy ajraladi, anodda esa xlor gazi (Cl₂) ajralib chiqadi.", "Katodda natriy metali ajraladi, anodda esa kislorod gazi hosil bo'ladi.", "Katodda temir qotishmalari cho'kadi, anodda magniy oksidi hosil bo'ladi.", "Katodda alyuminiy metali ajraladi, anodda uglerod dioksidi (CO₂) hosil bo'ladi."], ["Termik usulda magniy olish jarayonining asosiy mohiyati nima?", "MgO ni koks yordamida yuqori haroratda (1900-2000°C) qaytarib, magniy bug'ini sovutish va tozalash.", "Magniy rudalarini suyuqlantirib, keyin ularni vakuum ostida distillash orqali ajratish.", "Magniy xloridini elektroliz qilib, hosil bo'lgan magniy eritmasini tozalash va quyish.", "Magniy oksidi aralashmasini suzib, metallarni kimyoviy reaksiyalar bilan ajratish usuli."], ["Titan ishlab chiqarishning texnologik jarayonida titanium tetraxloridini (TiCl₄) olish uchun qanday reaksiya qo'llaniladi?", "Briquetlangan TiO₂ ni uglerod va xlor gazi bilan reaksiyaga kiritish: TiO₂ + 2Cl₂ + C → TiCl₄ + CO₂.", "Titan dioksidini to'g'ridan-to'g'ri havo kislorodi bilan yuqori haroratda reaksiyaga kiritish.", "Titan rudalarini nitrat kislotasi bilan eritib, so'ngra titan nitratini xlorlash usuli.", "Titan karbidini xlorlash orqali titanium xloridini ajratib olish va tozalash."], ["Titanium tetraxloriddan (TiCl₄) g'ovak titan olish uchun qaysi qaytaruvchi elementlar ishlatiladi?", "TiCl₄ ni natriy (Na) yoki magniy (Mg) elementlari ishtirokida qaytarish: TiCl₄ + 2Mg = Ti + 2MgCl₂.", "TiCl₄ ni uglerod (C) yordamida yuqori haroratda qaytarish va so'ngra sovutish.", "TiCl₄ ni vodorod (H₂) gazi bilan reaksiyaga kiritib, titan va vodorod xloridini hosil qilish.", "TiCl₄ ni alyuminiy (Al) bilan reaksiyaga kiritib, titan va alyuminiy xloridini olish."], ["Rangli metallar orasida qaysi biri solishtirma og'irligi y=1.77 g/sm³ bo'lgan eng yengil konstruksion metal hisoblanadi?", "Magniy, u o'zining yengilligi va mustahkamligi bilan ko'plab sohalarda qo'llaniladi.", "Alyuminiy, u solishtirma og'irligi y=2.7 g/sm³ bo'lib, yengil metallar orasiga kiradi.", "Titan, uning solishtirma og'irligi y=4.5 g/sm³ bo'lib, qiyin sharoitlarda ishlatiladi.", "Mis, uning solishtirma og'irligi y=8.93 g/sm³ bo'lib, og'irroq metallar qatoriga kiradi."], ["Mis elektrolizlash vannasida katod va anod sifatida qanday materiallar ishlatiladi?", "Katod sifatida yupqa mis plastinkalari, anod sifatida esa quyma xomaki mis plitalari.", "Katod sifatida grafit bloklar, anod sifatida esa po'lat qobiq ishlatiladi.", "Katod sifatida zanglamaydigan po'lat, anod sifatida titan qotishmalari qo'llaniladi.", "Katod sifatida kumush plastinkalar, anod sifatida esa oltin qotishmalari qo'llaniladi."], ["Quymakorlik nima va uning asosiy maqsadi qanday tushunchalarni o'z ichiga oladi?", "Suyuq metall va qotishmalarni qoliplarga quyish orqali turli shakldagi buyumlar tayyorlash san'ati bo'lib, hosil qilingan mahsulot quyma deb ataladi.", "Faqat metallarni yuqori haroratda eritib, ularni kichik qismlarga bo'lish jarayoni hisoblanib, bu jarayon metallni qattiqlashtirishga qaratilgan.", "Turli xil metallar va plastmassalarni qizdirib, ularga shtamplash usuli orqali shakl berish texnologiyasi sanalib, asosan yupqa detallar ishlab chiqariladi.", "Xomashyoni kesish va payvandlash orqali murakkab geometriyali qismlarni birlashtirish usuli bo'lib, bu jarayonda metallning faqat yuza qismi ishlanadi."], ["Qadimgi davrlarda quymakorlik san'atining rivojlanishi qaysi madaniy markazlar bilan chambarchas bog'liq bo'lgan?", "Misr, Gretsiya, Xitoy kabi sivilizatsiyalar eramizdan 5000 yil muqaddam metallardan quyma buyumlar tayyorlaganligi arxeologik qazishmalarda tasdiqlangan.", "Shimoliy Yevropa qabilalari va Janubi-Sharqiy Osiyo mamlakatlari yangi davrda ilk bor bronza va misdan quyma asboblar ishlab chiqarganlar.", "Lotariya va Qadimgi Rim imperiyasi faqat keyingi ming yilliklarda temir eritish usullarini topib, quymakorlikni joriy etganlar.", "O'rta Sharqning ilk sivilizatsiyalari, ayniqsa Ғarbiy Osiyodagi ba'zi qabilalar plastmassa asosidagi quymalarni rivojlantirganlar."], ["Quymakorlikning ilmiy asoslarini yaratishga qaysi rus olimlari muhim hissa qo'shganlar?", "A.S. Lavrov, N.V. Kalakutskiy, P.P. Anosov, P.M. Obuxov, D.K. Chernov, A.A. Baykov kabi olimlar o'z tadqiqotlari bilan ilmiy poydevorni mustahkamlaganlar.", "D.I. Mendeleyev, N.I. Lobachevskiy, I.P. Pavlov, A.S. Popov kabi olimlar kimyo va fizika sohasidagi ishlari bilan bilvosita yordam berganlar.", "S.P. Korolyov, I.V. Kurchatov, A.N. Tupolev, V.P. Glushko kabi muhandislar kosmik va atom texnologiyalari bilan quymakorlikni rivojlantirganlar.", "M.V. Lomonosov, K.E. Tsiolkovskiy, D.V. Skobeltsyn kabi akademiklar minerallar va metallurgiya jarayonlariga oid umumiy tushunchalarni shakllantirganlar."], ["Quymakorlik korxonalari ishlab chiqarilayotgan quymaning turi va seriyasiga qarab qanday turlarga bo'linadi?", "Individual, seriyali va ko'plab quymalar ishlab chiqaruvchi korxonalar mavjud bo'lib, har biri o'zining hajmi va quymaning turli-tumanligi bilan farqlanadi.", "Kichik, o'rta va yirik korxonalar sifatida tasniflanadi, ularning asosiy farqi faqat umumiy maydoni va ishchilar sonida ifodalanadi.", "Qo'lda ishlov berish korxonalari, mexanik ishlov berish korxonalari va avtomatlashtirilgan korxonalar bo'lib, ular faqat ishlatiladigan asbob-uskunalar turi bilan farqlanadi.", "An'anaviy, innovatsion va yuqori texnologiyali korxonalar deb ajratiladi, bu bo'linish faqat foydalanilayotgan materiallarning zamonaviyligiga bog'liqdir."], ["Quymakorlik sanoatida quyma detallar ishlab chiqarish uchun qolip turlari qanday asosiy toifalarga ajratiladi?", "Bir martalik (qum-gil asosli), muvaqqat (yuqori haroratga chidamli) va doimiy (cho'yan, po'lat, rangli qotishmalar) qoliplar qo'llaniladi.", "Faqat metall qoliplar va plastmassa qoliplari mavjud bo'lib, ular faqat ishlatiladigan xomashyo turiga qarab farqlanadi va boshqa turlari yo'q.", "Yumshoq qoliplar va qattiq qoliplar mavjud bo'lib, ularning asosiy farqi qolip materialining zichligi va mustahkamligida namoyon bo'ladi.", "Quruq qoliplar va nam qoliplar qolipning asosiy turlari bo'lib, ularning farqi faqat quyish jarayonidagi haroratga bog'liqdir."], ["Qolip aralashmasi qanday asosiy talablarga javob berishi kerakligi matnda qanday keltirilgan?", "U puxta, plastik, gaz o'tkazuvchan, o'tga chidamli, siqiluvchan, metallarga yopishmaydigan va tannarxi arzon bo'lishi talab qilinadi.", "U faqat yuqori zichlikka, suvga chidamlilikka va qattiqlikka ega bo'lishi kerak, boshqa xususiyatlar muhim emas deb hisoblanadi.", "Uning tarkibida faqat qum va loy bo'lishi, shuningdek, yuqori haroratda eruvchanlik xususiyatiga ega bo'lishi shartdir.", "U tez quriydigan, oson shakl oladigan va qayta ishlatiladigan bo'lishi kerak, shuningdek, juda og'ir bo'lmasligi lozimdir."], ["Opoka nima va u quymakorlik jarayonida qanday vazifani bajaradi?", "Opoka qolip materiallarida model aksini olishga ko'maklashuvchi ramadir, qolipning shaklini aniqlashda muhim ahamiyatga ega.", "Opoka suyuq metallni saqlash uchun idish bo'lib, uni to'g'ridan-to'g'ri qolip ichiga quyishda ishlatiladigan vositadir.", "Opoka tayyor quymani sovutish va uning hajmini kamaytirish uchun maxsus mo'ljallangan uskunadir, faqat sovitish jarayonida ishlatiladi.", "Opoka metall qotishmalarning kimyoviy tarkibini o'zgartirish uchun ishlatiladigan katalitik modda bo'lib, quyishdan avval aralashmaga qo'shiladi."], ["Quymakorlik tsexlarida quyma buyumlar (detallar) ishlab chiqarish texnologiyasi qanday operatsiyalarni o'z ichiga oladi?", "Metall qolip yuzasiga qatlam qoplash, qolipni yig'ish, metallni quyish, quymani ajratish va sirtlarni tozalash jarayonlari amalga oshiriladi.", "Faqat metallni eritish va uni maxsus pechlarda qattiqlashtirish, keyin esa tayyor buyumni jilolash operatsiyalarini o'z ichiga oladi.", "Modelni to'g'ridan-to'g'ri quymaga aylantirish, so'ngra uni bo'laklarga ajratish va har bir bo'lakni individual tarzda qayta ishlashdir.", "Faqat qolipni quritish va uning ichiga turli qo'shimchalar kiritish, keyin esa buyumni mexanik usullar bilan shakllantirishdir."], ["Model nima va uning tayyorlanadigan quymaga nisbatan o'lchamlari qanday farq qiladi?", "Model quyma detalning shakliga o'xshash bo'ladi, lekin uning o'lchamlari material kirishuvi sababli kattaroq qilinadi.", "Model tayyor quymadan har doim kichikroq o'lchamda bo'ladi, chunki u faqat quymaning tashqi ko'rinishini belgilaydi va ichki hajmini emas.", "Model va quyma bir xil o'lchamda bo'lishi shart, aks holda tayyorlash jarayonida aniqlik buziladi va detallar standartlarga mos kelmaydi.", "Model faqat quymaning texnik xususiyatlarini aks ettiradigan sxema bo'lib, uning o'lchami tayyorlanadigan detal bilan hech qanday aloqador emas."], ["Modellar qanday materiallardan tayyorlanadi va metall modellarning asosiy afzalligi nimada?", "Ular yog'och, metall qotishmalari va plastmassalardan tayyorlanadi; metall modellar xar xil muhitlarga chidamli bo'lib, o'lchamlarini uzoq vaqt saqlaydi.", "Modellar faqat yog'och va gipsdan tayyorlanadi; yog'och modellar eng yuqori aniqlikka ega bo'lib, ularni qayta-qayta ishlatish mumkin.", "Faqat metall va sopol materiallardan ishlanadi; sopol modellar yuqori issiqlikka chidamli bo'lib, harorat o'zgarishlariga toqat qiladi.", "Asosan rezina va shisha tolali materiallardan tayyorlanadi; rezina modellar egiluvchanligi tufayli murakkab shakllar uchun qulay hisoblanadi."], ["Modelni qolipdan oson chiqarish uchun uning vertikal yuzalari qanday tayyorlanishi kerak?", "Vertikal yuzalar ma'lum darajada qiya (DS ga muvofiq) qilib tayyorlanishi kerak, bu modelning qolipdan ajratilishini osonlashtiradi.", "Vertikal yuzalar mutlaqo tekis bo'lishi shart, aks holda qolip ichida havo cho'ntaklari hosil bo'lishi va quymanining sifati pasayishi mumkin.", "Vertikal yuzalar silliqlangan va yaltiroq bo'lishi kerak, bu qolipning ichki qismini himoya qilishga yordam beradi va uni korroziyadan saqlaydi.", "Vertikal yuzalar faqat kichik g'adir-budirliklar bilan qoplangan bo'lishi lozim, bu modelning qolipga yaxshiroq yopishishini ta'minlaydi."], ["Quymada bo'shliqlar hosil qilish uchun nimalardan foydalaniladi va ular qolipga qanday o'rnatiladi?", "Bo'shliqlar hosil qilish uchun sterjenlardan foydalaniladi; ular qolipdagi modelda qoldirilgan bur-tikchalar (tayanch yuzalar) yordamida o'rnatiladi.", "Bo'shliqlar maxsus suyuq gazlar yordamida hosil qilinadi; bu gazlar bevosita quyish jarayonida qolipga yuborilib, kerakli bo'shliqni shakllantiradi.", "Bo'shliqlar faqat modelning ichki qismiga o'yilgan chuqurliklar orqali yaratiladi; bu chuqurliklar qolipni to'g'ridan-to'g'ri shakllantiradi.", "Bo'shliqlar qattiqlashgan metallni burg'ulash yoki frezalash orqali hosil qilinadi; bu jarayon quyma sovigandan keyin amalga oshiriladi."], ["Sterjen tayyorlanadigan materiallarning asosiy tarkibiy qismlari nimalardan iborat va bog'lovchi moddalarning vazifasi qanday?", "Asosiy tarkibiy qismlar kvarts qumi, gil va turli bog'lovchi moddalardir; bog'lovchi moddalarning vazifasi sterjenni yetarli darajada puxta qilishdan iborat.", "Faqat metall kukuni va kimyoviy erituvchilardan iborat; erituvchilar sterjenni plastik holatga keltirish va unga shakl berish uchun ishlatiladi.", "Asosan loy va suvdan tashkil topadi; suvning vazifasi sterjenni sovutish va uning hajmini kamaytirishdan iboratdir.", "Faqat organik materiallar va to'ldiruvchilardan iborat; to'ldiruvchilar sterjenning og'irligini kamaytirish va uni oson qayta ishlash uchun qo'llaniladi."], ["Tayyorlangan sterjenlar qanday haroratda va qancha vaqt davomida quritiladi?", "Ular tegishli pechda 200°C dan 400°C gacha temperaturada 5-10 soat davomida quritiladi, bu ularning puxtaligini ta'minlaydi.", "Ular xona haroratida, ya'ni 20°C atrofida, bir necha kun davomida tabiiy ravishda quritiladi, bu jarayon juda sekin amalga oshadi.", "Ular 100°C dan past haroratlarda, taxminan 1-2 soat davomida quritiladi, bu sterjenning yuzasini qotirish uchun yetarli hisoblanadi.", "Ular juda yuqori haroratda, ya'ni 500°C dan ortiqda, qisqa muddat (30 daqiqa) davomida quritiladi, bu ularning qattiqligini oshirishga xizmat qiladi."], ["Po'lat quyma uchun suyuqlantirilgan metallning harorati qaysi diapazonda bo'lishi kerak?", "Po'lat uchun suyuqlantirilgan metallning harorati odatda 1500–1600°C oralig'ida bo'ladi, bu optimal quyish sharoitini ta'minlaydi.", "Po'lat uchun metallning harorati 1100–1200°C oralig'ida bo'lishi kerak, bu uning yopishqoqligini kamaytirish uchun zarurdir.", "Po'lat uchun metall harorati 1300–1400°C oralig'ida bo'lishi lozim, bu uning qotish jarayonini tezlashtirishga yordam beradi.", "Po'lat uchun harorat 1700–1800°C dan oshmasligi kerak, chunki bu uning kristal tuzilishini buzishi mumkin."], ["Quyma devori qanchalik yupqa bo'lsa, quyiladigan metall yoki qotishmaning temperaturasi qanday o'zgarishi talab qilinadi?", "Quyma devori qanchalik yupqa bo'lsa, quyiladigan metall yoki qotishmaning temperaturasi shuncha yuqori bo'lishi talab qilinadi.", "Quyma devori qanchalik yupqa bo'lsa, quyiladigan metallning temperaturasi shuncha past bo'lishi kerak, bu sirt sifatini yaxshilaydi.", "Quyma devorining qalinligi metall quyish haroratiga ta'sir qilmaydi, harorat har doim standart qiymatlarda saqlanishi shart.", "Yupqa devorli quymalar uchun metall harorati o'rtacha bo'lishi kerak, chunki juda yuqori harorat metallning tez qattiqlashishiga olib keladi."], ["Quyma detallarning og'irlik jihatidan mashina detallari tarkibidagi ulushi qancha foizni tashkil qiladi?", "Turli mashina detallarining og'irlik jihatdan qariyb 40-80% i quyma tarzida olinadi, bu ularning ahamiyatini ko'rsatadi.", "Mashina detallarining faqat 10-20% gacha bo'lgan qismi quyma usulida tayyorlanadi, qolganlari mexanik ishlov berish orqali hosil qilinadi.", "Mashina detallarining taxminan 25-30% i quyma usulda olinadi, bu asosan faqat katta va murakkab geometriyali detallarga tegishli.", "Dezallarning 90% dan ortig'i quyma usulda tayyorlanadi, chunki bu eng tejamkor va samarali ishlab chiqarish usuli hisoblanadi."], ["Qotishmalarning erkin chiziqli kirishuvini (%) hisoblash uchun qaysi formula qo'llaniladi?", "Δl_ch.k = (l_m - l_q) / l_m * 100%, bu yerda l_m – model uzunligi, l_q – quymanining uzunligi.", "Δl_ch.k = (l_q - l_m) / l_q * 100%, bu yerda l_q – quymanining uzunligi, l_m – model uzunligi.", "Δl_ch.k = (l_m + l_q) / l_m * 100%, bu yerda l_m – model uzunligi, l_q – quymanining uzunligi.", "Δl_ch.k = (l_m * l_q) / (l_m + l_q) * 100%, bu yerda l_m – model uzunligi, l_q – quymanining uzunligi."], ["Qalaysiz bronza uchun chiziqli kirishuv darajasi qancha foizni tashkil etadi?", "Qalaysiz bronza uchun chiziqli kirishuv darajasi 2.3–2.5% ni tashkil etadi, bu uning quyish xususiyatlaridan biridir.", "Qalaysiz bronza uchun chiziqli kirishuv darajasi 1.0–0.3% oralig'ida bo'lib, u juda kam miqdorni tashkil qiladi.", "Qalaysiz bronza uchun chiziqli kirishuv darajasi 0.9–1.2% ni tashkil etadi, bu boshqa qotishmalarga nisbatan yuqoriroqdir.", "Qalaysiz bronza uchun chiziqli kirishuv darajasi 1.7–2.0% ni tashkil etadi, bu uni eng tez qotadigan materialga aylantiradi."], ["Modellarning yuzasiga nam o'tkazmaydigan bo'yoqlar berishdan maqsad nima?", "Yog'och modellar nam tortmasligi uchun ularning sirti nam o'tkazmaydigan bo'yoqlar bilan bo'yaladi, bu ularning ishlash muddatini uzaytiradi.", "Modellarning yuzasini estetik ko'rinishini yaxshilash maqsadida bo'yaladi, chunki bu ularning sotilishiga ijobiy ta'sir ko'rsatadi.", "Bo'yoqlar modellarni qoliplarga yopishishdan himoya qilish uchun ishlatiladi, bu ularning oson ajratilishini ta'minlaydi.", "Bo'yoqlar modelning issiqlik o'tkazuvchanligini oshirish uchun ishlatiladi, bu ularning qotish jarayonini tezlashtiradi."], ["Sanoat miqyosida quymalar olishning asosiy maxsus usullari qaysilar?", "Kokillarga quyish, markazdan qochirma quyish, bosim ostida quyish, suyuqlanuvchan modellardan foydalanish hamda qobiq qoliplarga quyish.", "Quymani plastmassa qoliplarga quyish, termal shok quyish, vakuum ostida eritish hamda kristalizatsiya.", "Metallarni eritib, so'ngra ularni lazer yordamida shakllantirish, sovutib presslash va yuqori bosimda kesish.", "Kompyuter nazorati ostida metallni erish jarayoni, muzlatish va elektrokimyoviy usullar yordamida qayta ishlash."], ["Kokillarga quyish usulining asosiy afzalliklari nimadan iborat?", "Mehnat unumini oshirish, quyma sirt sifatini va mexanik xossalarini yaxshilash, ortiqcha qalinligini kamaytirish.", "Energiyani tejash, qayta ishlash jarayonini soddalashtirish, qolipning uzoq muddat xizmat qilishini ta'minlash.", "Metallning yuqori darajada erishi, qolipning tez sovishi, material sarfini kamaytirish va chiqindilarni qayta ishlash.", "Ishlab chiqarish siklini tezlashtirish, haroratni bir xil ushlab turish, qolipni avtomatlashtirish va qo'shimcha materiallarga ehtiyo
